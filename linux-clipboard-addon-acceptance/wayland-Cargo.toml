[package]
name = "owned-clipboard-wayland-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wayland-server = "=0.31.14"
wayland-backend = "=0.3.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["server"] }
wl-clipboard-rs = "=0.9.3"
rustix = { version = "1.1", features = ["fs"] }
os_pipe = "=1.2.3"

[profile.release]
opt-level = 2
codegen-units = 1
strip = "symbols"
