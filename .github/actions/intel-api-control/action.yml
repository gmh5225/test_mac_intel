name: Observe independent finite Intel HVF API control
description: Preserve bounded native witnesses and retirement with immutable progress windows
inputs:
  guest:
    description: Store then wait for timer, or explicitly exit with HLT
    required: true
  observation:
    description: Live observation or final evidence after native retirement
    required: true
  mode:
    description: vcpu retains one VM; vm recreates both VM and vCPU
    required: true
runs:
  using: node24
  main: run.cjs
