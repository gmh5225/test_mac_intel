name: NeverD n32 ELF32 memory and r11 SDK
on:
  push:
    branches: [codex/mips-n32-elf32-memory]
    paths: ['.github/workflows/neverd-mips-native-elf.yml']
permissions:
  contents: read
env:
  REVISION: f36ae44d679f836f26b04d2b53438c17ac3ac933
  LLVM_REVISION: 2bc46a924391617452eeed3a6846621147eaf889
  UNICORN_REVISION: 456fbb3b4f4b1c08ac95a562b736cd289c286ff4
  HOMEBREW_NO_AUTO_UPDATE: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, pkg: neverd-llvm-linux-x86_64}
          - {os: macos-15, cc: clang, cxx: clang++, pkg: neverd-llvm-macos-arm64}
          - {os: windows-latest, cc: clang-cl, cxx: clang-cl, pkg: neverd-llvm-windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify source identities
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse HEAD:third_party/llvm-project)" = "$LLVM_REVISION"
          test "$(git rev-parse HEAD:third_party/unicorn)" = "$UNICORN_REVISION"
          git submodule update --init --depth 1 third_party/capstone signatures third_party/unicorn
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes ninja-build clang-18 lld-18 g++-14
      - if: runner.os == 'macOS'
        run: brew install cmake ninja lld
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Select the Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/Install-WindowsFixtureClang.ps1 -AddToPath
      - name: Build the native ELF test owners against the hash-pinned SDK
        run: |
          set -o pipefail
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=('-DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14')
          fi
          configure() {
            cmake -S . -B build-check -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_ENABLE_CPU_EMULATION=OFF \
              -DNEVERD_ENABLE_WEB_ANALYSIS=OFF -DNEVERD_ENABLE_SEMANTIC_TESTS=ON "${args[@]}"
          }
          for delay in 0 15 45; do
            sleep "$delay"
            if configure 2>&1 | tee configure.log; then
              break
            fi
            if ! grep -Fq "Failed to download" configure.log || ! grep -Fq "https://github.com/NeverSight/llvm-project/releases/download/" configure.log; then
              exit 1
            fi
            if [[ "$delay" == 45 ]]; then exit 1; fi
            echo "Retrying the public LLVM release download after an HTTP failure."
          done
          python scripts/build.py build-check --config Release --parallel 4 --target \
            neverd-mips-bench NeverDMIPSTests NeverDMIPSFlowTests NeverDMIPSPipelineTests NeverDMIPSIntegerTests NeverDMIPSObjectTests NeverDMIPSSDKTests NeverDNativeExceptionRewriteContractTests NeverDLowScalarConstantTests NeverDFiniteScalarBranchTests NeverDMedPhiRecompositionTests
      - name: Run MIPS decoding, lifting, native object and public SDK suites
        run: |
          mkdir -p evidence
          ctest --test-dir build-check --build-config Release --parallel 4 --no-tests=error \
            -L '^(NeverDMIPSTests|NeverDMIPSFlowTests|NeverDMIPSPipelineTests|NeverDMIPSIntegerTests|NeverDMIPSObjectTests|NeverDMIPSSDKTests)$' \
            --output-on-failure --output-junit "$GITHUB_WORKSPACE/evidence/results.xml"
          ctest --test-dir build-check --build-config Release --parallel 4 --no-tests=error -R '^(ReplacementNativeCode[.]|ELFPatchSections[.]|MachOExceptionPatch[.])' --output-on-failure --output-junit "$GITHUB_WORKSPACE/evidence/layout.xml"
          ctest --test-dir build-check --build-config Release --parallel 4 --no-tests=error -L '^(NeverDLowScalarConstantTests|NeverDFiniteScalarBranchTests)$' --output-on-failure --output-junit "$GITHUB_WORKSPACE/evidence/scalar.xml"
          ctest --test-dir build-check --build-config Release --parallel 4 --no-tests=error -L '^NeverDMedPhiRecompositionTests$' --output-on-failure --output-junit "$GITHUB_WORKSPACE/evidence/med.xml"
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse('evidence/results.xml').findall('.//testcase')
          assert cases and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          names = [t.get('name', '') for t in cases]
          assert len(names)>=1194 and len(names)==len(set(names))
          assert names.count('MIPSEntryGP.N32HighDataAddressesKeepTheirELF32IdentityInAWideGPR') == 1
          assert sum('CompactRegisterCallsSampleTheCallableBeforeLink' in n for n in names)==4
          assert sum('ScalarMicroReleaseUsesTheABIRecord' in n for n in names)==4
          assert sum('Release6ZeroBaseAUIRetainsUpperSymbol' in n for n in names)==6
          for group,minimum in [('layout',23),('scalar',39)]:
              group_cases=ET.parse('evidence/'+group+'.xml').findall('.//testcase')
              assert len(group_cases)>=minimum and all(t.find(s) is None for t in group_cases for s in ('skipped','failure','error'))
              if group=='scalar':
                  assert sum('LowScalarConstant.Subbytes' in t.get('name','') for t in group_cases)==2
          for name in ('DoublewordProductsWriteBothAccumulatorHalves',
                       'DoublewordProductsRequirePreR6WideGPRs',
                       'FixedAddressMicroMIPS64LeafWithoutUnwindHasAnExactRange',
                       'LiftToObjectPreservesMicroEntryAndDelaySlot',
                       'FixedAddressMicroMIPS64R6LeafReturnsWithoutADelaySlot',
                       'FixedAddressMicroMIPS32R6LeafEndsWithCompactReturn',
                       'MicroR6UsesTheTaggedEntryAtRegisterWidth',
                       'RetainedN64GPDisplacementUsesBothSymbols',
                       'StaticGOTPageMustBeRebasedWhenItsCellIsRead',
                       'PlacedR6ImageUsesELFProfileForCodeAndFunctionPointers',
                       'N32RegisterCallUsesTheELFAddressAndCalleeMode'):
              assert any(name in n for n in names), name
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['REVISION']
          for directory, variable in [('third_party/llvm-project','LLVM_REVISION'), ('third_party/unicorn','UNICORN_REVISION')]:
              expected = os.environ[variable]
              observed = subprocess.check_output(['git', 'rev-parse', 'HEAD:'+directory], text=True).strip()
              assert observed == expected, (directory, expected, observed)
          checked_out = subprocess.check_output(['git', '-C', 'third_party/unicorn', 'rev-parse', 'HEAD'], text=True).strip()
          assert checked_out == os.environ['UNICORN_REVISION']
          assert sum('LiftToObjectPreservesMicroEntryAndDelaySlot' in n for n in names) == 6
          assert sum('LiftToObjectRetainsMicroR6ISAAndCompactReturn' in n for n in names) == 6
          cache = Path('build-check/CMakeCache.txt').read_text()
          path = re.search(r'^LLVM_DIR:[^=]+=(.+)$', cache, re.M)
          assert path, 'missing LLVM package path'
          info = (Path(path[1].strip()).parents[2] / 'BUILDINFO.txt').read_text()
          assert ('llvm_commit: ' + os.environ['LLVM_REVISION']) in info
          assert 'targets: X86;ARM;AArch64;Mips' in info and 'neverd-llvm-v23.0.0-r11' in path[1]
          Path('evidence/unicorn.txt').write_text(checked_out + '\n')
          Path('evidence/BUILDINFO.txt').write_text(info)
          Path('evidence/neverd.txt').write_text(os.environ['REVISION'] + '\n')
          print(len(names), 'registered cases on', os.environ['RUNNER_OS'])
          PY
      - name: Compare the MIPS III and MIPS64 Release 2 decoders in both byte orders
        run: |
          python - <<'PY'
          """Time the NeverD decoder and its underlying Capstone iterator on matching words."""

          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import platform
          import random
          import statistics
          import subprocess
          import sys
          import tempfile


          def measure(binary, output):
              common = (
                  0x24840007, 0x00851021, 0x00851026, 0x8CA20000,
                  0xACA20004, 0x10850001, 0x00000000, 0x03E00008,
              )
              stages = ("decode", "capstone")
              profiles = {}
              rng = random.Random(20261124)
              with tempfile.TemporaryDirectory() as temp:
                  root = Path(temp)
                  words = (common + (0x0085102D, 0x64840007)) * 16
                  for name, isa in (("mips3", "MIPS III"), ("mips64", "MIPS64 Release 2")):
                      for order in ("big", "little"):
                          profile = name + ("el" if order == "little" else "")
                          raw = b"".join(word.to_bytes(4, order) for word in words)
                          (root / profile).write_bytes(raw)
                          profiles[profile] = {
                              "isa": isa, "endian": order,
                              "sha256": hashlib.sha256(raw).hexdigest(), "count": len(words), "pairs": [],
                          }

                  def run(name, stage, reps):
                      row = json.loads(subprocess.check_output(
                          [str(binary), name, stage, str(root / name), str(reps)], text=True
                      ))
                      assert row["repeats"] == reps and row["instructions_per_repeat"] == profiles[name]["count"]
                      assert row["cpu_seconds"] > 0 and row["wall_seconds"] > 0
                      return row

                  for name, profile in profiles.items():
                      count = profile["count"]
                      pilot_reps = math.ceil(8_000_000 / count)
                      pilot = {stage: run(name, stage, pilot_reps) for stage in stages}
                      assert pilot["decode"]["digest"] == pilot["capstone"]["digest"]
                      profile["digest"] = pilot["decode"]["digest"]
                      profile["pilot"] = pilot
                      fastest = min(row["cpu_seconds"] for row in pilot.values())
                      profile["reps"] = max(math.ceil(48_000_000 / count), math.ceil(1.2 * pilot_reps / fastest))

                  for block in range(8):
                      names = list(profiles)
                      rng.shuffle(names)
                      for name in names:
                          profile = profiles[name]
                          order = stages if (block + list(profiles).index(name)) % 2 == 0 else stages[::-1]
                          legs = {stage: run(name, stage, profile["reps"]) for stage in order}
                          assert all(row["digest"] == profile["digest"] for row in legs.values())
                          profile["pairs"].append({"order": order, "legs": legs})
                      print("finished paired block", block + 1, flush=True)

              for profile in profiles.values():
                  pairs = profile["pairs"]
                  assert sum(pair["order"][0] == "decode" for pair in pairs) == len(pairs) // 2
                  profile["minimum_cpu_seconds"] = min(r["cpu_seconds"] for pair in pairs for r in pair["legs"].values())
                  profile["median_decode_over_capstone"] = {
                      clock: statistics.median(p["legs"]["decode"][clock] / p["legs"]["capstone"][clock] for p in pairs)
                      for clock in ("cpu_seconds", "wall_seconds")
                  }
                  ratios = [p["legs"]["decode"]["cpu_seconds"] / p["legs"]["capstone"]["cpu_seconds"] for p in pairs]
                  draws = sorted(statistics.median(rng.choices(ratios, k=len(ratios))) for _ in range(10000))
                  profile["median_cpu_ratio_interval95"] = [draws[249], draws[9749]]
              report = {
                  "source": os.environ["REVISION"], "host": platform.platform(), "runner_os": os.environ["RUNNER_OS"],
                  "executable_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(), "profiles": profiles,
              }
              output.write_text(json.dumps(report, indent=2) + "\n")


          ext = '.exe' if os.name == 'nt' else ''
          measure(Path('build-check/bin/neverd-mips-bench' + ext).resolve(), Path('evidence/classic-decoder.json'))
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: n32-elf32-memory-${{ runner.os }}
          path: |
            evidence/
            build-check/Testing/Temporary/LastTest.log
            build-check/neverd-build-receipt.json
            build-check/neverd-dependency-inputs.json
