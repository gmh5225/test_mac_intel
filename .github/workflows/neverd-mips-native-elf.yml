name: NeverD microMIPS64 R6 native ELF
on:
  push:
    branches: [codex/micromips64-neverd-r10]
    paths: ['.github/workflows/neverd-mips-native-elf.yml']
permissions:
  contents: read
env:
  REVISION: 5f80feeafdfb216392e67da627aa8dd22a671258
  LLVM_REVISION: 1c37d515ef3b12e8923390f95dc49052a966f00f
  UNICORN_REVISION: 34afc42471e2aa56428ee0bc5b9687ef7729d94b
  HOMEBREW_NO_AUTO_UPDATE: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, pkg: neverd-llvm-linux-x86_64}
          - {os: macos-15, cc: clang, cxx: clang++, pkg: neverd-llvm-macos-arm64}
          - {os: windows-latest, cc: clang-cl, cxx: clang-cl, pkg: neverd-llvm-windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify source identities
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse HEAD:third_party/llvm-project)" = "$LLVM_REVISION"
          test "$(git rev-parse HEAD:third_party/unicorn)" = "$UNICORN_REVISION"
          git submodule update --init --depth 1 third_party/capstone signatures third_party/unicorn
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes ninja-build clang-18 lld-18 g++-14
      - if: runner.os == 'macOS'
        run: brew install cmake ninja lld
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Select the Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/Install-WindowsFixtureClang.ps1 -AddToPath
      - name: Build the native ELF test owners against the hash-pinned SDK
        run: |
          set -o pipefail
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=('-DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14')
          fi
          configure() {
            cmake -S . -B build-check -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_ENABLE_CPU_EMULATION=OFF \
              -DNEVERD_ENABLE_WEB_ANALYSIS=OFF -DNEVERD_ENABLE_SEMANTIC_TESTS=ON "${args[@]}"
          }
          for delay in 0 15 45; do
            sleep "$delay"
            if configure 2>&1 | tee configure.log; then
              break
            fi
            if ! grep -Fq "Failed to download" configure.log || ! grep -Fq "https://github.com/NeverSight/llvm-project/releases/download/" configure.log; then
              exit 1
            fi
            if [[ "$delay" == 45 ]]; then exit 1; fi
            echo "Retrying the public LLVM release download after an HTTP failure."
          done
          python scripts/build.py build-check --config Release --parallel 4 --target \
            NeverDMIPSFlowTests NeverDMIPSPipelineTests NeverDMIPSIntegerTests NeverDMIPSObjectTests NeverDMIPSSDKTests NeverDNativeExceptionRewriteContractTests NeverDLowScalarConstantTests NeverDFiniteScalarBranchTests
      - name: Run MIPS decoding, lifting, native object and public SDK suites
        run: |
          mkdir -p evidence
          ctest --test-dir build-check --build-config Release --parallel 4 --no-tests=error \
            -L '^(NeverDMIPSFlowTests|NeverDMIPSPipelineTests|NeverDMIPSIntegerTests|NeverDMIPSObjectTests|NeverDMIPSSDKTests)$' \
            --output-on-failure --output-junit "$GITHUB_WORKSPACE/evidence/results.xml"
          ctest --test-dir build-check --build-config Release --parallel 4 --no-tests=error -R '^(ReplacementNativeCode[.]|ELFPatchSections[.]|MachOExceptionPatch[.])' --output-on-failure --output-junit "$GITHUB_WORKSPACE/evidence/layout.xml"
          ctest --test-dir build-check --build-config Release --parallel 4 --no-tests=error -L '^(NeverDLowScalarConstantTests|NeverDFiniteScalarBranchTests)$' --output-on-failure --output-junit "$GITHUB_WORKSPACE/evidence/scalar.xml"
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse('evidence/results.xml').findall('.//testcase')
          assert cases and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          names = [t.get('name', '') for t in cases]
          assert len(names)>=1078 and len(names)==len(set(names))
          for group,minimum in [('layout',23),('scalar',39)]:
              group_cases=ET.parse('evidence/'+group+'.xml').findall('.//testcase')
              assert len(group_cases)>=minimum and all(t.find(s) is None for t in group_cases for s in ('skipped','failure','error'))
              if group=='scalar':
                  assert sum('LowScalarConstant.Subbytes' in t.get('name','') for t in group_cases)==2
          for name in ('DoublewordProductsWriteBothAccumulatorHalves',
                       'DoublewordProductsRequirePreR6WideGPRs',
                       'FixedAddressMicroMIPS64LeafWithoutUnwindHasAnExactRange',
                       'LiftToObjectPreservesMicroEntryAndDelaySlot',
                       'FixedAddressMicroMIPS64R6LeafReturnsWithoutADelaySlot',
                       'PlacedR6ImageUsesELFProfileForCodeAndFunctionPointers',
                       'N32RegisterCallUsesTheELFAddressAndCalleeMode'):
              assert any(name in n for n in names), name
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['REVISION']
          for directory, variable in [('third_party/llvm-project','LLVM_REVISION'), ('third_party/unicorn','UNICORN_REVISION')]:
              expected = os.environ[variable]
              observed = subprocess.check_output(['git', 'rev-parse', 'HEAD:'+directory], text=True).strip()
              assert observed == expected, (directory, expected, observed)
          checked_out = subprocess.check_output(['git', '-C', 'third_party/unicorn', 'rev-parse', 'HEAD'], text=True).strip()
          assert checked_out == os.environ['UNICORN_REVISION']
          assert sum('LiftToObjectPreservesMicroEntryAndDelaySlot' in n for n in names) == 6
          assert sum('LiftToObjectRetainsMicroR6ISAAndCompactReturn' in n for n in names) == 6
          cache = Path('build-check/CMakeCache.txt').read_text()
          path = re.search(r'^LLVM_DIR:[^=]+=(.+)$', cache, re.M)
          assert path, 'missing LLVM package path'
          info = (Path(path[1].strip()).parents[2] / 'BUILDINFO.txt').read_text()
          assert ('llvm_commit: ' + os.environ['LLVM_REVISION']) in info
          assert 'targets: X86;ARM;AArch64;Mips' in info and 'neverd-llvm-v23.0.0-r10' in path[1]
          Path('evidence/unicorn.txt').write_text(checked_out + '\n')
          Path('evidence/BUILDINFO.txt').write_text(info)
          Path('evidence/neverd.txt').write_text(os.environ['REVISION'] + '\n')
          print(len(names), 'registered cases on', os.environ['RUNNER_OS'])
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: micromips64-r10-${{ runner.os }}
          path: |
            evidence/
            build-check/Testing/Temporary/LastTest.log
            build-check/neverd-build-receipt.json
            build-check/neverd-dependency-inputs.json
