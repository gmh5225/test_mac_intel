name: Public seccomp helper build
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - seccomp-helper/**
      - .github/workflows/claude-seccomp-helper.yml
permissions:
  contents: read
jobs:
  build:
    name: Native ${{ matrix.arch }} seccomp helper and policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned public sources and run native kernel controls
        run: |
          python3 -m unittest discover -s seccomp-helper -p test_controls.py -v
          python3 seccomp-helper/build.py --arch ${{ matrix.arch }} --output seccomp-helper-build
      - name: Retain public helper sources and binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-seccomp-helper-${{ github.run_attempt }}
          path: seccomp-helper-build/public-seccomp-helper/
          if-no-files-found: error
          retention-days: 14
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-seccomp-helper-diagnostics-${{ github.run_attempt }}
          path: seccomp-helper-build/diagnostics/
          if-no-files-found: error
          retention-days: 14
