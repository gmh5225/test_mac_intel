name: WMF authored complete Darwin NSObject CVarArg static profiles
on:
  push:
    branches: [codex/wmf-nsobject-cvararg-darwin-static-r23916]
    paths:
      - .github/workflows/wmf-nsobject-cvararg-darwin-static.yml
      - wmf-nsobject-cvararg-darwin-static/**
permissions:
  contents: read
jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify twelve static collection boundaries
        run: python3 -B -m unittest discover -s wmf-nsobject-cvararg-darwin-static -p 'test_collect.py' -v
      - name: Compile authored CVarArg queries and retain complete static SDK exports
        run: python3 -B wmf-nsobject-cvararg-darwin-static/collect.py
      - name: Preserve raw static compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-nsobject-cvararg-darwin-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: wmf-nsobject-cvararg-darwin-static-records/
          if-no-files-found: error
          retention-days: 14
