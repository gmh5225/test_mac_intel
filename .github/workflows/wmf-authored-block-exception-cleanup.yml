name: WMF authored current Simulator Block exception cleanup
on:
  push:
    branches: [codex/wmf-simulator-provider-inventory]
    paths:
      - .github/workflows/wmf-authored-block-exception-cleanup.yml
      - wmf-block-exception-cleanup/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exceptions:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and execute only the new typed authored exception fixture
        run: python3 -B wmf-block-exception-cleanup/collect.py
      - name: Preserve complete new compiler inputs, native events and real failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-authored-platform7-block-exceptions-${{ github.run_attempt }}
          path: wmf-block-exception-cleanup-records/
          if-no-files-found: error
          retention-days: 14
