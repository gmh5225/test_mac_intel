name: Darwin signal and TLS image controls
on:
  push:
    branches: [codex/neverd-arm64e-resume-control]
    paths: [.github/workflows/neverd-resume-control.yml]
permissions:
  contents: write
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - name: Exercise captured originals and NeverD output on native Darwin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ulimit -c 0
          cd "$RUNNER_TEMP"
          gh release download neverd-captured-signal-tls-894665fa05a2 -R gmh5225/test_mac_intel -p captured-images.tgz
          echo '894665fa05a2e4b0b5e4fd3eb431686f1f1fab3ff4a5fb9b5c428d1441956620  captured-images.tgz' | shasum -a 256 -c -
          tar -xzf captured-images.tgz
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          errors = []
          def run(argv):
              print("RUN", *argv, flush=True)
              p = subprocess.run(argv, capture_output=True)
              print("EXIT", p.returncode, p.stdout.decode(errors="replace"), p.stderr.decode(errors="replace"), flush=True)
              if p.returncode:
                  errors.append(argv)
          for row in sorted(Path("signal").glob("*/*/*/args")):
              path = row.parent.resolve()
              offset, trace = row.read_text().split()
              for stack in ["0","1"]:
                  run([path/"driver", path/"image", path/"rules", offset, stack, trace])
          for driver in sorted(Path("tls").glob("*/*/driver")):
              path = driver.parent.resolve()
              for case in ["control", "published"]:
                  run([path/"driver", path/case, path.name])
          assert not errors,errors
          PYCODE
