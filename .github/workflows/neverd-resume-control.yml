name: Darwin sigreturn control
on:
  push:
    branches: [codex/neverd-arm64e-resume-control]
    paths: [resume-control/**, .github/workflows/neverd-resume-control.yml]
permissions:
  contents: read
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cross a real signal frame and rethrow through nested C++ cleanups
        working-directory: resume-control
        run: |
          set -euxo pipefail
          ulimit -c 0
          clang++ -std=c++20 -Iinclude control-plan.cpp -o "$RUNNER_TEMP/plan"
          clang++ -std=c++20 -target arm64e-apple-macos15 -O2 -Iinclude -Wall -Wextra -Werror delivery.cpp -o "$RUNNER_TEMP/driver"
          for opt in -O0 -O2; do
            clang++ -std=c++20 -target arm64e-apple-macos15 "$opt" -fno-omit-frame-pointer -dynamiclib scope.cpp -o "$RUNNER_TEMP/scope.dylib"
            offset=$(python3 - "$RUNNER_TEMP/scope.dylib" <<'PYCODE'
          import re,subprocess,sys
          path=sys.argv[1]
          start=int(re.search(r'(?m)^([0-9a-f]+) T _signal_scope$',subprocess.check_output(['nm','-an',path],text=True)).group(1),16)
          call=int(re.search(r'(?m)^([0-9a-f]+)\s+blraaz\b',subprocess.check_output(['otool','-tvV',path],text=True)).group(1),16)
          print(hex(call-start))
          PYCODE
            )
            for protected in 0 1; do
              if [[ $protected == 0 ]]; then pc=0; else pc=$offset; fi
              "$RUNNER_TEMP/plan" "$protected" "$pc" > "$RUNNER_TEMP/site"
              for alt in 0 1; do
                "$RUNNER_TEMP/driver" "$RUNNER_TEMP/scope.dylib" "$RUNNER_TEMP/site" 0 "$alt" 1
              done
            done
          done
