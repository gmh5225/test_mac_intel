name: Source-built Bun original native component roles
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - native-role-comparison/original_acceptance.py
      - seccomp-helper/source-runtime-pins.json
      - .github/workflows/claude-source-native-roles.yml
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Native ${{ matrix.arch }} source-engine original component roles
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Read the admitted source producer and implemented C roles
        id: runtime
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import json, os
          p=json.loads(Path('seccomp-helper/source-runtime-pins.json').read_bytes())
          assert p['schema_version']==4 and set(p['profiles'])=={'x64','arm64'}
          assert p['integration_strategy']=='single-rust-source-graph-with-c-source-libraries'
          roles='ugrep bfs' if all('ugrep_source_manifest_sha256' in r for r in p['profiles'].values()) else 'bfs'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('producer_run='+str(p['producer_run'])+'\n')
              f.write('roles='+roles+'\n')
          PY
      - name: Obtain the qualified public runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-source-bun-runtime-1
          path: source-runtime-artifact
          run-id: ${{ steps.runtime.outputs.producer_run }}
          github-token: ${{ github.token }}
      - name: Rehash the runtime and check exact byte validators
        run: |
          python3 -B seccomp-helper/source_runtime.py --arch ${{ matrix.arch }} --artifact source-runtime-artifact --output admitted-runtime
          python3 -B -m unittest discover -s native-role-comparison -p 'test_*.py' -v
      - name: Qualify the boundary then compare actual original roles
        run: python3 -B native-role-comparison/original_acceptance.py --arch ${{ matrix.arch }} --source-bun admitted-runtime/bun --roles ${{ steps.runtime.outputs.roles }} --output source-role-correspondence
      - name: Retain authored diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-linux-${{ matrix.arch }}-source-component-roles-${{ github.run_attempt }}
          path: |
            source-role-correspondence/diagnostics/
            admitted-runtime/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
