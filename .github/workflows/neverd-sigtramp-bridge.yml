name: Native Darwin system cursor continuation
on:
  push:
    branches: [codex/neverd-arm64e-sigtramp-recovery]
    paths: [neverd-sigtramp-bridge/**, .github/workflows/neverd-sigtramp-bridge.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 42e241cee0d12771d6accf198f0ca23f9b6799bc
          path: neverd
          persist-credentials: false
          sparse-checkout: |
            unittests/lift/aarch64
            include/neverd/runtime
            include/neverd/ir/intrinsics/AArch64
      - run: |
          ulimit -c 0
          python3 neverd-sigtramp-bridge/probe.py
