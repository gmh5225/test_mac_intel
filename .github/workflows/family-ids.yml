name: Replicate dedicated PowerPC alias throughput and prove mixed builds byte-identical
on:
  push:
    branches: [codex/dedicated-ppc-alias-elf-replication]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, flavor: first, replica: 1 }
          - { host: ubuntu-22.04, cc: clang, flavor: second, replica: 1 }
          - { host: ubuntu-24.04, cc: clang, flavor: first, replica: 1 }
          - { host: ubuntu-24.04, cc: clang, flavor: second, replica: 1 }
          - { host: ubuntu-24.04-arm, cc: clang, flavor: first, replica: 1 }
          - { host: ubuntu-24.04-arm, cc: clang, flavor: second, replica: 1 }
          - { host: ubuntu-24.04, cc: gcc, flavor: first, replica: 1 }
          - { host: ubuntu-22.04, cc: clang, flavor: first, replica: 2 }
          - { host: ubuntu-24.04, cc: clang, flavor: first, replica: 2 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 3af4f18baa8c88ed070a71f48c53e28bb38f8fc7
          path: source
          persist-credentials: false
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: dedicated-alias-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}-${{ matrix.replica }}
          retention-days: 14
