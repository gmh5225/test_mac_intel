name: Validate compressed RISC-V with two native AArch64 Clang versions
on:
  push:
    branches: [codex/riscv-compressed-arm-clang-versions]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04-arm, cc: clang-14, flavor: first }
          - { host: ubuntu-24.04-arm, cc: clang-14, flavor: repeat }
          - { host: ubuntu-24.04-arm, cc: clang-18, flavor: first }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 6fbeffec215f3c7c79169c655b0928c616b46152
          path: source
          persist-credentials: false
      - name: Select native distribution Clang
        run: |
          if ! command -v "$CC" >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends "$CC"
          fi
          "$CC" --version
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: riscv-native-clang-versions-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
