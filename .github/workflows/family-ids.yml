name: Check the SystemZ length dispatcher and register spelling in a ten-architecture library
on:
  push:
    branches: [codex/systemz-width-real-cross-arch]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, flavor: first }
          - { host: ubuntu-22.04, cc: clang, flavor: second }
          - { host: ubuntu-24.04, cc: clang, flavor: first }
          - { host: ubuntu-24.04, cc: clang, flavor: second }
          - { host: ubuntu-24.04-arm, cc: clang, flavor: first }
          - { host: ubuntu-24.04-arm, cc: clang, flavor: second }
          - { host: ubuntu-24.04, cc: gcc, flavor: first }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 372fbd2d967c5023371a12e0e406f8be2ec84ae5
          path: source
          persist-credentials: false
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: systemz-width-mixed-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
