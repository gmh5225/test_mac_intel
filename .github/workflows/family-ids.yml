name: Repeat PE32 detail and RISC-V scan on byte-identical libraries and four runners
on:
  push:
    branches: [codex/capstone-pe32-register-details]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, flavor: first }
          - { host: ubuntu-22.04, cc: clang, flavor: second }
          - { host: ubuntu-24.04, cc: clang, flavor: first }
          - { host: ubuntu-24.04, cc: clang, flavor: second }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 958b98cbbeb217ab3e8babe1de7175546ec82748
          path: source
          persist-credentials: false
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: pe32-detail-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
