name: Validate short x86 implicit write lists and the legacy vector bank in real programs
on:
  push:
    branches: [codex/short-x86-implicit-writes]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, flavor: first }
          - { host: ubuntu-22.04, cc: clang, flavor: second }
          - { host: ubuntu-24.04, cc: clang, flavor: first }
          - { host: ubuntu-24.04, cc: clang, flavor: second }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 6de392819bbc0d468ad7c30531271823416f655e
          path: source
          persist-credentials: false
      - if: matrix.flavor == 'first'
        run: command -v valgrind || (sudo apt-get -qq update && sudo apt-get -qq install -y valgrind)
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: bounded-x86-writes-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
