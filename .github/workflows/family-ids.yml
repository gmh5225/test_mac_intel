name: Attribute x86 detail and AArch64 scan costs to actual machine code
on:
  push:
    branches: [codex/capstone-compare-detail-attribution]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, flavor: full }
          - { host: ubuntu-24.04, cc: gcc, flavor: full }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 6fe0fa8c14c6dbae1510a70b3a0ba77514131bf7
          path: source
          persist-credentials: false
      - name: Prepare deterministic instruction, cache and branch simulation
        run: command -v valgrind >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq valgrind)
      - run: python3 -B family-ids/profile.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: compare-cost-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
