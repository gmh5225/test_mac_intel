name: Compare PowerPC alias text and operand details in both Mach-O public decode APIs
on:
  push:
    branches: [codex/qualify-ppc-alias-pass-darwin]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15-intel, cc: clang, flavor: first }
          - { host: macos-15, cc: clang, flavor: first }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 3af4f18baa8c88ed070a71f48c53e28bb38f8fc7
          path: source
          persist-credentials: false
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: ppc-alias-darwin-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
