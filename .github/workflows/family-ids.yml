name: Check dedicated ARM release, DIET, Debug, Make and the shipping six-backend product archives
on:
  push:
    branches: [codex/dedicated-arm-release-configurations]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, flavor: first }
          - { host: ubuntu-24.04-arm, cc: clang, flavor: first }
          - { host: macos-15, cc: clang, flavor: first }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 1d0673d2102cb4a31bc1f1d696d7fb7e8c29545f
          path: source
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/alias-venv"
          "$RUNNER_TEMP/alias-venv/bin/pip" -q install pyelftools==0.32
          "$RUNNER_TEMP/alias-venv/bin/python" -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/alias-venv"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: dedicated-arm-configs-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
