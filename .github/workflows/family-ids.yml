name: Repeat the AArch64 formatting observation on the same EPYC 9V45 model
on:
  push:
    branches: [codex/capstone-epyc-9v45-guard]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, flavor: r1 }
          - { host: ubuntu-24.04, cc: clang, flavor: r2 }
          - { host: ubuntu-24.04, cc: clang, flavor: r3 }
          - { host: ubuntu-24.04, cc: clang, flavor: r4 }
          - { host: ubuntu-latest, cc: clang, flavor: r1 }
          - { host: ubuntu-latest, cc: clang, flavor: r2 }
          - { host: ubuntu-latest, cc: clang, flavor: r3 }
          - { host: ubuntu-latest, cc: clang, flavor: r4 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 34465fdeaea6988c753bde5de6ab93942f65de36
          path: source
          persist-credentials: false
      - run: python3 -B family-ids/cpu.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: model-guard-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
