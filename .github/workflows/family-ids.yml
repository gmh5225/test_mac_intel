name: Compare loaded bytes in both selector representations and unoptimized UID storage
on:
  push:
    branches: [codex/compare-resident-selector-sections]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, flavor: first }
          - { host: ubuntu-24.04, cc: clang, flavor: first }
          - { host: ubuntu-24.04-arm, cc: clang, flavor: first }
          - { host: ubuntu-24.04, cc: gcc, flavor: first }
          - { host: macos-15-intel, cc: clang, flavor: first }
          - { host: macos-15, cc: clang, flavor: first }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 396483e58bf0bb8f4dd6e36daff8b0458bad2315
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 512ac40f11eda4f1998843f0de8f257723635945
          path: neverd
          sparse-checkout: cmake
          persist-credentials: false
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: exact-selector-sections-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
