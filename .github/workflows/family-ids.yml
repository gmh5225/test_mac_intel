name: Time native AArch64 bitfield aliases with the public operand type selected beside each spelling
on:
  push:
    branches: [codex/aarch64-direct-alias-type]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, flavor: first }
          - { host: ubuntu-24.04, cc: clang, flavor: first }
          - { host: macos-15, cc: clang, flavor: first }
          - { host: macos-15-intel, cc: clang, flavor: first }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 95
    env:
      CC: ${{ matrix.cc }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a5c08759df756b179578e97670e148fa7629e88c
          path: source
          persist-credentials: false
      - run: python3 -B family-ids/native.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: bitfield-direct-type-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.flavor }}
          retention-days: 14
