name: Build strict GCC static and shared x86 libraries with full, DIET, reduced and no-ATT tests
on:
  push:
    branches: [codex/capstone-gcc-native-batch-lookup]
    paths: [family-ids/**, .github/workflows/family-ids.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        profile: [full, diet, reduced, noatt]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: family-ids
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: ca73ea7f0c6aa0d618372481d6a29d9707c00d90
          path: source
          persist-credentials: false
      - run: python3 -B family-ids/check-ci.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: evidence/
          name: gcc-batch-${{ matrix.host }}-${{ matrix.profile }}
          retention-days: 14
