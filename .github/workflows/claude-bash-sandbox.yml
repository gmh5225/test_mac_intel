name: Native Bash sandbox reconstruction
on:
  workflow_dispatch:
    inputs:
      rebuild_search:
        description: Build the pinned public search dependency from source
        type: boolean
        default: false
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - seccomp-helper/**
      - .github/workflows/claude-bash-sandbox.yml
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    name: Native ${{ matrix.arch }} actual Bash sandbox
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Obtain the previously qualified public search dependency
        id: public_search
        if: github.event_name != 'workflow_dispatch' || !inputs.rebuild_search
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-search-helper-1
          path: public-search-helper
          run-id: 38874053349
          github-token: ${{ github.token }}
      - name: Select Python for the public source builder
        if: steps.public_search.outcome != 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild the pinned search dependency when requested or unavailable
        id: build_search
        if: steps.public_search.outcome != 'success'
        run: |
          python runtime-helpers/build.py --arch ${{ matrix.arch }} --libc glibc --output fresh-search
          printf '%s\n' 'BASH_SEARCH_HELPER_PATH=fresh-search/public-search-helper/rg' >> "$GITHUB_ENV"
      - name: Install namespace and proxy tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap=0.6.1-1ubuntu0.3 socat
      - name: Check authored validators and build the public helper
        run: |
          python3 -m unittest discover -s seccomp-helper -p 'test_*.py' -v
          python3 seccomp-helper/build.py --arch ${{ matrix.arch }} --output seccomp-helper-build --require-helper-command
      - name: Rebuild privately and compare the enforced Bash tool
        run: |
          python3 seccomp-helper/original_acceptance.py --arch ${{ matrix.arch }} --build seccomp-helper-build --output seccomp-bash-acceptance --bash-rg "${BASH_SEARCH_HELPER_PATH:-public-search-helper/rg}"
      - name: Retain public source build diagnostics when used
        if: always() && steps.build_search.outcome != 'skipped'
        run: |
          python3 -c "from pathlib import Path; import shutil; source=Path('fresh-search/diagnostics'); target=Path('seccomp-bash-acceptance/diagnostics/public-search-source-build'); target.parent.mkdir(parents=True,exist_ok=True); shutil.copytree(source,target) if source.exists() else None"
      - name: Retain diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-linux-${{ matrix.arch }}-bash-sandbox-diagnostics-${{ github.run_attempt }}
          path: seccomp-bash-acceptance/diagnostics/
          if-no-files-found: warn
          retention-days: 14
