name: Check named and unnamed CSR operands in cstool and cstest
on:
  push:
    branches: [codex/riscv-cstest-numeric-csr]
    paths: [capstone-make/**, .github/workflows/capstone-make-cstool.yml]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-make
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 499ddf54d2723f7357e92db138e4e9beb71b28a5
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Build cstest and verify the maintained RISC-V suite
        shell: bash
        run: python -B capstone-make/test.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: csr-suite-${{ matrix.host }}
          path: evidence/
          retention-days: 14
