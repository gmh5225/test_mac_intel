name: WMF public UIKit DynamicSelf static profiles
on:
  push:
    branches: [codex/wmf-uikit-dynamic-self-static-r14736]
    paths:
      - .github/workflows/wmf-uikit-trait-static.yml
      - wmf-uikit-trait-static/**
permissions:
  contents: read
jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify nine static collection boundaries
        run: python3 -B -m unittest discover -s wmf-uikit-trait-static -p 'test_collect.py' -v
      - name: Compile authored metadata queries and read SDK export declarations
        run: python3 -B wmf-uikit-trait-static/collect.py
      - name: Preserve raw public compiler and SDK export evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-uikit-trait-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: wmf-uikit-trait-static-records/
          if-no-files-found: error
          retention-days: 14
