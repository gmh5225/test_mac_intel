name: NeverD SGX runner and native enclave checks

on:
  push:
    branches: [codex/neverd-sgx-capabilities-20261109]
    paths:
      - neverd-sgx-capabilities/**
      - .github/workflows/neverd-sgx-capabilities.yml
  workflow_dispatch:
    inputs:
      linux_runner:
        description: Linux x64 runner label for native SGX verification
        type: string
        default: ubuntu-24.04
      capabilities_only:
        description: Check native SGX availability on the three runners
        type: boolean
        default: false
      verified_compiler_run:
        description: Optional prior run with the same NeverC revision and its compiler receipt
        type: string
        default: ''
      neverd_revision:
        description: NeverD source revision for the Linux software tests
        type: string
        default: 7a0f218965a75d714b5196c06003affc5818ffc0

permissions:
  contents: read
  actions: read

jobs:
  capabilities:
    name: SGX discovery / ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image:
          - ${{ inputs.linux_runner || 'ubuntu-24.04' }}
          - macos-15-intel
          - macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe CPUID, EPC and SGX driver access
        run: python3 neverd-sgx-capabilities/probe.py --output sgx-capabilities
      - name: Check out the Linux SGX selftests
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: torvalds/linux
          ref: 7d0a66e4bb9081d75c82ec4957c50034cb0ea449
          path: linux-sgx
          sparse-checkout: |
            tools/testing/selftests/sgx
            tools/testing/selftests/x86
            tools/include
            tools/scripts
            arch/x86/include
          persist-credentials: false
      - name: Build and exercise native enclave entry, exit and resume
        if: runner.os == 'Linux'
        run: python3 neverd-sgx-capabilities/native_selftest.py --linux linux-sgx --output sgx-capabilities
      - name: Retain capability, native build and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neverd-sgx-capability-${{ matrix.image }}
          path: sgx-capabilities/
          if-no-files-found: error
          retention-days: 14

  software:
    if: ${{ !inputs.capabilities_only }}
    name: NeverD x86 software semantics / Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    env:
      SCCACHE_GHA_ENABLED: 'true'
      NEVERD_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the NeverD revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ inputs.neverd_revision || '7a0f218965a75d714b5196c06003affc5818ffc0' }}
          path: NeverD
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Check out the portable x64 NeverC revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverC
          ref: 4f3e6b9ed8d3a2f1b4b6f680bbe9bf9b87cc78c0
          path: NeverC
          persist-credentials: false
      - name: Install the x64 build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes clang lld ninja-build
          git -C NeverD submodule update --init --depth 1 third_party/capstone third_party/unicorn
      - name: Grant the native KVM oracle access when present
        run: |
          if test -c /dev/kvm && ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
      - name: Configure current NeverC for the portable x64 host ISA
        working-directory: NeverC
        run: |
          cmake -S llvm -B build-portable -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DNEVERC_NATIVE_ARCH=OFF -DNEVERC_ENABLE_LTO=OFF -DNEVERC_INCLUDE_TESTS=OFF \
            -DNEVERC_ENABLE_PYTHON_PLUGINS=OFF -DNEVERC_BUNDLE_PYTHON_RUNTIME=OFF \
            -C neverc/cmake/caches/NeverC.cmake
      - name: Build current NeverC for the portable x64 host ISA
        if: ${{ !inputs.verified_compiler_run }}
        working-directory: NeverC
        run: |
          cmake --build build-portable --parallel 4 --target neverc
      - name: Restore the verified compiler
        if: ${{ inputs.verified_compiler_run }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.verified_compiler_run }}
          github-token: ${{ github.token }}
          name: neverc-portable-linux-x64
          path: NeverC/build-portable/bin
      - name: Restore its source and binary receipt
        if: ${{ inputs.verified_compiler_run }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.verified_compiler_run }}
          github-token: ${{ github.token }}
          name: neverd-x86-software
          path: previous-software
      - name: Check the compiler revision and digest, and build its headers
        if: ${{ inputs.verified_compiler_run }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, subprocess
          from pathlib import Path
          receipt = json.loads(Path("previous-software/compiler.json").read_text())
          actual = subprocess.check_output(["git", "-C", "NeverC", "rev-parse", "HEAD"], text=True).strip()
          compiler = Path("NeverC/build-portable/bin/neverc")
          with compiler.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          if actual != receipt["source_commit"] or digest != receipt["binary_sha256"]:
              raise SystemExit("Restored compiler differs from its checked source or binary receipt")
          compiler.chmod(0o755)
          PYTHON
          cmake --build NeverC/build-portable --parallel 4 --target neverc-resource-headers
      - name: Verify the running x64 compiler and generated code
        run: |
          python neverd-sgx-capabilities/prepare_neverc.py --source NeverC --compiler NeverC/build-portable/bin/neverc --output compiler-check
          mkdir -p software-evidence
          cp compiler-check/compiler.json software-evidence/
      - name: Retain the verified portable x64 compiler
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neverc-portable-linux-x64
          path: NeverC/build-portable/bin/neverc
          if-no-files-found: error
          retention-days: 2
      - name: Configure with the LLVM release pinned by NeverD
        working-directory: NeverD
        run: |
          cmake -S . -B build-check -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DNEVERD_LLVM_PREBUILT=ON -DBUILD_TESTING=ON \
            -DNEVERD_ENABLE_WEB_ANALYSIS=OFF -DNEVERD_ENABLE_CPU_EMULATION=OFF \
            -DNEVERD_BUILD_GUI=OFF -DNEVERD_BUILD_PLUGINS=OFF
      - name: Build the production execution, paging and generated C test owners
        working-directory: NeverD
        run: python scripts/build.py build-check --parallel 4 --target NeverDX64PagedExecutionTests NeverDX64ContinuationExportTests NeverDX86PagingTests NeverDX86LegacySourceTests neverd
      - name: Execute mixed-mode, SMM, SGX and asynchronous event regressions
        run: python neverd-sgx-capabilities/software_semantics.py --source NeverD --build NeverD/build-check --output software-evidence
      - name: Retain execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neverd-x86-software
          path: software-evidence/
          if-no-files-found: warn
          retention-days: 14
