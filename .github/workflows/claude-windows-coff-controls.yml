name: Native Windows typed COFF and BigObj namespace controls
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-native-components/coff_objects.py
      - windows-native-components/verify_coff_objects.py
      - windows-native-components/coff_ci.py
      - .github/workflows/claude-windows-coff-controls.yml
permissions:
  contents: read
jobs:
  qualify:
    name: Native Windows ${{ matrix.arch }} LLVM23 typed object controls
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
      - name: Verify real COFF C C++ EH COMDAT BigObj weak and overflow records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B windows-native-components/coff_ci.py --arch ${{ matrix.arch }} --output windows-coff-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-win32-${{ matrix.arch }}-COFF-controls-${{ github.run_attempt }}
          path: windows-coff-controls/public-controls/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-win32-${{ matrix.arch }}-COFF-control-diagnostics-${{ github.run_attempt }}
          path: windows-coff-controls/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
