name: NeverD ARM32 full Linux guest and Wine
on:
  workflow_dispatch:
  push:
    branches: [codex/neverd-native32-probe]
    paths:
      - 'emulated32/linux_*'
      - 'emulated32/pe-arm32/**'
      - '.github/workflows/neverd-emulated32-linux.yml'
permissions:
  contents: read
jobs:
  qemu-system-arm32:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install QEMU and build a Debian ARM32 guest
        shell: bash
        run: |
          mkdir emulated32-evidence
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-arm debootstrap e2fsprogs
          sudo debootstrap --arch=armhf --variant=minbase --include=python3,linux-image-armmp,busybox,wine32 bookworm guest https://deb.debian.org/debian 2>&1 | tee emulated32-evidence/bootstrap.log
          sudo mkdir -p guest/work
          sudo cp linux-arm32/qualified-images.zip emulated32/linux_guest.py guest/work/
          sudo cp -r emulated32/pe-arm32 guest/work/
          sudo tee guest/neverd-init >/dev/null <<'SH'
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          mkdir -p /dev/pts /dev/shm /tmp /run
          mount -t devpts devpts /dev/pts
          mount -t tmpfs -o mode=1777 tmpfs /dev/shm
          /bin/busybox hostname neverd-guest
          /bin/busybox ip link set lo up
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          export HOME=/root
          python3 /work/linux_guest.py
          sync
          /bin/busybox poweroff -f
          SH
          printf '127.0.0.1 localhost neverd-guest\n::1 localhost neverd-guest\n' | sudo tee guest/etc/hosts >/dev/null
          sudo chmod +x guest/neverd-init
          sudo chroot guest dpkg-query -W > emulated32-evidence/packages.txt
          truncate -s 3G guest.ext4
          sudo mkfs.ext4 -q -F -d guest guest.ext4
      - name: Boot and verify every guest observation
        run: python3 emulated32/linux_vm.py
      - name: Preserve full guest and host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: emulated32-linux-${{ github.sha }}
          path: emulated32-evidence
          if-no-files-found: error
