name: NeverD source patch examples documentation
run-name: Example documentation at ${{ inputs.source || '924b6de05f9a1526b00386c6ba07a2dc9e4b8d32' }}
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact examples documentation commit after native artifact audit
        type: string
        required: true
  push:
    branches: [codex/source-patch-expansion]
    paths: ['.github/workflows/neverd-source-patch-expansion-docs.yml']
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ inputs.source || '924b6de05f9a1526b00386c6ba07a2dc9e4b8d32' }}
  EXPECTED_PARENTS: 654f9cee7ad9558c7952baffc0f58b206130a148
  DOCUMENTATION_COMMIT: 924b6de05f9a1526b00386c6ba07a2dc9e4b8d32
  DOCUMENTATION_PARENT: 654f9cee7ad9558c7952baffc0f58b206130a148
  EXAMPLE_BASE: c8cd6516fe78e274d62765b7bb9a69ddce7cdf6e
concurrency:
  group: neverd-examples-docs-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Authenticate exact example guide changes and native source inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          source=os.environ['SOURCE_COMMIT'];parents=os.environ['EXPECTED_PARENTS'].split();base=os.environ['EXAMPLE_BASE']
          documentation=os.environ['DOCUMENTATION_COMMIT'];parent=os.environ['DOCUMENTATION_PARENT']
          assert all(re.fullmatch('[0-9a-f]{40}',v) for v in (source,parent,base,documentation,*parents))
          assert git('rev-list','--parents','-n','1','HEAD').split()==[source,*parents]
          assert git('rev-list','--parents','-n','1',documentation).split()==[documentation,parent]
          subprocess.run(['git','merge-base','--is-ancestor',documentation,source],check=True)
          if source!=documentation:
              assert len(parents)==2
              assert git('merge-tree','--write-tree',*parents).splitlines()[0]==git('rev-parse','HEAD^{tree}')
          assert not git('status','--porcelain','--untracked-files=no')
          subprocess.run(['git','merge-base','--is-ancestor',base,parent],check=True)
          paths=sorted(['examples/source-patch/README.md','docs/source-patching.md',*[f'docs/{locale}/source-patching.md' for locale in ('zh-CN','zh-TW','ja','ko','fr','de','es','it','ru','ar')]])
          assert sorted(git('diff','--name-only',parent,documentation).splitlines())==paths
          for p in paths:assert git('rev-parse',source+':'+p)==git('rev-parse',documentation+':'+p)
          code=sorted(['examples/source-patch/'+n for n in ('original.c','extra.c','header_section.c','replacement.c','run.py','plugin/patch.py')])
          for p in code:assert git('rev-parse',base+':'+p)==git('rev-parse',source+':'+p)
          links=lambda ref:[s for s in git('ls-tree','-r',ref).splitlines() if s.startswith('160000 ')]
          assert links(base)==links(source)
          evidence=pathlib.Path('example-doc-evidence');evidence.mkdir()
          record={'source_commit':source,'parent_commits':parents,'documentation_commit':documentation,'documentation_parent':parent,'example_base':base,'harness_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'files':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},'example_sources':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in code},'gitlinks':links(source)}
          (evidence/'source.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Verify documentation and formatter checker regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_check_docs_i18n scripts.tests.test_check_clang_format -v 2>&1 | tee example-doc-evidence/checker-tests.log
          python scripts/check_docs_i18n.py 2>&1 | tee example-doc-evidence/docs.log
      - name: Verify example C sources and complete change formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps clang-format==22.1.2
          clang-format --version | tee example-doc-evidence/formatter.log
          clang-format --dry-run --Werror examples/source-patch/*.c 2>&1 | tee example-doc-evidence/example-format.log
          python scripts/check_clang_format.py --base "$DOCUMENTATION_PARENT" --head "$DOCUMENTATION_COMMIT" 2>&1 | tee example-doc-evidence/diff-format.log
      - name: Preserve exact guide and format evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-patch-examples-docs-${{ env.SOURCE_COMMIT }}
          path: example-doc-evidence
          if-no-files-found: error
