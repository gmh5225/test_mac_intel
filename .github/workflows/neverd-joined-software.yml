name: Qualify distant arm64e signing routes on hosted macOS
on:
  push:
    branches: [codex/neverd-distant-signers-release]
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: neverd-joined-software
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NeverSight/NeverD
          ref: 3e97208726c57cb1c807eeaa194b2f0d61f8e653
          path: project
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build Release targets and execute the software regressions
        run: python3 neverd-joined-software/release.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joined-signing-release
          path: reports/
          if-no-files-found: error
          retention-days: 7
