name: NeverD original unmarked arm64e switches
on:
  push:
    branches: [codex/neverd-arm64e-inferred-layout-20261120]
    paths: [neverd-arm64e-controls/**, .github/workflows/neverd-arm64e-inferred-controls.yml]
permissions:
  contents: read
jobs:
  original:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: neverd-arm64e-controls
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ef4e4115776c0b00ec88cff974d0cbd6e7244632
          path: neverd
          persist-credentials: false
          sparse-checkout: |
            include/neverd/runtime
            include/neverd/ir/intrinsics/AArch64
      - run: python3 neverd-arm64e-controls/run.py
      - run: python3 neverd-arm64e-controls/entry.py neverd
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-${{ matrix.runner }}
          path: native-originals/
          retention-days: 3
          if-no-files-found: error
