name: Original Ugrep and Bfs component correspondence
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - native-role-comparison/original_acceptance.py
      - native-role-comparison/role-transport.c
      - native-role-comparison/accepted-candidates.json
      - .github/workflows/claude-extra-native-correspondence.yml
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Native ${{ matrix.arch }} original Ugrep and Bfs comparisons
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Obtain the exact independently checked public candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-extra-native-components-1
          path: public-candidates
          run-id: 38961650575
          github-token: ${{ github.token }}
      - name: Qualify authored controls then compare actual original roles
        run: python3 native-role-comparison/original_acceptance.py --arch ${{ matrix.arch }} --package public-candidates --output component-correspondence
      - name: Retain diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-linux-${{ matrix.arch }}-extra-component-correspondence-${{ github.run_attempt }}
          path: component-correspondence/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
