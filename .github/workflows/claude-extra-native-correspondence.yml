name: Original Ugrep and Bfs component correspondence
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - native-role-comparison/**
      - .github/workflows/claude-extra-native-correspondence.yml
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Native ${{ matrix.arch }} original Ugrep and Bfs comparisons
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Read the single admitted candidate producer
        id: candidates
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import json, os, re
          pins=json.loads(Path('native-role-comparison/accepted-candidates.json').read_bytes())
          assert pins['schema_version']==1 and type(pins['producer_run']) is int and pins['producer_run']>0
          assert re.fullmatch('[0-9a-f]{40}',pins['producer_head'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('producer_run='+str(pins['producer_run'])+'\n')
              bfs=pins.get('bfs_override')
              output.write('bfs_admitted='+str(bool(bfs)).lower()+'\n')
              if bfs:
                  assert type(bfs['producer_run']) is int and bfs['producer_run']>0 and re.fullmatch('[0-9a-f]{40}',bfs['producer_head'])
                  output.write('bfs_producer_run='+str(bfs['producer_run'])+'\n')
          PY
      - name: Obtain the exact independently checked public candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-extra-native-components-1
          path: public-candidates
          run-id: ${{ steps.candidates.outputs.producer_run }}
          github-token: ${{ github.token }}
      - name: Obtain the separately admitted portable Bfs
        if: ${{ steps.candidates.outputs.bfs_admitted == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-portable-bfs-1
          path: public-bfs-candidate
          run-id: ${{ steps.candidates.outputs.bfs_producer_run }}
          github-token: ${{ github.token }}
      - name: Check exact byte and exit validators
        run: python3 -B -m unittest discover -s native-role-comparison -p 'test_*.py' -v
      - name: Qualify authored controls then compare actual original roles
        run: |
          args=()
          if [ -d public-bfs-candidate ]; then args+=(--bfs-package public-bfs-candidate); fi
          python3 -B native-role-comparison/original_acceptance.py --arch ${{ matrix.arch }} --package public-candidates --output component-correspondence "${args[@]}"
      - name: Retain diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-linux-${{ matrix.arch }}-extra-component-correspondence-${{ github.run_attempt }}
          path: component-correspondence/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
