name: Native macOS Swift foreign-sheet geometry helpers
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-swift-window-geometry/**
      - .github/workflows/claude-macos-swift-window-geometry.yml
permissions:
  contents: read
jobs:
  components:
    name: Native macOS ${{ matrix.arch }} foreign-sheet geometry helpers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Stage private input batch 1
        env:
          NDC_SWIFT_V64G1_000: ${{ secrets.NDC_SWIFT_V64G1_000 }}
        run: python3 -B macos-swift-window-geometry/run.py receive 0 1
      - name: Compare foreign-sheet geometry and typed window descriptions with source package rebuild
        run: python3 -B macos-swift-window-geometry/run.py ${{ matrix.arch }}
      - name: Export encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-${{ matrix.arch }}-swift-window-geometry-encrypted-${{ github.run_attempt }}
          path: swift-window-geometry-encrypted-records/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
