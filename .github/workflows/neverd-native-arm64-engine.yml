name: Build and run NeverD on native Windows ARM64
on:
  push:
    branches: [codex/neverd-windows-native-20261120]
    paths:
      - .github/workflows/neverd-native-arm64-engine.yml
      - native-engine-revision.txt
      - native-driver-entry/compare.c
      - native-driver-entry/extract.py
      - native-driver-entry/shim.S
      - native-driver-entry/check_export_entries.py
      - native-driver-entry/export-entry-inputs.json
      - native-driver-entry/check_com_callbacks.py
      - native-driver-entry/process_sdk_smoke.c
      - native-driver-entry/prefetch_profile.py
      - native-driver-entry/check_native_process_profile.py
      - native-driver-entry/loader/**
permissions:
  contents: read
jobs:
  native-engine:
    runs-on: windows-11-arm
    timeout-minutes: 350
    env:
      SCCACHE_GHA_ENABLED: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            /native-engine-revision.txt
            /native-driver-entry/
          sparse-checkout-cone-mode: false
      - name: Read the tested source revision
        shell: pwsh
        run: |
          $rev = (Get-Content native-engine-revision.txt).Trim()
          if ($rev -notmatch '^[0-9a-f]{40}$') { throw 'invalid source revision' }
          "NEVERD_REV=$rev" >> $env:GITHUB_ENV
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ env.NEVERD_REV }}
          path: source
          submodules: false
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: arm64
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Build the Windows ARM64 engine from source
        id: engine
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git -c core.longpaths=true submodule update --init --depth 1 third_party/llvm-project third_party/capstone
          cmake -S . -B "$env:RUNNER_TEMP/nb" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc -DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=OFF -DNEVERD_BUILD_GUI=OFF -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_DRIVER_EMULATION=OFF -DNEVERD_ENABLE_Z3=OFF -DNEVERD_ENABLE_SEMANTIC_TESTS=OFF -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF
          python scripts/build.py "$env:RUNNER_TEMP/nb" --target neverd NeverDLocalTypesDebugContextTests NeverDPEHeaderMappingTests --parallel 4
      - name: Check full and restricted PE linker group ownership on Windows ARM64
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/nb/bin/NeverDPEHeaderMappingTests.exe" '--gtest_filter=PEHeaderMapping.LinkerGroupsClassifyMergedDataRelocations'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache the unprofiled native type reader for provider diagnostics
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/nb/bin/neverd.exe
          key: neverd-arm64-type-reader-${{ env.NEVERD_REV }}-1
      - name: Check the physical target, driver ABI and both decompiler outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $exe = "$env:RUNNER_TEMP/nb/bin/neverd.exe"
          $pe = [IO.File]::ReadAllBytes($exe)
          $nt = [BitConverter]::ToInt32($pe, 60)
          $machine = [BitConverter]::ToUInt16($pe, $nt+4)
          if ($machine -ne 0xaa64) { throw "Expected ARM64 executable, got $machine" }
          $root = "$env:RUNNER_TEMP/driver-evidence"
          New-Item -ItemType Directory -Path $root
          Copy-Item "$env:SystemRoot/System32/drivers/null.sys" "$root/null.sys"
          $imageHash = (Get-FileHash "$root/null.sys").Hash.ToLower()
          $signature = Get-AuthenticodeSignature "$root/null.sys"
          if ($signature.Status -ne 'Valid' -or $imageHash -ne '4d79cea45771d9ee36aa599add5528b6f969e874f150d031a942a3b44c0b20cd') { throw "Unexpected inbox image $imageHash $($signature.Status)" }
          Invoke-WebRequest 'https://msdl.microsoft.com/download/symbols/null.pdb/EB6E1428846168A1564CCEE4944580C31/null.pdb' -OutFile "$root/null.pdb"
          & "$env:RUNNER_TEMP/nb/bin/NeverDLocalTypesDebugContextTests.exe" '--gtest_filter=LocalTypesDebugContext.DriverContractBindsOnlyProvenEntries:LocalTypesDebugContext.AddressBoundDeclarationsFollowEditsInNamesOnlyCode'
          $fixtures = "$env:GITHUB_WORKSPACE/native-driver-entry"
          $proof = "$env:GITHUB_WORKSPACE/native-driver-verification.json"
          $observations = "$env:GITHUB_WORKSPACE/native-entry-observations.json"
          Set-Location $root
          python "$fixtures/extract.py" "$root/null.sys" init-shim.bin
          clang --target=aarch64-pc-windows-msvc -c "$fixtures/shim.S" -o shim.obj
          $rows = @()
          foreach ($route in @('high','llvm')) {
            $extra = @()
            if ($route -eq 'llvm') { $extra = @('--llvm') }
            & $exe decompile "$root/null.sys" '--func=GsDriverEntry' -o "$root/$route.c" @extra
            clang --target=aarch64-pc-windows-msvc -S -emit-llvm -O1 "$root/$route.c" -o "$root/$route.ll"
            $ir = Get-Content -Raw "$root/$route.ll"
            $pointer = 'ptr\b(?:[^,()\r\n]|\([^()\r\n]*\))*'
            $pointerPair = "$pointer,\s*$pointer"
            if ($ir -notmatch "(?m)^define\b[^\r\n]*\bi32 @GsDriverEntry\($pointerPair\)" -or
                $ir -notmatch "(?m)^declare\b[^\r\n]*\bi32 @DriverEntry\($pointerPair\)" -or
                $ir -notmatch '(?m)^declare\b[^\r\n]*\bvoid @__security_init_cookie\(\)') {
              throw "$route does not preserve the driver entry and CRT compiler contracts"
            }
            clang-cl --target=aarch64-pc-windows-msvc /nologo /O2 /c "/DGsDriverEntry=${route}_shim" /DDriverEntry=neverd_driver_entry /D__security_init_cookie=neverd_cookie "$root/$route.c" "/Fo$root/$route.obj"
            $code = Get-Content "$root/$route.c"
            $call = @($code | Where-Object { $_ -match '\bDriverEntry\s*\(' -and $_ -match '^\s+(?:return\s|\w+\s*=)' })
            if ($call.Count -ne 1 -or $call[0] -notmatch ',') { throw "$route lost a DriverEntry argument" }
            $rows += [ordered]@{route=$route; emitted_sha256=(Get-FileHash "$root/$route.c").Hash.ToLower(); compiled_arm64=$true; driver_arguments=2; entry_result_bits=32; cookie_parameters=0}
          }
          clang-cl --target=aarch64-pc-windows-msvc /nologo /O2 "$fixtures/compare.c" shim.obj high.obj llvm.obj /Fe:check.exe
          & "$root/check.exe" | Set-Content $observations
          if ((Get-Content $observations | ConvertFrom-Json).observations.Count -ne 15) { throw 'Incomplete native entry replay' }
          [ordered]@{revision=$env:NEVERD_REV; machine=$machine; engine_sha256=(Get-FileHash $exe).Hash.ToLower(); driver_sha256=$imageHash; pdb_sha256=(Get-FileHash "$root/null.pdb").Hash.ToLower(); routes=$rows} | ConvertTo-Json -Depth 6 | Set-Content $proof
      - name: Compile the exported storage, USB power and tracing driver callbacks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/nb/bin/NeverDLocalTypesDebugContextTests.exe" '--gtest_filter=LocalTypesDebugContext.KernelLibraryCallbacksUseTheTargetWDK'
          python native-driver-entry/check_export_entries.py --neverd "$env:RUNNER_TEMP/nb/bin/neverd.exe" --work "$env:RUNNER_TEMP/entry-exports" --report native-export-verification.json
      - name: Execute original SDK COM callbacks and both recovered views on ARM64
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/nb/bin/NeverDLocalTypesDebugContextTests.exe" '--gtest_filter=LocalTypesDebugContext.COMRegistrationUsesTheTargetUserABI'
          python native-driver-entry/check_com_callbacks.py --neverd "$env:RUNNER_TEMP/nb/bin/neverd.exe" --work "$env:RUNNER_TEMP/com-callbacks" --report native-com-observations.json
      - name: Run process-status and snapshot imports from the native Windows SDK
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $program = "$env:RUNNER_TEMP/process_sdk_smoke.exe"
          clang-cl --target=aarch64-pc-windows-msvc /nologo /W4 /WX /O2 /MD native-driver-entry/process_sdk_smoke.c psapi.lib kernel32.lib "/Fe:$program"
          $pe = [IO.File]::ReadAllBytes($program)
          $nt = [BitConverter]::ToInt32($pe, 60)
          $machine = [BitConverter]::ToUInt16($pe, $nt+4)
          if ($machine -ne 0xaa64) { throw "Invalid process SDK executable machine $machine" }
          $psapi = (dumpbin /nologo /imports:psapi.dll $program) -join "`n"
          $kernel = (dumpbin /nologo /imports:kernel32.dll $program) -join "`n"
          if ($psapi -notmatch '\bEnumProcessModulesEx\b' -or $kernel -notmatch '\bPssCaptureSnapshot\b' -or $kernel -notmatch '\bPssFreeSnapshot\b') { throw 'Unexpected SDK process import table' }
          $result = (& $program) | ConvertFrom-Json
          if (!$result.module_found -or $result.capture_status -ne 0 -or $result.release_status -ne 0) { throw 'Native process SDK smoke failed' }
          [ordered]@{revision=$env:NEVERD_REV; machine=$machine; executable_sha256=(Get-FileHash $program).Hash.ToLower(); psapi_import='EnumProcessModulesEx'; kernel32_imports=@('PssCaptureSnapshot','PssFreeSnapshot'); observation=$result} | ConvertTo-Json -Depth 5 | Set-Content native-process-sdk.json
      - name: Observe actual Windows loader arguments in original and recovered native DLLs
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/nb/bin/NeverDLocalTypesDebugContextTests.exe" '--gtest_filter=LocalTypesDebugContext.ExecutableDLLEntryBindsTheLoaderResultAndArguments'
          python native-driver-entry/loader/check_dll_loader.py --engine "$env:RUNNER_TEMP/nb/bin/neverd.exe" --work "$env:RUNNER_TEMP/dll-loader" --report native-dll-loader.json
      - name: Qualify the native engine with the official ARM64 SDK and WDK profile
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $nb = "$env:RUNNER_TEMP/nb"
          $exe = "$nb/bin/neverd.exe"
          $types = "$env:RUNNER_TEMP/sdk-types"
          $cache = "$env:RUNNER_TEMP/sdk-packages"
          $bootstrap = (Get-FileHash $exe).Hash
          $readobj = Get-Command llvm-readobj -ErrorAction SilentlyContinue
          $probe = Get-ChildItem "$env:WindowsSdkDir/Lib/*/um/arm64/psapi.lib" | Sort-Object FullName | Select-Object -Last 1
          if (!$probe) { throw 'Native SDK PSAPI import library missing' }
          $reader = if ($readobj) { $readobj.Source } else { $null }
          if (!$reader -or (((& $reader $probe.FullName) -join "`n") -notmatch '(?m)^Export name:\s*EnumProcessModulesEx\b')) {
            $toolbuild = "$env:RUNNER_TEMP/llvm-reader"
            cmake -S source/third_party/llvm-project/llvm -B $toolbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc -DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DLLVM_TARGETS_TO_BUILD=AArch64 -DLLVM_INCLUDE_TESTS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF
            cmake --build $toolbuild --target llvm-readobj --parallel 4
            $reader = "$toolbuild/bin/llvm-readobj.exe"
          }
          python native-driver-entry/prefetch_profile.py --scripts source/scripts --cache $cache
          $originalInclude = $env:INCLUDE
          try {
            # The generator supplies the kit paths. Preserve the build environment
            # after probing because clang-cl needs it to relink the native engine.
            Remove-Item Env:INCLUDE -ErrorAction SilentlyContinue
            python source/scripts/generate_microsoft_windows_types.py --architecture arm64 --ucrt --ucrt-compatibility --legacy-sdk --output "$types/arm64" --cache $cache --neverd $exe --clang clang --llvm-readobj $reader
          } finally {
            $env:INCLUDE = $originalInclude
          }
          cmake -S source -B $nb "-DNEVERD_WINDOWS_TYPES_DIRECTORY=$types/arm64"
          python source/scripts/build.py $nb --target neverd --parallel 4
          if ((Get-FileHash $exe).Hash -eq $bootstrap) { throw 'The native engine did not embed the official libraries' }
          python native-driver-entry/check_native_process_profile.py --source source --types $types --cache $cache --engine $exe --output "$env:RUNNER_TEMP/sdk-qual" --report native-sdk-profile.json
      - name: Report SDK tool diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/sdk-types"
          if (Test-Path $root) {
            Get-ChildItem -Recurse -File -Filter '*.log' $root |
              Sort-Object LastWriteTime -Descending | Select-Object -First 10 | ForEach-Object {
                Write-Host $_.Name
                if ($_.Name -like '*.parse.log' -and $_.Length -gt 0) {
                  try {
                    $issues = Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json
                    @($issues) | Select-Object -First 10 | ForEach-Object {
                      $record = $_ | ConvertTo-Json -Compress -Depth 4
                      Write-Host $record.Substring(0, [Math]::Min(450, $record.Length))
                    }
                  } catch { Write-Host 'No structured parser report' }
                }
                Select-String -Path $_.FullName -Pattern '(fatal error|error:|exception:|Problems)' |
                  Select-Object -First 5 | ForEach-Object {
                    $message = $_.Line.Trim()
                    Write-Host $message.Substring(0, [Math]::Min(220, $message.Length))
                  }
              }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-windows-arm64-engine
          path: |
            native-driver-verification.json
            native-entry-observations.json
            native-export-verification.json
            native-com-observations.json
            native-process-sdk.json
            native-sdk-profile.json
            native-dll-loader.json
            ${{ runner.temp }}/nb/neverd-build-receipt.json
            ${{ runner.temp }}/nb/neverd-dependency-inputs.json
          if-no-files-found: warn
          retention-days: 14
