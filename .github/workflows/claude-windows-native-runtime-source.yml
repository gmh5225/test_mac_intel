name: Complete native Windows Bun source graph with rg and Ugrep
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-native-components/build_runtime.py
      - windows-native-components/cxx_abi_control.py
      - windows-native-components/string_sort_controls.py
      - windows-native-components/patch_windows.py
      - windows-native-components/pcre2_sys_overlay.py
      - windows-native-components/pe_runtime.py
      - windows-native-components/recovered_multicall.rs
      - windows-native-components/role_boundary.rs
      - windows-native-components/role-boundary-pins.json
      - windows-native-components/ugrep-library-pins.json
      - windows-native-components/resolved-Cargo.lock
      - native-role-contracts/windows.rs
      - platform-runtime/build_windows.py
      - bun-runtime/rust_source_graph.py
      - bun-runtime/stage_native_sources.py
      - bun-runtime/prepare_native_sources.py
      - bun-runtime/verify_rust_plan.py
      - bun-runtime/resolved-Cargo.lock
      - .github/workflows/claude-windows-native-runtime-source.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Native Windows ${{ matrix.arch }} complete single Rust source engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            toolset: ''
          - arch: arm64
            runner: windows-11-arm
            toolset: '14.44.35207'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
          toolset: ${{ matrix.toolset }}
      - name: Read independently admitted C source graph producer
        id: input
        run: |
          python -B -c "import json,os; p=json.load(open('windows-native-components/ugrep-library-pins.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('run='+str(p['producer_run'])+'\n')"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-win32-${{ matrix.arch }}-ugrep-source-library-1
          path: ugrep-source-library
          run-id: ${{ steps.input.outputs.run }}
          github-token: ${{ github.token }}
      - name: Rebuild the public runtime and one locked Rust std rg graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B windows-native-components/build_runtime.py --arch ${{ matrix.arch }} --ugrep-libraries ugrep-source-library --output windows-native-engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-win32-${{ matrix.arch }}-native-source-runtime-${{ github.run_attempt }}
          path: windows-native-engine/public-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-win32-${{ matrix.arch }}-native-source-diagnostics-${{ github.run_attempt }}
          path: windows-native-engine/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
