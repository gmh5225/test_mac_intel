name: Time both MIPS16 decoders in counterbalanced pairs
on:
  push:
    branches: [codex/neverd-mips-historical-nov22]
    paths: ['.github/workflows/neverd-mips16-macos-pairs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: f1b8458fdccaa29f03788a7e40e5d3809f7f766f
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: brew install cmake ninja lld
      - name: Build the same Release decoder
        run: |
          test "$(git rev-parse HEAD)" = f1b8458fdccaa29f03788a7e40e5d3809f7f766f
          git submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
          test "$(git -C third_party/capstone rev-parse HEAD)" = ba03305d2a6423b1689bfa9f3206c889898c59c2
          cmake -S . -B build-check -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF -DNEVERD_ENABLE_SEMANTIC_TESTS=ON
          python scripts/build.py build-check --config Release --parallel 4 --target neverd-mips-bench
      - name: Time twelve ABBA and BAAB blocks for both byte orders and corpora
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          git submodule status third_party/capstone >> evidence/source.txt
          cp build-check/neverd-dependency-inputs.json build-check/neverd-build-receipt.json evidence/
          cat > "$RUNNER_TEMP/mips16-timing.py" <<'PYMIPS'
          """Pair both decoders on identical public records in balanced ABBA/BAAB blocks."""
          from pathlib import Path
          from statistics import median
          import hashlib
          import json
          import math
          import os
          import platform
          import random
          import subprocess
          import sys
          import tempfile
          
          binary = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2]).resolve()
          blocks = int(sys.argv[3]) if len(sys.argv)>3 else 12
          assert blocks >= 2 and blocks % 2 == 0
          shapes = {
              'mixed': [0x6a81, 0xf010, 0x6a00, 0xf7ff, 0x6a1f, 0x4aff, 0xf7ff, 0x4a1f, 0x63ff, 0xf7ff, 0x631f],
              'gcc': [int.from_bytes(bytes.fromhex('251d6a0064b16800650a10054801e269ed0a4c02600fac60ebd8eb12ebe361f669074c02e90ce96648016728e96eed0a650961f167686431e820e269e8206a00')[i:i+2],'big') for i in range(0,64,2)],
          }
          randomizer=random.Random(2492)
          profiles={}
          machine={'system':platform.platform(),'machine':platform.machine(),'logical_cpus':os.cpu_count()}
          for name in ('machdep.cpu.brand_string','hw.ncpu','hw.perflevel0.physicalcpu','hw.perflevel1.physicalcpu'):
              g=subprocess.run(['sysctl','-n',name],text=True,capture_output=True)
              if g.returncode==0:machine[name]=g.stdout.strip()
          with tempfile.TemporaryDirectory() as temp:
              for shape,words in shapes.items():
                  for prof,order in [('mips16','big'),('mips16el','little')]:
                      raw=b''.join(w.to_bytes(2,order) for w in words)*(32 if shape=='mixed' else 1)
                      path=Path(temp)/(shape+'-'+prof+'.bin');path.write_bytes(raw)
                      def run(stage,repeats):
                          return json.loads(subprocess.check_output([binary,prof,stage,path,str(repeats)]))
                      warm={s:run(s,1000) for s in ('decode','capstone')}
                      assert warm['decode']['digest']==warm['capstone']['digest']
                      count=warm['decode']['instructions_per_repeat'];assert count and count==warm['capstone']['instructions_per_repeat']
                      profiles[(shape,prof)]=dict(path=path,count=count,digest=warm['decode']['digest'],sha256=hashlib.sha256(raw).hexdigest(),blocks=[],repeats=math.ceil(8000000/count))
              schedules={k:[tuple(('decode','capstone','capstone','decode') if i%2==0 else ('capstone','decode','decode','capstone')) for i in range(blocks)] for k in profiles}
              for seq in schedules.values():randomizer.shuffle(seq)
              keys=list(profiles)
              for i in range(blocks):
                  randomizer.shuffle(keys)
                  for k in keys:
                      d=profiles[k]; legs=[]
                      for stage in schedules[k][i]:
                          x=json.loads(subprocess.check_output([binary,k[1],stage,d['path'],str(d['repeats'])]));assert (x['instructions_per_repeat'],x['digest'])==(d['count'],d['digest']);scale=1e9/(x['repeats']*d['count']);legs.append(dict(stage=stage,cpu_ns=x['cpu_seconds']*scale,wall_ns=x['wall_seconds']*scale,**x))
                      pair={s:sum(z['cpu_ns'] for z in legs if z['stage']==s)/2 for s in ('decode','capstone')}
                      d['blocks'].append(dict(legs=legs,ratio=pair['decode']/pair['capstone'],ns=pair))
          for d in profiles.values():
              del d['path'];d['median']={k:median(b['ns'][k] for b in d['blocks']) for k in ('decode','capstone')};d['median_ratio']=median(b['ratio'] for b in d['blocks']);d['faster_blocks']=sum(b['ratio']<1 for b in d['blocks'])
          archive={'host':machine,'product_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'blocks':blocks,'profiles':{shape+'/'+prof:v for (shape,prof),v in profiles.items()}}
          output.write_text(json.dumps(archive,indent=2)+'\n');print({k:(v['median'],v['faster_blocks']) for k,v in archive['profiles'].items()})
          PYMIPS
          python "$RUNNER_TEMP/mips16-timing.py" build-check/bin/neverd-mips-bench evidence/pairs.json 12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-mips16-macos-f1b8458fdccaa29f03788a7e40e5d3809f7f766f
          path: evidence/
          retention-days: 7
