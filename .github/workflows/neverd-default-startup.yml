name: Temporary default arm64e startup diagnostic
on:
  push:
    branches: [codex/neverd-default-startup]
    paths: [neverd-default-startup/**, .github/workflows/neverd-default-startup.yml]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.policy.outputs.source }}
      runner: ${{ steps.policy.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: policy
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('neverd-default-startup/Diagnostic.def').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('source=' + policy['source_revision'], file=out)
              print('runner=' + policy['runner'], file=out)
          PY
  startup:
    needs: policy
    runs-on: ${{ needs.policy.outputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ needs.policy.outputs.source }}
          path: neverd
          persist-credentials: false
      - run: python3 neverd-default-startup/run.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: default-startup-diagnostic
          path: default-startup-evidence/
          retention-days: 14
