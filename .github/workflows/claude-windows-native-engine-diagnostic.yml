name: Public Windows ARM64 engine with existing linker map diagnostics
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-native-components/build_diagnostic_runtime.py
      - .github/workflows/claude-windows-native-engine-diagnostic.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: arm64
          toolset: '14.44.35207'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-win32-arm64-ugrep-source-library-1
          path: ugrep-source-library
          run-id: 39125006800
          github-token: ${{ github.token }}
      - name: Rebuild identical public source with existing linker maps retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B windows-native-components/build_diagnostic_runtime.py --arch arm64 --ugrep-libraries ugrep-source-library --output windows-native-engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-win32-arm64-diagnostic-source-runtime-${{ github.run_attempt }}
          path: windows-native-engine/public-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-win32-arm64-public-engine-link-diagnostics-${{ github.run_attempt }}
          path: windows-native-engine/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
