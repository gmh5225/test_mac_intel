name: Measure fixed register storage in dedicated SPARC V9; verify exact mixed-build objects
on:
  push:
    branches: [codex/capstone-dedicated-sparc-v9-gcc]
    paths: [capstone-performance/**, .github/workflows/capstone-dedicated-aliases.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: ubuntu-24.04, plan: "AARCH64,ARM"}
          - {host: ubuntu-24.04-arm, plan: "AARCH64,ARM"}
    env:
      ARCH_PLAN: ${{ matrix.plan }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Compare bounded outputs and paired CPU time with both libraries on the same thread
        run: python3 capstone-performance/process-benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sparc-v9-gcc-${{ matrix.host }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: warn
          retention-days: 14
