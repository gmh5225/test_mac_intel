name: Verify dedicated Linux x86 repairs with GCC and Clang
on:
  push:
    branches: [codex/capstone-linux-dedicated-memory-repairs]
    paths: [capstone-performance/**, .github/workflows/capstone-dedicated-aliases.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: ubuntu-24.04, cc: clang}
          - {host: ubuntu-24.04-arm, cc: clang}
          - {host: ubuntu-24.04, cc: gcc}
          - {host: ubuntu-24.04-arm, cc: gcc}
          - {host: macos-15, cc: clang}
          - {host: macos-15-intel, cc: clang}
    env:
      CC: ${{ matrix.cc }}
      ARCH_PLAN: X86
    runs-on: ${{ matrix.host }}
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Compare bounded outputs and paired CPU time with both libraries on the same thread
        run: python3 capstone-performance/process-benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-memory-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: warn
          retention-days: 14
