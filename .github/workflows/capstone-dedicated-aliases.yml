name: Compare complete x86 records and replicate dedicated Linux throughput
on:
  push:
    branches: [codex/capstone-native-linux-repair-qualification]
    paths: [capstone-performance/**, .github/workflows/capstone-dedicated-aliases.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: ubuntu-24.04, cc: clang, cfg: full, timing: 'yes', copy: first}
          - {host: ubuntu-24.04, cc: clang, cfg: full, timing: 'yes', copy: second}
          - {host: ubuntu-24.04, cc: gcc, cfg: full, timing: 'yes', copy: first}
          - {host: ubuntu-24.04, cc: gcc, cfg: full, timing: 'yes', copy: second}
          - {host: ubuntu-24.04, cc: clang, cfg: diet, timing: 'no', copy: one}
          - {host: ubuntu-24.04, cc: gcc, cfg: reduced, timing: 'no', copy: one}
          - {host: ubuntu-24.04-arm, cc: clang, cfg: no-att, timing: 'no', copy: one}
    env:
      CC: ${{ matrix.cc }}
      CONFIGURATION: ${{ matrix.cfg }}
      TIMING: ${{ matrix.timing }}
      ARCH_PLAN: X86
    runs-on: ${{ matrix.host }}
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Compare bounded outputs and paired CPU time with both libraries on the same thread
        run: python3 capstone-performance/process-benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repair-recheck-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.cfg }}-${{ matrix.copy }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: warn
          retention-days: 14
