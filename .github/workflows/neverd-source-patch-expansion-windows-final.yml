name: NeverD source patch expansion Windows final
run-name: Windows qualification at ${{ inputs.source || '1096c060c067fff1275cf0253e3c78e8834aa750' }}
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact NeverD source commit
        type: string
        required: true
        default: 1096c060c067fff1275cf0253e3c78e8834aa750
  push:
    branches: [codex/source-patch-expansion]
    paths: ['.github/workflows/neverd-source-patch-expansion-windows-final.yml']
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ inputs.source || '1096c060c067fff1275cf0253e3c78e8834aa750' }}
  SCCACHE_GHA_ENABLED: 'true'
concurrency:
  group: neverd-expansion-windows-final-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, arch: x64}
          - {runner: windows-11-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ env.SOURCE_COMMIT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: build-expansion-harness
          ref: ${{ github.sha }}
          sparse-checkout: expansion
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with: {version: v0.16.0}
      - name: Install the verified source producer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.6-win64.exe'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/LLVM-22.1.6-win64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e2d9a6855ff22c0acf3adc87ff1e1ad9705b8b6fc5bab2542aefc3315fc24cf7') { throw 'Clang installer digest mismatch' }
          $install = Join-Path $env:RUNNER_TEMP 'expansion-clang'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Clang installation failed' }
          "$install\bin" >> $env:GITHUB_PATH
          "SOURCE_CLANG=$install\bin\clang.exe" >> $env:GITHUB_ENV
          choco install ninja --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Ninja installation failed' }
      - name: Build the pinned Unicorn for the native ARM64 host
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory expansion-logs
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260519-ucrt-aarch64.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260519/llvm-mingw-20260519-ucrt-aarch64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7bb5e3c9964dc29555cababb55e69eea02a51e98e1240eb9513e6540c7bae0ea') { throw 'LLVM-MinGW digest mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $tool = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20260519-ucrt-aarch64'
          $cc = Join-Path $tool 'bin\aarch64-w64-mingw32-clang.exe'
          $env:PATH = 'C:\Program Files\Git\bin;' + $env:PATH
          python build-expansion-harness/expansion/prepare_arm64_unicorn.py
          if ($LASTEXITCODE -ne 0) { throw 'Unicorn build overlay validation failed' }
          cmake -S build-unicorn-input -B build-unicorn -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 "-DCMAKE_C_COMPILER=$cc" -DCMAKE_C_FLAGS=-D__USE_MINGW_SETJMP_NON_SEH -DBUILD_SHARED_LIBS=ON -DUNICORN_LEGACY_STATIC_ARCHIVE=OFF '-DUNICORN_ARCH=x86;arm;aarch64' -DUNICORN_BUILD_TESTS=OFF -DUNICORN_INSTALL=OFF 2>&1 | Tee-Object expansion-logs/unicorn-configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Unicorn configure failed' }
          cmake --build build-unicorn --target unicorn --parallel 4 --verbose 2>&1 | Tee-Object expansion-logs/unicorn-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Unicorn build failed' }
          $images = @(Get-ChildItem build-unicorn -Recurse -Filter '*unicorn*.dll')
          if ($images.Count -ne 1) { throw 'Unicorn DLL inventory differs' }
          $dll = $images[0]
          $reader = Join-Path $tool 'bin\llvm-readobj.exe'
          $headers = & $reader --file-headers $dll.FullName
          $headers | Set-Content expansion-logs/unicorn-headers.log
          if ($LASTEXITCODE -ne 0 -or ($headers -join "`n") -notmatch 'IMAGE_FILE_MACHINE_ARM64') { throw 'Unicorn is not an ARM64 image' }
          $exports = & $reader --coff-exports $dll.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect Unicorn exports' }
          $exports | Set-Content expansion-logs/unicorn-exports.log
          $names = @($exports | ForEach-Object { if ($_ -match '^\s+Name: (uc_[A-Za-z0-9_]+)$') { $Matches[1] } } | Sort-Object -Unique)
          if ($names.Count -lt 25 -or 'uc_open' -notin $names -or 'uc_context_free' -notin $names) { throw 'Unicorn C API exports incomplete' }
          $definition = Join-Path $dll.DirectoryName 'unicorn.def'
          @("LIBRARY $($dll.Name)", 'EXPORTS') + $names | Set-Content -Encoding ascii $definition
          $import = Join-Path $dll.DirectoryName 'unicorn-msvc.lib'
          lib.exe /nologo /machine:arm64 "/def:$definition" "/out:$import" 2>&1 | Tee-Object expansion-logs/unicorn-import.log
          if ($LASTEXITCODE -ne 0) { throw 'MSVC import library generation failed' }
          $root = (Get-Location).Path.Replace('\','/')
          $dllPath = $dll.FullName.Replace('\','/')
          $importPath = $import.Replace('\','/')
          $overlay = Join-Path $env:RUNNER_TEMP 'neverd-arm64-unicorn.cmake'
          @"
          add_library(unicorn SHARED IMPORTED GLOBAL)
          set_target_properties(unicorn PROPERTIES IMPORTED_LOCATION "$dllPath" IMPORTED_IMPLIB "$importPath" INTERFACE_INCLUDE_DIRECTORIES "$root/third_party/unicorn/include")
          target_compile_definitions(unicorn INTERFACE NOMINMAX)
          "@ | Set-Content -Encoding utf8 $overlay
          "UNICORN_OVERLAY=$($overlay.Replace('\','/'))" >> $env:GITHUB_ENV
          $runtime = Join-Path $tool 'aarch64-w64-mingw32\bin'
          New-Item -ItemType Directory -Force build-expansion/bin | Out-Null
          Copy-Item $dll.FullName build-expansion/bin
          Copy-Item "$runtime\*.dll" build-expansion/bin
          $dll.DirectoryName >> $env:GITHUB_PATH
          $runtime >> $env:GITHUB_PATH
          Copy-Item $dll.FullName expansion-logs
          Copy-Item $import expansion-logs
          cl.exe /nologo /W4 /O2 /MD /Ithird_party/unicorn/include build-expansion-harness/expansion/unicorn_host_smoke.c /Febuild-expansion/bin/unicorn_host_smoke.exe /Fobuild-expansion/unicorn_host_smoke.obj /link $import 2>&1 | Tee-Object expansion-logs/unicorn-smoke-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC consumer build failed' }
          python -c "import subprocess; subprocess.run(['build-expansion/bin/unicorn_host_smoke.exe'], check=True, timeout=15)" 2>&1 | Tee-Object expansion-logs/unicorn-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 Unicorn host smoke checks failed' }
          Copy-Item build-expansion/bin/unicorn_host_smoke.exe expansion-logs
          Copy-Item build-expansion-harness/expansion/unicorn_host_smoke.c expansion-logs
          [ordered]@{source_commit=(git -C third_party/unicorn rev-parse HEAD); host='ARM64'; producer_sha256='7bb5e3c9964dc29555cababb55e69eea02a51e98e1240eb9513e6540c7bae0ea'; dll=$dll.Name; dll_sha256=(Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); import_sha256=(Get-FileHash $import -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content expansion-logs/unicorn-provenance.json
      - name: Verify evidence contracts and configure the native build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force expansion-logs | Out-Null
          if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT -or $env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Wrong source commit' }
          & $env:SOURCE_CLANG --version | Tee-Object expansion-logs/producer.log
          $env:PYTHONPATH = 'pluginsdk/python'
          python -m unittest scripts.tests.test_check_source_patch_expansion_runtime scripts.tests.test_run_lift_qualification -v 2>&1 | Tee-Object expansion-logs/evidence-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Evidence tests failed' }
          python -m unittest discover -s pluginsdk/python/tests -p test_api.py -v 2>&1 | Tee-Object expansion-logs/python-api.log
          if ($LASTEXITCODE -ne 0) { throw 'Python API tests failed' }
          cmake -S . -B build-expansion -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$env:UNICORN_OVERLAY" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=OFF -DNEVERD_BUILD_SHARED=ON -DNEVERD_BUILD_GUI=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_DRIVER_EMULATION=OFF -DNEVERD_ENABLE_SEMANTIC_TESTS=ON "-DNEVERD_SOURCE_PATCH_TEST_CLANG_EXECUTABLE=$env:SOURCE_CLANG" 2>&1 | Tee-Object expansion-logs/configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
      - name: Build the pinned NeverD LLVM and patch owners
        shell: pwsh
        run: |
          cmake --build build-expansion --target neverd_shared NeverDSourcePatchTests NeverDSourcePatchMatrixTests NeverDSourcePatchLayoutTests NeverDSourcePatchCallbackTests NeverDNativeExceptionRewriteContractTests --parallel 4 2>&1 | Tee-Object expansion-logs/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Require the complete native and CPU inventories
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'x64') {
            $env:NEVERD_TEST_WINDOWS_CRT_LIB = Join-Path $env:VCToolsInstallDir 'lib\x64'
            $sdkRoot = Join-Path $env:WindowsSdkDir "Lib\$($env:WindowsSDKVersion.TrimEnd('\'))"
            $env:NEVERD_TEST_WINDOWS_UCRT_LIB = Join-Path $sdkRoot 'ucrt\x64'
            $env:NEVERD_TEST_WINDOWS_SDK_LIB = Join-Path $sdkRoot 'um\x64'
            $env:NEVERD_TEST_REQUIRE_WINDOWS_RUNTIME = '1'
          }
          python scripts/qualify_source_patch_expansion.py --build build-expansion --clang $env:SOURCE_CLANG --source-commit $env:SOURCE_COMMIT --expected-arch '${{ matrix.arch }}' --output expansion-evidence 2>&1 | Tee-Object expansion-logs/qualification.log
          if ($LASTEXITCODE -ne 0) { throw 'Qualification failed' }
      - name: Retain all evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expansion-${{ matrix.runner }}-${{ env.SOURCE_COMMIT }}
          path: |
            expansion-logs
            expansion-evidence
          if-no-files-found: error
