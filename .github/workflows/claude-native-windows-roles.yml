name: Original native Windows role observations
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-recovery/observe_roles.py
      - windows-recovery/role-transport.cpp
      - .github/workflows/claude-native-windows-roles.yml
permissions:
  contents: read
jobs:
  observe:
    name: Native ${{ matrix.arch }} original roles
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch == 'x64' && 'x64' || 'amd64_arm64' }}
      - name: Qualify the authored native graph and OS boundary first
        run: python windows-recovery/qualify.py --arch ${{ matrix.arch }} --output windows-role-environment --authored-only
      - name: Compile the authored Unicode argv transport
        run: |
          cl /nologo /std:c++20 /EHsc /O2 /MT /D_CRT_SECURE_NO_WARNINGS windows-recovery/role-transport.cpp /Fe:windows-role-environment/role-transport.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify authored transport and observe original role behavior
        run: python windows-recovery/observe_roles.py --arch ${{ matrix.arch }} --environment windows-role-environment
      - name: Retain diagnostic records only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-win32-${{ matrix.arch }}-role-diagnostics-${{ github.run_attempt }}
          path: windows-role-environment/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
