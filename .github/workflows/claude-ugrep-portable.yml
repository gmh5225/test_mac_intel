name: Ugrep portable direct-call source library
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - ugrep-portable/**
      - .github/workflows/claude-ugrep-portable.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Native ${{ matrix.arch }} portable Ugrep source library
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Obtain the already qualified public source archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-extra-native-components-1
          path: retained-public-source-inputs
          run-id: 38986089116
          github-token: ${{ github.token }}
      - name: Build and check the portable source library
        run: python3 -B ugrep-portable/build.py --arch ${{ matrix.arch }} --source-inputs retained-public-source-inputs --output ugrep-portable-build
      - name: Retain public source library and host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-portable-ugrep-${{ github.run_attempt }}
          path: ugrep-portable-build/public-ugrep-library/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain public build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-portable-ugrep-diagnostics-${{ github.run_attempt }}
          path: ugrep-portable-build/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
