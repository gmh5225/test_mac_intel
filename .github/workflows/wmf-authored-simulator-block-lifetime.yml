name: WMF authored current Simulator Block lifetime
on:
  push:
    branches: [codex/wmf-simulator-provider-inventory]
    paths:
      - .github/workflows/wmf-authored-simulator-block-lifetime.yml
      - wmf-block-lifetime/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lifetime:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reuse the exact successful first authored build without recompiling
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wmf-authored-platform7-block-lifetime-1
          run-id: 40921122862
          github-token: ${{ github.token }}
          path: wmf-frozen-first-build
      - name: Execute the unchanged authored fixture on a declared compatible owned device
        run: python3 -B wmf-block-lifetime/collect.py
      - name: Preserve complete authored outputs, compiler inputs, failures and provider identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-authored-platform7-block-lifetime-reused-build-${{ github.run_attempt }}
          path: wmf-block-lifetime-reused-build-records/
          if-no-files-found: error
          retention-days: 14
