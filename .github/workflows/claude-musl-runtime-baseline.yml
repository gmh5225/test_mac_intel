name: Native public musl Bun source baselines
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - platform-runtime/build_musl_baseline.py
      - platform-runtime/build-musl-baseline.sh
      - platform-runtime/musl-sdk-runtime-pins.json
      - .github/workflows/claude-musl-runtime-baseline.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Native ${{ matrix.arch }} public musl source baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve the independently qualified SDK producer
        id: sdk
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pin=json.loads(Path('platform-runtime/musl-sdk-runtime-pins.json').read_bytes())
          assert isinstance(pin['producer_run'],int) and pin['producer_run']>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('producer_run='+str(pin['producer_run'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-musl-sdk-1
          path: retained-sdk
          run-id: ${{ steps.sdk.outputs.producer_run }}
          github-token: ${{ github.token }}
      - name: Build the public baseline and execute bounded native controls
        run: python3 -B platform-runtime/build_musl_baseline.py --arch ${{ matrix.arch }} --sdk retained-sdk --output musl-baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-musl-bun-baseline-${{ github.run_attempt }}
          path: musl-baseline/public-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-linux-${{ matrix.arch }}-musl-bun-baseline-diagnostics-${{ github.run_attempt }}
          path: musl-baseline/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
