name: Source-built macOS Bun with three reconstructed native roles
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-native-components/build_runtime.py
      - macos-native-components/patch_macos.py
      - macos-native-components/component_libraries.py
      - macos-native-components/macho_runtime.py
      - macos-native-components/qualify_runtime.py
      - macos-native-components/recovered_multicall.rs
      - macos-native-components/prepare_sdk.py
      - macos-native-components/macos-sdk-pins.json
      - macos-native-components/bfs-library-pins.json
      - macos-native-components/ugrep-library-pins.json
      - native-role-contracts/darwin.rs
      - platform-runtime/build_macos.py
      - bun-runtime/rust_source_graph.py
      - bun-runtime/stage_native_sources.py
      - bun-runtime/prepare_native_sources.py
      - bun-runtime/resolved-Cargo.lock
      - bun-runtime/verify_rust_plan.py
      - bun-runtime/native_rg_controls.py
      - .github/workflows/claude-macos-native-runtime-source.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: macOS ${{ matrix.arch }} full native-role source build on ARM64
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install disposable build utilities
        run: brew install nasm ninja pkgconf automake libtool coreutils gnu-sed go ruby
      - name: Read admitted source-library producers
        id: inputs
        run: |
          python3 -B - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for role in ['bfs','ugrep']:
                  pins=json.load(open('macos-native-components/'+role+'-library-pins.json'))
                  assert pins['component']==role and pins['target_os']=='darwin' and not pins['core_engine_integrated']
                  out.write(role+'_run='+str(pins['producer_run'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-darwin-${{ matrix.arch }}-bfs-source-library-1
          path: bfs-source-library
          run-id: ${{ steps.inputs.outputs.bfs_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-darwin-${{ matrix.arch }}-ugrep-source-library-1
          path: ugrep-source-library
          run-id: ${{ steps.inputs.outputs.ugrep_run }}
          github-token: ${{ github.token }}
      - name: Build one Rust and std source graph with qualified native C graphs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B macos-native-components/build_runtime.py --arch ${{ matrix.arch }} --bfs-libraries bfs-source-library --ugrep-libraries ugrep-source-library --output macos-native-engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-darwin-${{ matrix.arch }}-native-source-runtime-${{ github.run_attempt }}
          path: macos-native-engine/public-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain public build diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-darwin-${{ matrix.arch }}-native-source-diagnostics-${{ github.run_attempt }}
          path: macos-native-engine/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  native:
    name: Native macOS ${{ matrix.os }} ${{ matrix.arch }} source runtime and three roles
    needs: build
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: 15
            runner: macos-15
          - arch: x64
            os: 15
            runner: macos-15-intel
          - arch: arm64
            os: 26
            runner: macos-26
          - arch: x64
            os: 26
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-darwin-${{ matrix.arch }}-native-source-runtime-${{ github.run_attempt }}
          path: public-runtime
      - name: Check final native runtime, source roles and actual rg paths
        run: python3 -B macos-native-components/qualify_runtime.py --arch ${{ matrix.arch }} --package public-runtime --output native-controls
      - name: Retain authored native execution records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-darwin-${{ matrix.arch }}-macos${{ matrix.os }}-source-runtime-controls-${{ github.run_attempt }}
          path: native-controls/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
