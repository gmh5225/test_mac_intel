name: Complete unchanged macOS return validation with CTest summary parser fix
on:
  push:
    branches: [codex/capstone-return-fix-macos-parser]
    paths: [capstone-return-fix/**, .github/workflows/capstone-return-fix.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang, profile: four }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      CC: ${{ matrix.cc }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-return-fix
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 56af4c403bfba96012697d0ef7af088b7aaa943d
          path: source
          persist-credentials: false
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v "$CC" >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes "$CC"
          fi
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-return-venv"
          "$RUNNER_TEMP/capstone-return-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/capstone-return-venv/bin/python" capstone-return-fix/verify.py
      - if: runner.os != 'Linux'
        run: python3 capstone-return-fix/verify.py
      - if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/capstone-return-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preserve-most-return-fix-macos-repair-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.profile }}
          path: evidence/
          retention-days: 14
