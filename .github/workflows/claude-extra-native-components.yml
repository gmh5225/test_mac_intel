name: Additional source-built native component candidates
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - extra-components/**
      - .github/workflows/claude-extra-native-components.yml
permissions:
  contents: read
jobs:
  build:
    name: Native ${{ matrix.arch }} Ugrep and Bfs candidates
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare debugger for public candidate failure diagnostics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
      - name: Build public sources and check static native candidates
        run: |
          python3 -m unittest discover -s extra-components -p 'test_*.py' -v
          python3 extra-components/build_linux.py --arch ${{ matrix.arch }} --output extra-native-build
      - name: Retain public source candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-extra-native-components-${{ github.run_attempt }}
          path: extra-native-build/public-extra-components/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain candidate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-extra-native-diagnostics-${{ github.run_attempt }}
          path: extra-native-build/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
