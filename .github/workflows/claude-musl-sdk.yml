name: Public musl SDK inputs for native source rebuilds
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - platform-runtime/build_musl_sdk.py
      - platform-runtime/musl-sdk-pins.json
      - .github/workflows/claude-musl-sdk.yml
permissions:
  contents: read
jobs:
  sdk:
    name: Native ${{ matrix.arch }} public musl SDK capture
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build a private-root SDK from the recorded public package index
        run: python3 -B platform-runtime/build_musl_sdk.py --arch ${{ matrix.arch }} --output musl-sdk
      - name: Retain exact SDK and package inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-musl-sdk-${{ github.run_attempt }}
          path: musl-sdk/public-sdk/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain SDK diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-musl-sdk-diagnostics-${{ github.run_attempt }}
          path: musl-sdk/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
