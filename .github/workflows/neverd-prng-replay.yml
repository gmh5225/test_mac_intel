name: Run the published ProcessPrng callers on Windows
on:
  push:
    branches: [codex/neverd-published-prng-c95f1c3b25]
    paths: [.github/workflows/neverd-prng-replay.yml, prng-replay/**, native-driver-entry/process_prng.c]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, arch: x86, system: SysWOW64}
          - {runner: windows-2025, arch: x64, system: System32}
          - {runner: windows-11-arm, arch: arm64, system: System32}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            native-driver-entry
            prng-replay
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
      - name: Compile, link and execute all three callers
        shell: pwsh
        run: |
          $provider = Join-Path $env:SystemRoot '${{ matrix.system }}/bcryptprimitives.dll'
          $sig = Get-AuthenticodeSignature $provider
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw "System provider signature: $($sig.Status)" }
          python prng-replay/run.py '${{ matrix.arch }}'
          if ($LASTEXITCODE) { throw "Caller replay returned $LASTEXITCODE" }
          $data = Get-Content prng-out/report.json -Raw | ConvertFrom-Json
          $data | Add-Member -MemberType NoteProperty -Name signer -Value $sig.SignerCertificate.Subject
          $data | ConvertTo-Json -Depth 8 | Set-Content prng-out/report.json -Encoding utf8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prng-execution-${{ matrix.arch }}
          path: prng-out/report.json
          if-no-files-found: error
