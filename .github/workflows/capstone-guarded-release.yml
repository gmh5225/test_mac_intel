name: Check enabled static indirect calls and jumps on guarded x86 instruction extents
on:
  push:
    branches: [codex/capstone-protected-near-indirect]
    paths: [guarded/**, .github/workflows/capstone-guarded-release.yml]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [asan, release]
    env:
      GUARD_KIND: "${{ matrix.kind }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: guarded
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 2c3d603a35ee40bc82812c223a6fde14d4add1dc
          path: source
          persist-credentials: false
      - run: python3 -B guarded/guard-run.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: protected-indirect-${{ matrix.kind }}
          path: evidence/
          retention-days: 14
