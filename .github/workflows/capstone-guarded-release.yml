name: Check input bounds and complete register details for i386 MOVZX and MOVSX
on:
  push:
    branches: [codex/capstone-widen32-guarded-inputs]
    paths: [guarded/**, .github/workflows/capstone-guarded-release.yml]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [asan, release]
    env:
      GUARD_KIND: "${{ matrix.kind }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: guarded
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 9e9475747756ecd8a726e3b2f7bfe7381e46a5f2
          path: source
          persist-credentials: false
      - run: python3 -B guarded/guard-run.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guarded-i386-widen-${{ matrix.kind }}
          path: evidence/
          retention-days: 14
