name: Native musl source component graphs
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - musl-native-components/build.py
      - musl-native-components/build_components.py
      - musl-native-components/sdk.py
      - musl-native-components/elf_objects.py
      - musl-native-components/private_symbols.py
      - musl-native-components/test_elf_objects.py
      - musl-native-components/expected-*-version-*.txt
      - .github/workflows/claude-musl-native-components.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Native musl ${{ matrix.arch }} Ugrep Bfs and PCRE2 source graphs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify the ELF symbol rewrite checker on real compiler objects
        run: python3 -B -m unittest discover -s musl-native-components -p 'test_*.py' -v
      - name: Resolve the independently qualified SDK producer
        id: sdk
        run: |
          python3 -B - <<'PY'
          import json,os
          pins=json.load(open('platform-runtime/musl-sdk-runtime-pins.json'))
          assert type(pins['producer_run']) is int and pins['producer_run']>0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(pins['producer_run'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-musl-sdk-1
          path: retained-sdk
          run-id: ${{ steps.sdk.outputs.run }}
          github-token: ${{ github.token }}
      - name: Compile public musl components and run upstream and direct-call controls
        run: python3 -B musl-native-components/build.py --arch ${{ matrix.arch }} --sdk retained-sdk --output musl-components
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-musl-source-components-${{ github.run_attempt }}
          path: musl-components/public-components/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-linux-${{ matrix.arch }}-musl-source-component-diagnostics-${{ github.run_attempt }}
          path: musl-components/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
