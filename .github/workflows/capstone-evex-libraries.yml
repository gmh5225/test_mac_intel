name: Attribute the inclusive work of real scalar and SIMD printer paths to the six-architecture decoder
on:
  push:
    branches: [codex/six-architecture-printer-call-cost]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, replica: 1 }
          - { host: ubuntu-24.04-arm, cc: clang, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 8519aa66bc2c2af381d5df735204d1e7fdd7cd27
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: c9772143c11e10fb199de017eb1c0fcaef115c53
          path: neverd-config
          sparse-checkout: |
            CMakeLists.txt
            cmake/NeverDCapstoneCompilerOptions.inc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/iced
          ref: 8b8d90b13374fbf38e7279749e48c673f4ec243a
          path: iced-source
          sparse-checkout: src/rust/iced-x86
          persist-credentials: false
      - name: Build from source and time only verified common function boundaries
        run: |
          if ! command -v valgrind >/dev/null || ! test -f /usr/include/valgrind/callgrind.h; then sudo apt-get -qq update && sudo apt-get -qq -y install valgrind; fi
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32 zstandard==0.23.0
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/neverd-config" "$GITHUB_WORKSPACE/iced-source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: inclusive-real-printer-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
