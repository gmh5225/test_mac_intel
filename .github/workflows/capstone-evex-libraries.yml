name: Measure i386 syntax routing against both iced formatters and the six-ISA release with identical controls
on:
  push:
    branches: [codex/i386-syntax-real-fast-formatter]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, replica: 1 }
          - { host: ubuntu-24.04-arm, cc: clang, replica: 1 }
          - { host: ubuntu-24.04, cc: clang, replica: 2 }
          - { host: ubuntu-24.04-arm, cc: clang, replica: 2 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a5c08759df756b179578e97670e148fa7629e88c
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 1145966d56390a5e3f454ad1b22068a97d484a0a
          path: neverd-config
          sparse-checkout: |
            CMakeLists.txt
            cmake/NeverDCapstoneCompilerOptions.inc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/iced
          ref: 8cfc5f57c08fd2e80a4cec9d3d9d36f642b2de31
          path: iced-source
          sparse-checkout: src/rust/iced-x86
          persist-credentials: false
      - name: Build from source and time only verified common function boundaries
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32 zstandard==0.23.0
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/neverd-config" "$GITHUB_WORKSPACE/iced-source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-i386-syntax-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
