name: Diagnose every flagged canonical EVEX native panel with unchanged consumers
on:
  push:
    branches: [codex/capstone-evex-canonical-scan-focused]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: gcc, replica: 1 }
          - { host: ubuntu-22.04, cc: gcc, replica: 2 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 68
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 413b606f938a39d053fd61ef83a6277eec4e4f6e
          path: source
          persist-credentials: false
      - name: Build from source and time only verified common function boundaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evex-canonical-scan-focused-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
