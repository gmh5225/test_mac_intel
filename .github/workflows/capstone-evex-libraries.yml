name: Rebuild the exact NeverD Capstone archive for each product candidate on published next
on:
  push:
    branches: [codex/capstone-current-combined-archives]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        family: [alias, indexed, mixed]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: clang
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: bbba0e240053b9ad2897390bdc76f6f6115e3a55
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: c2f412ad29afc74b17bf48d05bc09713df77cdb6
          path: neverd-config
          sparse-checkout: |
            CMakeLists.txt
            cmake
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Compare archive members, check dirty records and run guards
        run: python3 -B capstone-vectors/verify.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archive-composition-${{ matrix.host }}-${{ matrix.family }}
          path: evidence/
          retention-days: 14
