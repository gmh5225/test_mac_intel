name: Count runtime instructions and branch mispredictions for every held-out i386 AVX2 function
on:
  push:
    branches: [codex/capstone-i386-avx2-work-profile]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: gcc }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 68
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a7787ac5c7c0ead02a3c46c85cdcfcb482dc6343
          path: source
          persist-credentials: false
      - name: Install the Callgrind instrumentation headers and binary
        run: sudo apt-get update -qq && sudo apt-get install -qy valgrind
      - name: Compare instrumented work at identical real function boundaries
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: i386-jpeg-work-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
