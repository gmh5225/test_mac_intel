name: Qualify dedicated WASM text and detail on real modules with unchanged mixed x86 and RISC binaries
on:
  push:
    branches: [codex/wasm-dedicated-literal-mnemonics]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { host: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { host: ubuntu-24.04-arm, cc: clang, cxx: clang++ }
          - { host: macos-15, cc: clang, cxx: clang++ }
          - { host: macos-15-intel, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 42c169fe6d452d843ddf135cce8b9b18ee6b6995
          path: source
          persist-credentials: false
      - name: Verify formatter hooks and time real WASM operators
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          python3 -B capstone-vectors/wasm/configs.py
          python3 -B capstone-vectors/wasm/mixed.py
          python3 -B capstone-vectors/wasm/check_make.py
          python3 -B capstone-vectors/wasm/run.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wasm-dedicated-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
