name: Measure the reach of vector operand writes in real PE and ELF text and details
on:
  push:
    branches: [codex/vector-register-write-coverage]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, replica: 1 }
          - { host: ubuntu-22.04, cc: clang, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a19fb997d94b4f285afe905aa0d9ccaa98139651
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 611e77b790a261443a2ba9c805cbfe125a4e72e1
          path: neverd-config
          sparse-checkout: |
            CMakeLists.txt
            cmake/NeverDCapstoneCompilerOptions.inc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Trace every vector-register write at the verified benchmark boundaries
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32 zstandard==0.23.0
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/neverd-config"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vector-name-coverage-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
