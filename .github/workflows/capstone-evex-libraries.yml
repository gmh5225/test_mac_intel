name: Isolate first iterator extent violation on Clang 14
on:
  push:
    branches: [codex/capstone-clang14-vectors-boundary]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: ce07fdfca945d55de72325eb6482aaf9dd9297b2
          path: source
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes gdb
      - name: Rebuild exact Release boundary and capture native crash stacks
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clang14-vectors-boundary-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
