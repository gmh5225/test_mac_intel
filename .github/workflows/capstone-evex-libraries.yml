name: Verify Make public records under static, dual, reduced, diet and custom allocations
on:
  push:
    branches: [codex/make-static-public-records]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, replica: 1 }
          - { host: ubuntu-24.04-arm, cc: clang, replica: 1 }
          - { host: ubuntu-24.04, cc: gcc, replica: 1 }
          - { host: ubuntu-22.04, cc: clang, replica: 1 }
          - { host: macos-15-intel, cc: clang, replica: 1 }
          - { host: macos-15, cc: clang, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 372fbd2d967c5023371a12e0e406f8be2ec84ae5
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 30c94d8e3eda73dbcf459130262ba347a33712eb
          path: neverd-config
          sparse-checkout: |
            CMakeLists.txt
            cmake/NeverDCapstoneCompilerOptions.inc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build all profiles and verify linked consumers
        run: python3 capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/neverd-config"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-make-configurations-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
