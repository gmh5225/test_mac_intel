name: Census remaining real-input output fallback with full record comparisons
on:
  push:
    branches: [codex/capstone-output-fallback-census]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 3ea7f5838a88c9f34328dc6d8afb2ed89a30ab62
          path: source
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/census-venv"
          "$RUNNER_TEMP/census-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/census-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/census-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: output-fallback-census-clang18
          path: evidence/
          retention-days: 14
