name: Count remaining complete fallback paths and operand construction in the published decoder
on:
  push:
    branches: [codex/current-record-fallback-census]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, replica: 1 }
          - { host: ubuntu-22.04, cc: clang, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 771f67c4d5bbb9e3528279edea0518cdc2828bca
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: c4849a70bbf9f1c1b99f91e211984613a2c6a446
          path: neverd-config
          sparse-checkout: |
            cmake/NeverDCapstoneCompilerOptions.inc
            CMakeLists.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build from source and time only verified common function boundaries
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32 zstandard==0.23.0
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/trace.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: released-record-paths-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
