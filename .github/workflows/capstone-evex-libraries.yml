name: Validate packed VEX and SSE with the released RISC-V operand mapping on both Macs
on:
  push:
    branches: [codex/capstone-darwin-packed-with-riscv]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang, replica: 1 }
          - { host: macos-15-intel, cc: clang, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 5086dcd111161f146736f23cd2e6e2adede04a55
          path: source
          persist-credentials: false
      - name: Build from source and time only verified common function boundaries
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32 zstandard
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/prepare_baseline.py
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: darwin-packed-riscv-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
