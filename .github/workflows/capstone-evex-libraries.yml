name: Reproduce launch effects on EPYC 9V45
on:
  push:
    branches: [codex/capstone-matched-cpu-launch]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, replica: 1 }
          - { host: ubuntu-24.04, cc: clang, replica: 2 }
          - { host: ubuntu-24.04, cc: clang, replica: 3 }
          - { host: ubuntu-24.04, cc: clang, replica: 4 }
          - { host: ubuntu-24.04, cc: clang, replica: 5 }
          - { host: ubuntu-24.04, cc: clang, replica: 6 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 68
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Select the observed CPU model
        id: cpu
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          raw=Path('/proc/cpuinfo').read_text()
          model=next(line.split(':',1)[1].strip() for line in raw.splitlines() if line.startswith('model name'))
          selected='EPYC 9V45' in model
          Path('evidence/cpu-selection.json').write_text(json.dumps(dict(model=model,selected=selected),indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('selected='+str(selected).lower()+'\n')
          print(model, 'selected', selected)
          PY
      - if: steps.cpu.outputs.selected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - if: steps.cpu.outputs.selected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a51c656195387e5f5264e53abcebe7c1a11e46a0
          path: source
          persist-credentials: false
      - name: Prepare optional PMU access
        if: steps.cpu.outputs.selected == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic linux-tools-common
          sudo sysctl kernel.perf_event_paranoid=-1
      - name: Build from source and time only verified common function boundaries
        if: steps.cpu.outputs.selected == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: matched-cpu-launch-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
