name: Retime expanded x86 operand output on populated JPEG, zstd and libcrypto functions on two Mac models
on:
  push:
    branches: [codex/capstone-macos-expanded-real-functions]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang, trial: 1 }
          - { host: macos-15-intel, cc: clang, trial: 2 }
          - { host: macos-15, cc: clang, trial: 3 }
          - { host: macos-15-intel, cc: clang, trial: 4 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 68
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 6703e144275793a419ad663511e34b5dab3d52d8
          path: source
          persist-credentials: false
      - name: Build from source and time only verified common function boundaries
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          "$RUNNER_TEMP/capstone-elf-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/capstone-elf-venv/bin/python" capstone-vectors/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-expanded-repeat-${{ matrix.trial }}-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
