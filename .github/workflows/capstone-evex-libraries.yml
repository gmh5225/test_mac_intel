name: Qualify the rebased x86 output writer across allocator, adapter and table profiles
on:
  push:
    branches: [codex/capstone-vex32-configs-next]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, profile: standard }
          - { host: ubuntu-24.04, cc: gcc, profile: standard }
          - { host: ubuntu-24.04, cc: clang, profile: diet }
          - { host: ubuntu-24.04, cc: clang, profile: reduced }
          - { host: ubuntu-24.04, cc: clang, profile: intel }
          - { host: ubuntu-24.04, cc: clang, profile: custom }
          - { host: ubuntu-24.04, cc: clang, profile: adapter }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CS_PROFILE: ${{ matrix.profile }}
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 26ebcf8b672cbfec8536db188aa92c506c915efa
          path: source
          persist-credentials: false
      - name: Check original and candidate states, truncation and CMake configuration
        run: python3 capstone-vectors/configurations.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clang-vex-config-${{ matrix.cc }}-${{ matrix.profile }}
          path: evidence/
          retention-days: 14
