name: Check EXTRQ register selectors and REX.R on native SSE4a processors
on:
  push:
    branches: [codex/native-sse4a-extrq-register-selectors]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: gcc, replica: 1 }
          - { host: ubuntu-22.04, cc: gcc, replica: 2 }
          - { host: ubuntu-24.04, cc: gcc, replica: 1 }
          - { host: ubuntu-24.04, cc: gcc, replica: 2 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - name: Check EXTRQ register selectors on SSE4a hardware
        run: python3 -B capstone-vectors/probe.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-extrq-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
