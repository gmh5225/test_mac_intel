name: Check the dedicated ARM change against all mixed objects and linked consumers on three x86 source revisions
on:
  push:
    branches: [codex/arm-ordinary-archive-identity]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, replica: 1 }
          - { host: ubuntu-24.04-arm, cc: clang, replica: 1 }
          - { host: macos-15, cc: clang, replica: 1 }
          - { host: macos-15-intel, cc: clang, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: ac371faa70cb84ddcea8a4a3a1a1f2ea0d141ac3
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 9c84b2c7ecd883da23045650a794868d6c2ebd5c
          path: neverd-config
          sparse-checkout: |
            CMakeLists.txt
            cmake/NeverDCapstoneCompilerOptions.inc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify objects, archive contents and linked consumers
        run: python3 -B capstone-vectors/verify.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/neverd-config" "$GITHUB_WORKSPACE/iced-source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arm-operand-mixed-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
