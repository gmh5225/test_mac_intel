name: Read WebAssembly branch tables in dedicated Clang builds across three independent hosts
on:
  push:
    branches: [codex/wasm-clang-targets]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, cxx: clang++, replica: 1 }
          - { host: ubuntu-24.04, cc: clang, cxx: clang++, replica: 2 }
          - { host: ubuntu-24.04, cc: clang, cxx: clang++, replica: 3 }

    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a5c08759df756b179578e97670e148fa7629e88c
          path: source
          persist-credentials: false
      - name: Verify formatter hooks and time real WASM operators
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          python3 -B capstone-vectors/wasm/run.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wasm-clang-targets-${{ matrix.cc }}-${{ matrix.replica }}
          path: evidence/
          retention-days: 14
