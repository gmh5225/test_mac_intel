name: Measure ls cp and sort with shared decoder rows and AArch64 operand detail checks
on:
  push:
    branches: [codex/shared-rows-arm-operand-coreutils]
    paths: [capstone-vectors/**, .github/workflows/capstone-evex-libraries.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { host: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { host: ubuntu-24.04-arm, cc: clang, cxx: clang++ }
          - { host: macos-15, cc: clang, cxx: clang++ }
          - { host: macos-15-intel, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 105
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-vectors
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 477cdca0b80d3ababa2aa9c40375bad86914eaca
          path: source
          persist-credentials: false
      - name: Check full operand records and time coreutils executables
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          python3 -B capstone-vectors/a64/run.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-operand-programs-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
