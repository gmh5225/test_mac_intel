name: Capture native compiler switch images
on:
  push:
    branches: [codex/neverd-arm64e-image-jump-dispatch-20261120]
    paths: [neverd-input/**, .github/workflows/neverd-dispatch-input.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 9783985d705aedcd0142fae06626a5204f7971ca
          path: source
          sparse-checkout: unittests/lift/aarch64
          persist-credentials: false
      - run: python3 neverd-input/probe.py source/unittests/lift/aarch64/AArch64LiftedLeafFixtures.def images classic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linker-images
          path: images
          retention-days: 2
