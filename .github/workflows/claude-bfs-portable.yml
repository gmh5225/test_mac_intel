name: Bfs original compatibility flags and portable source build
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - bfs-portable/**
      - .github/workflows/claude-bfs-portable.yml
permissions:
  contents: read
jobs:
  build:
    name: Native ${{ matrix.arch }} Bfs portability reconstruction
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild sources and test measured original portability choices
        run: python3 bfs-portable/build.py --arch ${{ matrix.arch }} --output bfs-portable-build
      - name: Retain qualified public candidate and sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-portable-bfs-${{ github.run_attempt }}
          path: bfs-portable-build/public-bfs-portable/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiler and ABI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-portable-bfs-diagnostics-${{ github.run_attempt }}
          path: bfs-portable-build/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
