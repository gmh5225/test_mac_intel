name: Native macOS Swift focus queue and observer lifetime acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-swift-focus-state-acceptance/**
      - .github/workflows/claude-macos-swift-focus-state-acceptance.yml
permissions:
  contents: read
jobs:
  accept:
    name: Native macOS ${{ matrix.arch }} Swift focus queue and observer lifetime
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pin instruction fixture toolchains
        run: python3 -m pip install capstone==5.0.6 unicorn==2.1.4
      - name: Stage private input batch 1
        env:
          NDC_SWIFT_V34_000: ${{ secrets.NDC_SWIFT_V34_000 }}
          NDC_SWIFT_V34_001: ${{ secrets.NDC_SWIFT_V34_001 }}
          NDC_SWIFT_V34_002: ${{ secrets.NDC_SWIFT_V34_002 }}
          NDC_SWIFT_V34_003: ${{ secrets.NDC_SWIFT_V34_003 }}
          NDC_SWIFT_V34_004: ${{ secrets.NDC_SWIFT_V34_004 }}
          NDC_SWIFT_V34_005: ${{ secrets.NDC_SWIFT_V34_005 }}
          NDC_SWIFT_V34_006: ${{ secrets.NDC_SWIFT_V34_006 }}
          NDC_SWIFT_V34_007: ${{ secrets.NDC_SWIFT_V34_007 }}
        run: python3 -B macos-swift-focus-state-acceptance/run.py receive 0 8
      - name: Stage private input batch 2
        env:
          NDC_SWIFT_V34_008: ${{ secrets.NDC_SWIFT_V34_008 }}
          NDC_SWIFT_V34_009: ${{ secrets.NDC_SWIFT_V34_009 }}
          NDC_SWIFT_V34_010: ${{ secrets.NDC_SWIFT_V34_010 }}
          NDC_SWIFT_V34_011: ${{ secrets.NDC_SWIFT_V34_011 }}
          NDC_SWIFT_V34_012: ${{ secrets.NDC_SWIFT_V34_012 }}
          NDC_SWIFT_V34_013: ${{ secrets.NDC_SWIFT_V34_013 }}
          NDC_SWIFT_V34_014: ${{ secrets.NDC_SWIFT_V34_014 }}
        run: python3 -B macos-swift-focus-state-acceptance/run.py receive 8 7
      - name: Rebuild candidate source twice and compare focus queue and observer lifetime contracts
        run: python3 -B macos-swift-focus-state-acceptance/run.py ${{ matrix.arch }}
      - name: Export encrypted evidence and bounded aggregate only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-${{ matrix.arch }}-swift-focus-state-encrypted-${{ github.run_attempt }}
          path: swift-focus-state-encrypted-records/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
