name: Capstone fixed CPU performance control

on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-published-unit-suites]
    paths:
      - capstone-performance/**
      - .github/workflows/capstone-affinity.yml

permissions:
  contents: read

concurrency:
  group: capstone-published-unit-suites
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, target: mixed }
          - { host: ubuntu-24.04-arm, target: aarch64 }
          - { host: macos-15-intel, target: x86 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Run the registered native unit suites on the published revision
        run: python3 capstone-performance/published.py ${{ matrix.target }}
      - name: Preserve raw evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-units-${{ matrix.host }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: error
          retention-days: 14
