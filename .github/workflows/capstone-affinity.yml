name: Capstone fixed CPU performance control

on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-same-image-hex]
    paths:
      - capstone-performance/**
      - .github/workflows/capstone-affinity.yml

permissions:
  contents: read

concurrency:
  group: capstone-same-image-hex
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, baseline: combined }
          - { host: ubuntu-24.04-arm, baseline: combined }
    env:
      COMPARE_BASE: ${{ matrix.baseline }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Validate protocol and native host
        run: |
          uname -sm
          python3 -m unittest discover -s capstone-performance -p 'test_*.py' -v
      - name: Compare both hexadecimal writers in one immutable decoder image
        run: python3 capstone-performance/hex_controls.py
      - name: Preserve raw evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: same-image-hex-${{ matrix.host }}-${{ matrix.baseline }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: error
          retention-days: 14
