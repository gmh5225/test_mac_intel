name: Verify instruction layout independently of host and backend count

on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-layout-same-host-factorial]
    paths:
      - capstone-performance/**
      - .github/workflows/capstone-affinity.yml

permissions:
  contents: read

concurrency:
  group: capstone-layout-factorial
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, replicate: a }
          - { host: ubuntu-24.04, replicate: b }
          - { host: ubuntu-24.04, replicate: c }
          - { host: ubuntu-24.04-arm, replicate: a }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Measure both linked products and compiler flags on the same processor
        run: python3 capstone-performance/layout-factorial.py
      - name: Preserve raw evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: layout-factorial-${{ matrix.host }}-${{ matrix.replicate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: error
          retention-days: 14
