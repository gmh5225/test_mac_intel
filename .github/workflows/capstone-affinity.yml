name: Capstone fixed CPU performance control

on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-iced-warm-profile]
    paths:
      - capstone-performance/**
      - .github/workflows/capstone-affinity.yml

permissions:
  contents: read

concurrency:
  group: capstone-iced-warm-profile
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, baseline: combined }
    env:
      COMPARE_BASE: ${{ matrix.baseline }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Install Linux instruction profiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind
      - name: Count warm workload instructions, memory, branches and simulated cache misses
        run: python3 capstone-performance/profile.py
      - name: Preserve raw evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: x86-arch-relative-dispatch-${{ matrix.host }}-${{ matrix.baseline }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: error
          retention-days: 14
