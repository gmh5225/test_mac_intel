name: Capstone fixed CPU performance control

on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-inprocess-hex]
    paths:
      - capstone-performance/**
      - .github/workflows/capstone-affinity.yml

permissions:
  contents: read

concurrency:
  group: capstone-inprocess-hex
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [clang, gcc]
    env:
      HEX_COMPILER: ${{ matrix.compiler }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Validate protocol and native host
        run: |
          uname -sm
          python3 -m unittest discover -s capstone-performance -p 'test_*.py' -v
      - name: Alternate hexadecimal writers within one process and decoder handle
        run: python3 capstone-performance/inprocess.py
      - name: Preserve raw evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: inprocess-hex-${{ matrix.host }}-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: error
          retention-days: 14
