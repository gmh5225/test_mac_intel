name: Measure per-source GCC x64 string operation strategies for public formatter writes

on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-gcc-output-stringops]
    paths:
      - capstone-performance/**
      - .github/workflows/capstone-affinity.yml

permissions:
  contents: read

concurrency:
  group: capstone-gcc-output-stringops
  cancel-in-progress: false

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, baseline: gcc, trial: 1, stores: vector }
          - { host: ubuntu-22.04, baseline: gcc, trial: 2, stores: vector }
          - { host: ubuntu-24.04, baseline: gcc, trial: 3, stores: libcall }
          - { host: ubuntu-22.04, baseline: gcc, trial: 4, stores: libcall }
          - { host: ubuntu-24.04, baseline: gcc, trial: 5, stores: unrolled }
          - { host: ubuntu-22.04, baseline: gcc, trial: 6, stores: unrolled }
    env:
      COMPARE_BASE: gcc
      STORE_STRATEGY: ${{ matrix.stores }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Validate protocol and native host
        run: |
          uname -sm
          python3 -m unittest discover -s capstone-performance -p 'test_*.py' -v
      - name: Build immutable sources and verify outputs
        timeout-minutes: 27
        run: python3 capstone-performance/run.py prepare
      - name: Measure fixed CPU A/A and paired workloads
        timeout-minutes: 37
        run: python3 capstone-performance/run.py measure
      - name: Retire disposable products and summarize evidence
        if: always()
        run: python3 capstone-performance/run.py finish
      - name: Preserve raw evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gcc-store-flags-${{ matrix.stores }}-${{ matrix.trial }}-${{ matrix.host }}-${{ matrix.baseline }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: error
          retention-days: 14
