name: Public decoder and formatter instruction counts
on:
  push:
    branches: [codex/capstone-matched-public-observers]
    paths: [capstone-performance/**, .github/workflows/capstone-instruction-counts.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Install the simulator
        run: |
          tools_dir="$RUNNER_TEMP/capstone-valgrind"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 https://deb.debian.org/debian/pool/main/v/valgrind/valgrind_3.24.0-3_amd64.deb -o "$tools_dir/package.deb"
          cd "$tools_dir"
          echo '0359e30820ccee7ee5c8d4c951ca276e3978b18f157d71bd77981de05b344907  package.deb' | sha256sum --check
          dpkg-deb -x package.deb .
          rm package.deb
          vg_lib=$(dirname "$(find "$tools_dir/usr" -type f -name callgrind-amd64-linux -print -quit)")
          test -x "$vg_lib/callgrind-amd64-linux"
          echo "$tools_dir/usr/bin" >> "$GITHUB_PATH"
          echo "VALGRIND_LIB=$vg_lib" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$tools_dir/usr/include" >> "$GITHUB_ENV"
          VALGRIND_LIB="$vg_lib" "$tools_dir/usr/bin/valgrind" --tool=callgrind --callgrind-out-file="$tools_dir/smoke" /bin/true
      - name: Count the regular and opaque observers while both libraries build all requested results
        run: python3 capstone-performance/instruction_counts.py
      - name: Remove simulator files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-valgrind"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: matched-public-observers-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: warn
          retention-days: 14
