name: Public decoder and formatter instruction counts
on:
  push:
    branches: [codex/capstone-public-instruction-counts]
    paths: [capstone-performance/**, .github/workflows/capstone-instruction-counts.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Install the simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Count the warmed public decode loops
        run: python3 capstone-performance/instruction_counts.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-instruction-counts-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          if-no-files-found: warn
          retention-days: 14
