name: Repeat Linux MIPS PIC relink timings
on:
  push:
    branches: [codex/mips-pic-linux-repeats]
permissions:
  contents: read
env:
  PROJECT: f81e1d7fb33b543dee6a8ad8a7abafccf9e9c4a6
  NEW_LLVM: 54143a8d7c037ee4c22f1f238bd4d50ca9a5fd00
  OLD_LLVM: 6c769154fbe9db2fe9e2e2dc1b04bebfe64e1312
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NeverSight/NeverD
          ref: ${{ env.PROJECT }}
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NeverSight/llvm-project
          ref: ${{ env.NEW_LLVM }}
          path: llvm-src
          sparse-checkout: |
            cmake
            llvm
            lld
            libunwind/include
            third-party
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the candidate CLI and both source linkers with the original Release flags
        shell: bash
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes ninja-build clang-18 lld-18 g++-14 zstd
          test "$(git -C project rev-parse HEAD)" = "$PROJECT"
          test "$(git -C project rev-parse HEAD:third_party/llvm-project)" = "$NEW_LLVM"
          git -C project submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
          flags=(-DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14)
          cmake -S project -B project/build-neverd-pair -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_ENABLE_CPU_EMULATION=OFF \
            -DNEVERD_ENABLE_WEB_ANALYSIS=OFF "${flags[@]}"
          (cd project && python scripts/build.py build-neverd-pair --config Release --parallel 4 --target neverd)
          python .github/scripts/neverd_pair_stage.py project project/build-neverd-pair tools/r15 "$PROJECT" "$NEW_LLVM" r15
          cmake -E rm -rf project/build-neverd-pair
          git -C llvm-src fetch --no-tags --depth=1 origin "$OLD_LLVM"
          for release in r15 r14; do
            revision="$NEW_LLVM"
            if [[ "$release" == r14 ]]; then revision="$OLD_LLVM"; fi
            git -C llvm-src checkout --detach "$revision"
            cmake -S llvm-src/llvm -B build-mips-tools -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_ENABLE_PROJECTS=lld -DLLVM_TARGETS_TO_BUILD=Mips -DLLVM_ENABLE_RTTI=ON \
              -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_ZLIB=OFF \
              -DLLVM_ENABLE_ZSTD=OFF -DLLVM_PARALLEL_LINK_JOBS=1 "${flags[@]}"
            cmake --build build-mips-tools --parallel 4 --target llvm-mc llc lld
            build-mips-tools/bin/ld.lld --version | grep -F -- "$revision"
            mkdir -p "tools/$release"
            for exe in llc llvm-mc ld.lld; do cp -L "build-mips-tools/bin/$exe" "tools/$release/$exe"; done
          done
          find tools -type f -print0 | sort -z | xargs -0 sha256sum > tools.sha256
          tar -cf - tools tools.sha256 | zstd -q -2 -T2 -o paired.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixed-linux-installations
          path: paired.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  repeat:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NeverSight/NeverD
          ref: ${{ env.PROJECT }}
          path: project
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixed-linux-installations
      - name: Measure the public CLI, direct LLD and an identical-linker control for each revision
        shell: bash
        env:
          TRIAL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes libstdc++6 zstd
          echo 'pyelftools==0.33 --hash=sha256:f215ad5f47d3f1373a21496a6c9e0707c622840d0622f23ff7ce08678b020036' > paired-requirements.txt
          python -m pip install --require-hashes --no-deps -r paired-requirements.txt
          tar --use-compress-program=unzstd -xf paired.tar.zst
          sha256sum --check tools.sha256
          test "$(git -C project rev-parse HEAD)" = "$PROJECT"
          mkdir results
          cp tools.sha256 tools/r15/source.json results/
          lscpu > results/cpu.txt
          case "$TRIAL" in
            1) schedule=(public direct copy14 copy15);;
            2) schedule=(copy15 copy14 direct public);;
            3) schedule=(direct public copy15 copy14);;
          esac
          for kind in "${schedule[@]}"; do
            extra=()
            rounds=64
            case "$kind" in
              direct) extra=(--direct);;
              copy14) extra=(--identical r14); rounds=16;;
              copy15) extra=(--identical r15); rounds=16;;
            esac
            python .github/scripts/neverd_mips_partial_pairs.py project tools/r14 tools/r15 "results/$kind.json" \
              --pic --seed "$((2920073 + 123 * TRIAL))" --rounds "$rounds" "${extra[@]}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pic-pairs-${{ matrix.runner }}
          path: results/
          if-no-files-found: error
