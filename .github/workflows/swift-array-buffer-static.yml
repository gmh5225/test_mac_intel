name: Swift ArrayBuffer static inspection

on:
  push:
    branches:
      - codex/array-buffer-element-static

permissions:
  contents: read

jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 22
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect the installed Swift library
        run: python3 -B collect.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: swift-array-buffer-static
          path: static-evidence
          retention-days: 7
          if-no-files-found: error
