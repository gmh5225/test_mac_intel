name: NeverD JavaScript integration
run-name: NeverD JavaScript integration / ${{ inputs.source-ref || '0338896d904c42bda10a5ff408c26682577e2f02' }}

on:
  push:
    branches: [codex/claude-windows-recovery]
    paths: [.github/workflows/neverd-javascript-integration.yml]
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact NeverSight/NeverD commit to validate
        required: true
        type: string
        default: 0338896d904c42bda10a5ff408c26682577e2f02

permissions:
  contents: read

jobs:
  web:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: 'true'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ inputs.source-ref || '0338896d904c42bda10a5ff408c26682577e2f02' }}
          path: source
          persist-credentials: false
      - name: Require the exact native source revision
        env:
          EXPECTED_SOURCE: ${{ inputs.source-ref || '0338896d904c42bda10a5ff408c26682577e2f02' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(uname -m)" = arm64
          git submodule update --init --depth 1 third_party/capstone
      - name: Install the existing Web build dependencies
        run: brew install cmake ninja icu4c@77
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Configure a fresh Release ICU omission profile
        run: |
          set -euo pipefail
          cmake -S . -B build-web-integration -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DNEVERD_LLVM_PREBUILT=ON \
            -DNEVERD_ENABLE_WEB_ANALYSIS=ON \
            -DNEVERD_ENABLE_WEB_ASAR=OFF \
            -DNEVERD_ENABLE_WEB_JAVASCRIPT=ON \
            -DNEVERD_BUILD_SHARED=ON -DNEVERD_BUILD_WORKER=ON \
            -DNEVERD_BUILD_WEB_MCP=ON -DNEVERD_BUILD_GUI=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF -DNEVERD_ENABLE_Z3=OFF \
            -DNEVERD_ENABLE_CPU_EMULATION=OFF \
            -DNEVERD_ENABLE_DRIVER_EMULATION=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=OFF \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF \
            -DICU_ROOT="$(brew --prefix icu4c@77)"
      - name: Build the owning tests, transports and all six development exporters
        run: |
          set -euo pipefail
          python3 scripts/build.py build-web-integration --parallel 3 --target \
            NeverDWebArtifactTests NeverDWebSourceTests NeverDWebSourceMapTests \
            NeverDWebSDKTests NeverDWebNativeTests \
            NeverDWebZipWithoutDeflateTests NeverDWebGzipWithoutDecoderTests \
            NeverDWebBrotliWithoutDecoderTests \
            neverd neverd-worker-web-tests \
            neverd-web-mcp-protocol-tests neverd-web-mcp-catalog-tests \
            neverd-web-mcp-web-tests neverd-web-mcp-process-tests \
            neverd-web-bun-project neverd-web-bun-semantic-index \
            neverd-web-bun-inventory neverd-web-source-recovery \
            neverd-web-source-model neverd-web-source-map-model
      - name: Check the failing CLI boundary in a fresh ICU omission build
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          ctest --test-dir build-web-integration/unittests/web \
            -R '^WebDataPackSDK.CLIUsesSharedConsumersWithAnUnusableExternalPATH$' \
            --output-on-failure --no-tests=error \
            --output-junit "$PWD/integration-evidence/cold-omission-cli.xml"
      - name: Enable ICU before the complete profile sequence
        run: |
          set -euo pipefail
          cmake -S . -B build-web-integration -DNEVERD_ENABLE_WEB_ASAR=ON
          python3 scripts/build.py build-web-integration --parallel 3 --target \
            NeverDWebArtifactTests NeverDWebSourceTests NeverDWebSourceMapTests \
            NeverDWebSDKTests NeverDWebNativeTests \
            NeverDWebZipWithoutDeflateTests NeverDWebGzipWithoutDecoderTests \
            NeverDWebBrotliWithoutDecoderTests neverd neverd-worker-web-tests \
            neverd-web-mcp-protocol-tests neverd-web-mcp-catalog-tests \
            neverd-web-mcp-web-tests neverd-web-mcp-process-tests \
            neverd-web-bun-project neverd-web-bun-semantic-index \
            neverd-web-bun-inventory neverd-web-source-recovery \
            neverd-web-source-model neverd-web-source-map-model
      - name: Run the owning Web suite and transport checks
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          ctest --test-dir build-web-integration/unittests/web --show-only=json-v1 \
            > integration-evidence/enabled-test-inventory.json
          ctest --test-dir build-web-integration/unittests/web \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/enabled-web.xml"
          ctest --test-dir build-web-integration \
            -R '^NeverDWebMCP|^NeverDWorkerWeb$' \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/enabled-transports.xml"
      - name: Validate explicit parser omission
        run: |
          set -euo pipefail
          cmake -S . -B build-web-integration -DNEVERD_ENABLE_WEB_JAVASCRIPT=OFF
          python3 scripts/build.py build-web-integration --parallel 3 --target \
            NeverDWebArtifactTests NeverDWebSourceMapTests NeverDWebSDKTests \
            NeverDWebNativeTests NeverDWebZipWithoutDeflateTests \
            NeverDWebGzipWithoutDecoderTests NeverDWebBrotliWithoutDecoderTests \
            neverd neverd-worker-web-tests neverd-web-mcp-protocol-tests \
            neverd-web-mcp-catalog-tests neverd-web-mcp-web-tests \
            neverd-web-mcp-process-tests
          ctest --test-dir build-web-integration/unittests/web \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/parser-omission-web.xml"
          ctest --test-dir build-web-integration \
            -R '^NeverDWebMCP|^NeverDWorkerWeb$' \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/parser-omission-transports.xml"
      - name: Validate explicit ICU backend omission
        run: |
          set -euo pipefail
          cmake -S . -B build-web-integration \
            -DNEVERD_ENABLE_WEB_JAVASCRIPT=ON -DNEVERD_ENABLE_WEB_ASAR=OFF
          python3 scripts/build.py build-web-integration --parallel 3 --target \
            NeverDWebArtifactTests NeverDWebSourceTests NeverDWebSourceMapTests \
            NeverDWebSDKTests NeverDWebNativeTests \
            NeverDWebZipWithoutDeflateTests NeverDWebGzipWithoutDecoderTests \
            NeverDWebBrotliWithoutDecoderTests neverd neverd-worker-web-tests \
            neverd-web-mcp-protocol-tests neverd-web-mcp-catalog-tests \
            neverd-web-mcp-web-tests neverd-web-mcp-process-tests
          ctest --test-dir build-web-integration/unittests/web \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/backend-omission-web.xml"
          ctest --test-dir build-web-integration \
            -R '^NeverDWebMCP|^NeverDWorkerWeb$' \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/backend-omission-transports.xml"
      - name: Restore the enabled profile and rerun affected consumers
        run: |
          set -euo pipefail
          cmake -S . -B build-web-integration -DNEVERD_ENABLE_WEB_ASAR=ON
          python3 scripts/build.py build-web-integration --parallel 3 --target \
            NeverDWebArtifactTests NeverDWebSourceTests NeverDWebSourceMapTests \
            NeverDWebSDKTests NeverDWebNativeTests \
            NeverDWebZipWithoutDeflateTests NeverDWebGzipWithoutDecoderTests \
            NeverDWebBrotliWithoutDecoderTests neverd neverd-worker-web-tests \
            neverd-web-mcp-protocol-tests neverd-web-mcp-catalog-tests \
            neverd-web-mcp-web-tests neverd-web-mcp-process-tests \
            neverd-web-bun-project neverd-web-bun-semantic-index \
            neverd-web-bun-inventory neverd-web-source-recovery \
            neverd-web-source-model neverd-web-source-map-model
          ctest --test-dir build-web-integration/unittests/web \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/restored-web.xml"
          ctest --test-dir build-web-integration \
            -R '^NeverDWebMCP|^NeverDWorkerWeb$' \
            --output-on-failure --no-tests=error --parallel 3 \
            --output-junit "$PWD/integration-evidence/restored-transports.xml"
      - name: Retain logs and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neverd-javascript-integration-${{ github.run_attempt }}
          path: |
            source/integration-evidence/
            source/build-web-integration/neverd-*.json
            source/build-web-integration/Testing/Temporary/
            source/build-web-integration/unittests/web/Testing/Temporary/
            source/build-web-integration/CMakeCache.txt
            source/build-web-integration/bin/neverd
            source/build-web-integration/bin/NeverDWebSDKTests
            source/build-web-integration/bin/*.dylib
            source/build-web-integration/lib/*.dylib
            source/LICENSE
            source/THIRD_PARTY_NOTICES.md
          if-no-files-found: warn
          retention-days: 14
