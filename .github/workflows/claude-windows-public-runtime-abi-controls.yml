name: Authored Windows ARM64 public runtime string ABI controls
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-native-components/public_runtime_abi_controls.py
      - .github/workflows/claude-windows-public-runtime-abi-controls.yml
permissions:
  contents: read
  actions: read
jobs:
  control:
    runs-on: windows-11-arm
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-win32-arm64-native-source-runtime-1
          path: full-engine
          run-id: 39127984930
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-win32-arm64-bun-baseline-1
          path: baseline-engine
          run-id: 39030184325
          github-token: ${{ github.token }}
      - name: Qualify authored graph and OS boundary
        run: python -B windows-recovery/qualify.py --arch arm64 --output public-runtime-controls --authored-only
      - name: Collect only authored string ABI observations
        run: python -B windows-native-components/public_runtime_abi_controls.py --engine full-engine/bun.exe --baseline baseline-engine/bun.exe --environment public-runtime-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-win32-arm64-authored-string-ABI-controls-${{ github.run_attempt }}
          path: public-runtime-controls/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
