name: Native Windows UTF-16 source role boundary controls
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-native-components/role_boundary.rs
      - windows-native-components/role-boundary-control.rs
      - windows-native-components/verify_role_boundary.py
      - native-role-contracts/windows.rs
      - .github/workflows/claude-windows-role-boundary.yml
permissions:
  contents: read
jobs:
  verify:
    name: Native Windows ${{ matrix.arch }} UTF-16 and CRT OS boundary
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
      - name: Compile and check native Unicode arguments and inherited environment
        run: python -B windows-native-components/verify_role_boundary.py --arch ${{ matrix.arch }} --output windows-role-boundary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-win32-${{ matrix.arch }}-role-boundary-controls-${{ github.run_attempt }}
          path: windows-role-boundary/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
