name: Native admitted musl actual Bash and built-in search clients
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - musl-native-components/client_acceptance.py
      - musl-native-components/client_root.py
      - musl-native-components/client_tools.py
      - musl-native-components/client-boundary.c
      - musl-native-components/control-toolchain/**
      - musl-native-components/source-engine-pins.json
      - seccomp-helper/bash_tool_cases.py
      - seccomp-helper/native_search_acceptance.py
      - seccomp-helper/compare_bash.py
      - .github/workflows/claude-musl-actual-client.yml
permissions:
  contents: read
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.pins.outputs.profiles }}
      engine_run: ${{ steps.pins.outputs.engine_run }}
      sdk_run: ${{ steps.pins.outputs.sdk_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: pins
        run: |
          python3 -B - <<'PY'
          import json,os
          p=json.load(open('musl-native-components/source-engine-pins.json'))
          assert p['profiles'] and set(p['profiles'])<={'arm64','x64'}
          matrix={'include':[{'arch':a,'runner':'ubuntu-22.04-arm' if a=='arm64' else 'ubuntu-22.04'} for a in sorted(p['profiles'])]}
          values={'engine_run':p['producer_run'],'sdk_run':json.load(open('platform-runtime/musl-sdk-runtime-pins.json'))['producer_run']}
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('profiles='+json.dumps(matrix,separators=(',',':'))+'\n')
              for k,v in values.items():
                  assert type(v) is int and v>0
                  out.write(k+'='+str(v)+'\n')
          PY
  acceptance:
    needs: matrix
    name: Native musl ${{ matrix.arch }} real Bash Grep Glob
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.profiles) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-musl-sdk-1
          path: retained-sdk
          run-id: ${{ needs.matrix.outputs.sdk_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-musl-native-source-runtime-1
          path: retained-engine
          run-id: ${{ needs.matrix.outputs.engine_run }}
          github-token: ${{ github.token }}
      - name: Install the qualified namespace and proxy boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap=0.6.1-1ubuntu0.3 socat
      - name: Qualify owned musl ABI then rebuild and compare actual clients
        run: >-
          python3 -B musl-native-components/client_acceptance.py --arch ${{ matrix.arch }}
          --engine retained-engine --sdk retained-sdk
          --private "${{ runner.temp }}/private-musl-actual-client"
          --output musl-actual-client-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-linux-${{ matrix.arch }}-musl-actual-client-acceptance-${{ github.run_attempt }}
          path: musl-actual-client-acceptance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
