name: WMF SwiftCore static implementation evidence
on:
  push:
    branches: [codex/wmf-swiftcore-static-contract]
    paths:
      - .github/workflows/wmf-swiftcore-static.yml
      - wmf-swiftcore-static/**
permissions:
  contents: read
jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check new collector using synthetic static MachO inputs
        run: python3 -B -m unittest discover -s wmf-swiftcore-static -p 'test_*.py' -v
      - name: Read exact SwiftCore candidate function bodies and raw context
        run: python3 -B wmf-swiftcore-static/collect.py
      - name: Preserve complete bytes and actual command failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-swiftcore-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: wmf-swiftcore-static-records/
          if-no-files-found: error
          retention-days: 14
