name: Static GNU search helpers with native PCRE2 JIT
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - runtime-helpers/build.py
      - runtime-helpers/build-ripgrep.sh
      - .github/workflows/claude-static-search-helper.yml
permissions:
  contents: read
jobs:
  build:
    name: Native ${{ matrix.arch }} static GNU search helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check public archive boundaries
        run: python3 -m unittest discover -s runtime-helpers -p 'test_*.py' -v
      - name: Build pinned static GNU rg and PCRE2 10.45 with JIT
        run: python3 runtime-helpers/build.py --arch ${{ matrix.arch }} --libc glibc-static --output static-search-build
      - name: Retain exact public binaries and dependency inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-glibc-static-search-helper-${{ github.run_attempt }}
          path: static-search-build/public-search-helper/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-${{ matrix.arch }}-glibc-static-search-diagnostics-${{ github.run_attempt }}
          path: static-search-build/diagnostics/
          if-no-files-found: warn
          retention-days: 14
