name: NeverD scheduled arm64e switch publications
on:
  push:
    branches: [codex/neverd-arm64e-scheduled-tables-20261120]
    paths: [neverd-arm64e-scheduled/**, .github/workflows/neverd-arm64e-scheduled.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: neverd-arm64e-scheduled
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: bd6fc850320bab2c3dca6e34a96e66c33eafaee6
          path: neverd
          persist-credentials: false
          sparse-checkout: |
            scripts
            unittests/lift/format
            unittests/lift/aarch64
            include/neverd/runtime
            include/neverd/ir/intrinsics/AArch64
      - name: Measure the native x1 execution environment
        run: |
          ulimit -c 0
          status=0
          python3 neverd/scripts/verify_arm64e_native.py qualify-x1 --output "$GITHUB_WORKSPACE/evidence/x1" || status=$?
          [[ $status == 0 || $status == 2 ]]
      - name: Run the independent compiler originals and signed NeverD images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 neverd-arm64e-scheduled/replay.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-${{ matrix.runner }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
