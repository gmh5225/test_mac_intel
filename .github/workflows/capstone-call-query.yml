name: NeverD batched x86 CALL discovery from current fork sources
on:
  push:
    branches: [codex/capstone-batch-call-discovery]
    paths: [capstone-call-query/**, .github/workflows/capstone-call-query.yml]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-call-query
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          path: neverd
          ref: 8b46889707124368f56b535ece8d3067c6509cc4
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/llvm-project
          ref: main
          path: neverd/third_party/llvm-project
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
          persist-credentials: false
      - name: Initialize source dependencies
        working-directory: neverd
        run: git submodule update --init --depth 1 -- third_party/capstone third_party/unicorn third_party/mimalloc third_party/simdjson third_party/simdutf third_party/oneTBB third_party/highway
      - name: Build and test the proposed NeverD dev change and time the production scan
        env:
          CC: clang
          CXX: clang++
        run: python3 capstone-call-query/full-integration.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neverd-call-discovery
          path: product-evidence/
          retention-days: 14
