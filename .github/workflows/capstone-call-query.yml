name: Build the SDK and check Capstone consumers with current LLVM fork sources
on:
  push:
    branches: [codex/capstone-neverd-sdk-source-integration]
    paths: [capstone-call-query/**, .github/workflows/capstone-call-query.yml]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-call-query
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          path: neverd
          ref: bc9659da5d4e3df7bdfe32bcf8b8f855547b7d67
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/llvm-project
          ref: main
          path: neverd/third_party/llvm-project
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
          persist-credentials: false
      - name: Initialize source dependencies
        working-directory: neverd
        run: git submodule update --init --depth 1 -- third_party/capstone third_party/unicorn third_party/mimalloc third_party/simdjson third_party/simdutf third_party/oneTBB third_party/highway
      - name: Exercise x86 and ARM integration, including masked VFPCLASS loads
        env:
          CC: clang
          CXX: clang++
        run: python3 capstone-call-query/published-integration.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neverd-capstone-sdk-source
          path: product-evidence/
          retention-days: 14
