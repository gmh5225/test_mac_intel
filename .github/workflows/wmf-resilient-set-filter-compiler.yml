name: WMF resilient Set filter client compiler transport
"on":
  push:
    branches: [codex/wmf-resilient-set-filter-xcode265-r6415]
    paths:
      - .github/workflows/wmf-resilient-set-filter-compiler.yml
      - wmf-resilient-set-filter/**
permissions:
  contents: read
jobs:
  compile:
    name: Xcode 26.5 new filter clients with five existing authored modules
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile new authored clients to IR SIL and assembly
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: python3 -B wmf-resilient-set-filter/collect.py
      - name: Preserve full compiler commands inputs outputs and actual failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-resilient-set-filter-xcode265-${{ github.run_attempt }}
          path: wmf-resilient-set-filter-records/
          if-no-files-found: error
          retention-days: 14
