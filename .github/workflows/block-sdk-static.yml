name: URLComponents SDK client ABI - static only
on:
  push:
    branches: [codex/wmf-urlcomponents-sdk-static-r7808]
    paths:
      - .github/workflows/block-sdk-static.yml
      - urlcomponents-sdk-static/**
permissions:
  contents: read
jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate imported ABI extraction boundaries
        run: python3 -B -m unittest discover -s urlcomponents-sdk-static -p 'test_collect.py' -v
      - name: Compile authored Foundation clients to LLVM IR and SIL
        run: python3 -B urlcomponents-sdk-static/collect.py --output urlcomponents-sdk-records
      - name: Preserve exact client ABI evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urlcomponents-sdk-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: urlcomponents-sdk-records/
          if-no-files-found: error
          retention-days: 14
