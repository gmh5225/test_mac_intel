name: NSRange Block SDK declarations - static only
on:
  push:
    branches: [codex/wmf-nsrange-block-sdk-r6685]
    paths:
      - .github/workflows/block-sdk-static.yml
      - block-sdk-static/**
permissions:
  contents: read
jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate seven declaration extraction boundaries
        run: python3 -B -m unittest discover -s block-sdk-static -p 'test_collect.py' -v
      - name: Read SDK AST and compile an authored probe to LLVM IR
        run: python3 -B block-sdk-static/collect.py --output block-sdk-records
      - name: Preserve exact declaration profiles and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: block-sdk-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: block-sdk-records/
          if-no-files-found: error
          retention-days: 14
