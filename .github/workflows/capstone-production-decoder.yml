name: Compare AMD64 VEX memory decoding inside the source-built NeverD product
on:
  push:
    branches: [codex/shipping-amd64-vex-neverd]
    paths: [capstone-product/**, .github/workflows/capstone-production-decoder.yml]
permissions:
  contents: read
jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            cc: clang
            replica: 1
          - os: ubuntu-24.04
            cc: clang
            replica: 2
          - os: ubuntu-24.04
            cc: clang
            replica: 3
          - os: ubuntu-24.04-arm
            cc: clang
            replica: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          path: neverd
          ref: 71cb846c8439b33d947b5a9e8a0ed30579f9b44c
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/llvm-project
          ref: main
          path: neverd/third_party/llvm-project
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
          persist-credentials: false
      - name: Prepare ELF fixture reader
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-product-venv"
          "$RUNNER_TEMP/capstone-product-venv/bin/python" -m pip install pyelftools==0.32 zstandard==0.23.0
      - name: Initialize source dependencies
        working-directory: neverd
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          config=json.loads(Path('../capstone-product/source.json').read_text())
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==config['dev']
          assert git('rev-parse','HEAD:third_party/capstone')==config['checkout']==config['dev_gitlink']
          PY
          git submodule update --init --depth 1 -- third_party/capstone third_party/unicorn third_party/mimalloc third_party/simdjson third_party/simdutf third_party/oneTBB third_party/highway
          test "$(git -C third_party/capstone rev-parse HEAD)" = "$(git rev-parse HEAD:third_party/capstone)"
      - name: Build production decoding from source and time real PE, ELF and targeted SIMD
        env:
          CC: ${{ matrix.cc }}
          CXX: clang++
        run: '"$RUNNER_TEMP/capstone-product-venv/bin/python" capstone-product/product.py'
      - name: Clean temporary source exports
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/neverd" "$RUNNER_TEMP/capstone-product-venv"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-vex3-product-${{ matrix.replica }}-${{ matrix.os }}-${{ matrix.cc }}
          path: product-evidence/
          retention-days: 14
