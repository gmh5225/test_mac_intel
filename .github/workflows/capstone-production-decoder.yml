name: Verify the published native MSVC fix through actual NeverD source and targets
on:
  push:
    branches: [codex/capstone-integrated-msvc-terminal]
    paths: [capstone-product/**, .github/workflows/capstone-production-decoder.yml]
permissions:
  contents: read
jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          path: neverd
          ref: 51b862e8a70768974d6917eddd319faff6668994
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/llvm-project
          ref: main
          path: neverd/third_party/llvm-project
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
          persist-credentials: false
      - name: Initialize source dependencies
        working-directory: neverd
        run: git submodule update --init --depth 1 -- third_party/capstone third_party/unicorn third_party/mimalloc third_party/simdjson third_party/simdutf third_party/oneTBB third_party/highway signatures
      - name: Compare complete integrated Capstone archives
        run: |
          sudo apt-get -qq update
          sudo apt-get -y install lld ninja-build
          python3 capstone-product/integrated-check.py compare
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integrated-capstone-objects
          path: evidence/
          retention-days: 14
      - name: Build and run the actual dependent decoder targets
        run: python3 capstone-product/integrated-check.py contracts
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-product" "$GITHUB_WORKSPACE/neverd"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integrated-capstone-contracts
          path: |
            evidence/contracts.xml
            evidence/contracts.log
            evidence/dependent-build.log
          retention-days: 14
