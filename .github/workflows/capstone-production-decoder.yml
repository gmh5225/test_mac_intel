name: Measure AMD64 memory TEST and vector output on the published DIET fix in two source-built NeverD executables
on:
  push:
    branches: [codex/capstone-amd64-memory-products]
    paths: [capstone-product/**, .github/workflows/capstone-production-decoder.yml]
permissions:
  contents: read
jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
            replica: 1
          - os: ubuntu-24.04
            cc: clang
            replica: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          path: neverd
          ref: 58014c26001fc57a38cb27e3d2efc28de1d4a688
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/llvm-project
          ref: main
          path: neverd/third_party/llvm-project
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
          persist-credentials: false
      - name: Prepare ELF fixture reader
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-product-venv"
          "$RUNNER_TEMP/capstone-product-venv/bin/python" -m pip install pyelftools==0.32
      - name: Initialize source dependencies
        working-directory: neverd
        run: |
          test "$(git rev-parse HEAD)" = "58014c26001fc57a38cb27e3d2efc28de1d4a688"
          test "$(git ls-tree HEAD third_party/capstone | cut -d" " -f3 | cut -f1)" = "3458b2498e513a5c37d32f71db0909f8f75dd7c4"
          git submodule update --init --depth 1 -- third_party/capstone third_party/unicorn third_party/mimalloc third_party/simdjson third_party/simdutf third_party/oneTBB third_party/highway
      - name: Build production decoding from source and time real PE, ELF and targeted SIMD
        env:
          CC: ${{ matrix.cc }}
          CXX: clang++
        run: '"$RUNNER_TEMP/capstone-product-venv/bin/python" capstone-product/product.py'
      - name: Clean temporary source exports
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/neverd" "$RUNNER_TEMP/capstone-product-venv"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: memory-product-${{ matrix.replica }}-${{ matrix.os }}-${{ matrix.cc }}
          path: product-evidence/
          retention-days: 14
