name: Time validated native EVEX rows and four-backend improvements in actual NeverD dev on current fork LLVM sources
on:
  push:
    branches: [codex/neverd-native-evex-a32-current-forks]
    paths: [capstone-product/**, .github/workflows/capstone-production-decoder.yml]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          path: neverd
          ref: 84899c7a9b8e181dbf90787af0f07ca990f99373
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/llvm-project
          ref: main
          path: neverd/third_party/llvm-project
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
          persist-credentials: false
      - name: Initialize source dependencies
        working-directory: neverd
        run: git submodule update --init --depth 1 -- third_party/capstone third_party/unicorn third_party/mimalloc third_party/simdjson third_party/simdutf third_party/oneTBB third_party/highway
      - name: Build production decoding from source and time real PE, ELF and targeted SIMD
        env:
          CC: gcc
          CXX: g++
        run: python3 capstone-product/product.py
      - name: Clean temporary source exports
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/neverd"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-evex-product
          path: product-evidence/
          retention-days: 14
