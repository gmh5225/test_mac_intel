name: Append batch code and data after both existing private writers in actual NeverD products
on:
  push:
    branches: [codex/capstone-tail-batch-products]
    paths: [capstone-product/**, .github/workflows/capstone-production-decoder.yml]
permissions:
  contents: read
jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
            replica: 1
          - os: ubuntu-24.04
            cc: clang
            replica: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          path: neverd
          ref: c9570e03ec46bd82d06d082eb6292a076065e2a6
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/llvm-project
          ref: main
          path: neverd/third_party/llvm-project
          sparse-checkout: |
            llvm
            cmake
            libc
            third-party
          persist-credentials: false
      - name: Prepare ELF fixture reader
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-product-venv"
          "$RUNNER_TEMP/capstone-product-venv/bin/python" -m pip install pyelftools==0.32 zstandard==0.23.0
      - name: Initialize source dependencies
        working-directory: neverd
        run: |
          test "$(git rev-parse HEAD)" = "c9570e03ec46bd82d06d082eb6292a076065e2a6"
          test "$(git ls-tree HEAD third_party/capstone | cut -d" " -f3 | cut -f1)" = "989508842d378789f9d98465de059feb99913c96"
          git submodule update --init --depth 1 -- third_party/capstone third_party/unicorn third_party/mimalloc third_party/simdjson third_party/simdutf third_party/oneTBB third_party/highway
          git -C third_party/capstone fetch --depth=1 origin 34465fdeaea6988c753bde5de6ab93942f65de36
          git -C third_party/capstone checkout --detach 34465fdeaea6988c753bde5de6ab93942f65de36
      - name: Build production decoding from source and time real PE, ELF and targeted SIMD
        env:
          CC: ${{ matrix.cc }}
          CXX: clang++
        run: '"$RUNNER_TEMP/capstone-product-venv/bin/python" capstone-product/product.py'
      - name: Clean temporary source exports
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/neverd" "$RUNNER_TEMP/capstone-product-venv"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tail-batch-${{ matrix.replica }}-${{ matrix.os }}-${{ matrix.cc }}
          path: product-evidence/
          retention-days: 14
