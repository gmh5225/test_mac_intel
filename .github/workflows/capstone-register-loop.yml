name: Verify scoped EVEX entry preserves qualified runtime binaries
on:
  push:
    branches: [codex/capstone-evex-elf-x64-identity]
    paths: [capstone-access-loop/**, .github/workflows/capstone-register-loop.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        cc: [clang, gcc]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-access-loop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 106380545da022533aa28bb9af6ba4df9f6e9970
          path: source
          persist-credentials: false
      - run: python3 capstone-access-loop/verify.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evex-elf-x64-identity-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
