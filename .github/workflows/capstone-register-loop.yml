name: Validate MIPS short register copies across configurations
on:
  push:
    branches: [codex/capstone-mips-short-register-copies-profiles]
    paths: [capstone-access-loop/**, .github/workflows/capstone-register-loop.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, compiler: gcc, profile: four }
          - { host: ubuntu-22.04, compiler: clang, profile: four }
          - { host: ubuntu-24.04, compiler: gcc, profile: four }
          - { host: ubuntu-24.04, compiler: clang, profile: four }
          - { host: ubuntu-24.04, compiler: clang, profile: sanitize }
          - { host: ubuntu-24.04, compiler: clang, profile: diet }
          - { host: ubuntu-24.04, compiler: gcc, profile: reduced }
          - { host: ubuntu-24.04-arm, compiler: clang, profile: four }
          - { host: macos-15, compiler: clang, profile: four }
          - { host: windows-2022, compiler: MT, profile: four }
          - { host: windows-2022, compiler: MD, profile: four }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    env:
      TOOLCHAIN: ${{ matrix.compiler }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-access-loop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 5aafe3fa6274988f9325b2894a598ffe37f2a21a
          path: source
          persist-credentials: false
      - run: python capstone-access-loop/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: register-loop-${{ matrix.host }}-${{ matrix.compiler }}-${{ matrix.profile }}
          path: evidence/
          retention-days: 14
