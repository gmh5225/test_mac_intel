name: Validate zero-plan-miss VEX32 output in alternate configurations
on:
  push:
    branches: [codex/capstone-vex32-output-configurations-profiles]
    paths: [capstone-access-loop/**, .github/workflows/capstone-register-loop.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, compiler: clang, profile: sanitize }
          - { host: ubuntu-24.04, compiler: gcc, profile: sanitize }
          - { host: ubuntu-24.04, compiler: clang, profile: diet }
          - { host: ubuntu-24.04, compiler: gcc, profile: reduced }
          - { host: ubuntu-24.04, compiler: gcc, profile: diet }
          - { host: ubuntu-24.04, compiler: clang, profile: reduced }
          - { host: ubuntu-24.04, compiler: clang, profile: adapter }
          - { host: ubuntu-24.04, compiler: clang, profile: no-x86 }
          - { host: ubuntu-24.04, compiler: clang, profile: x86-only }
          - { host: ubuntu-24.04, compiler: gcc, profile: x86-only }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    env:
      TOOLCHAIN: ${{ matrix.compiler }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-access-loop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 3ea7f5838a88c9f34328dc6d8afb2ed89a30ab62
          path: source
          persist-credentials: false
      - run: python capstone-access-loop/verify.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vex32-output-configurations-${{ matrix.host }}-${{ matrix.compiler }}-${{ matrix.profile }}
          path: evidence/
          retention-days: 14
