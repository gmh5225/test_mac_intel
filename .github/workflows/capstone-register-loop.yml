name: Validate unchanged AArch64-only alias source with applicable unit targets
on:
  push:
    branches: [codex/capstone-alias-call-shape-configurations-profiles]
    paths: [capstone-access-loop/**, .github/workflows/capstone-register-loop.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, compiler: clang, profile: aarch64-only }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    env:
      TOOLCHAIN: ${{ matrix.compiler }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-access-loop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 7e54e86ca81124be00b978dd00164803a6b1f4b7
          path: source
          persist-credentials: false
      - run: python capstone-access-loop/verify.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alias-call-shape-configurations-${{ matrix.host }}-${{ matrix.compiler }}-${{ matrix.profile }}
          path: evidence/
          retention-days: 14
