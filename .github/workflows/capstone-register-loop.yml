name: Validate canonical EVEX transfer lengths and preserve original layout
on:
  push:
    branches: [codex/capstone-evex-transfer-scan]
    paths: [capstone-access-loop/**, .github/workflows/capstone-register-loop.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        cc: [clang, gcc]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-access-loop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 413b606f938a39d053fd61ef83a6277eec4e4f6e
          path: source
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/capstone-plan-venv"
          source "$RUNNER_TEMP/capstone-plan-venv/bin/activate"
          pip install pyelftools==0.32
          python3 capstone-access-loop/verify.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/capstone-plan-venv"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evex-transfer-scan-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
