name: Validate small EVEX extension entry with Make, Xcode and MSVC
on:
  push:
    branches: [codex/capstone-evex-extension-small-entry-build]
    paths: [capstone-access-loop/**, .github/workflows/capstone-register-loop.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, compiler: gcc, profile: make }
          - { host: macos-14, compiler: clang, profile: xcode }
          - { host: windows-latest, compiler: MT, profile: full }
          - { host: windows-latest, compiler: MD, profile: full }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      TOOLCHAIN: ${{ matrix.compiler }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-access-loop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 106380545da022533aa28bb9af6ba4df9f6e9970
          path: source
          persist-credentials: false
      - run: python capstone-access-loop/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evex-extension-small-entry-${{ matrix.host }}-${{ matrix.compiler }}-${{ matrix.profile }}
          path: evidence/
          retention-days: 14
