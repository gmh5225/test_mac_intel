name: Public search helper build
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - runtime-helpers/**
      - .github/workflows/claude-search-helper.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned ripgrep and PCRE2 with authored controls
        run: |
          python3 -m unittest discover -s runtime-helpers -p test_archive.py -v
          python3 runtime-helpers/build.py --output search-helper-build
      - name: Retain only public helper and dependency sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-linux-x64-search-helper-${{ github.run_attempt }}
          path: search-helper-build/public-search-helper/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-search-helper-diagnostics-${{ github.run_attempt }}
          path: search-helper-build/diagnostics/
          if-no-files-found: error
          retention-days: 14
