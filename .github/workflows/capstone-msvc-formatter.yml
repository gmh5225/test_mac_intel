name: Native MSVC generated Intel printer
on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-native-allocator-hooks]
    paths: [.gitattributes, capstone-performance/**, .github/workflows/capstone-msvc-formatter.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Check built-in, explicit CRT and custom allocators with MSVC and clang-cl
        run: python capstone-performance/windows-states.py
      - name: Retain exact inputs, control measurements and cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-allocator-hooks-${{ github.run_attempt }}
          path: capstone-evidence/
          retention-days: 14
