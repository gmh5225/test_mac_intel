name: Native MSVC generated Intel printer
on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-native-printer-literals]
    paths: [.gitattributes, capstone-performance/**, .github/workflows/capstone-msvc-formatter.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        crt: [MD, MT]
        variant: [known, fixed]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      LITERAL_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Build sources, compare snapshots and measure
        run: python capstone-performance/msvc/run.py ${{ matrix.crt }}
      - name: Retain exact inputs, control measurements and cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-printer-literals-${{ matrix.variant }}-${{ matrix.crt }}-${{ github.run_attempt }}
          path: capstone-evidence/
          retention-days: 14
