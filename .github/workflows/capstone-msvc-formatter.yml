name: Qualify the integrated dynamic CRT decoder and writemask table on current Capstone next
on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-dynamic-crt-integration-vs-latest]
    paths: [.gitattributes, capstone-performance/**, .github/workflows/capstone-msvc-formatter.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crt: MD, image: windows-2025 }
    runs-on: ${{ matrix.image }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Build sources, compare snapshots and measure
        run: python capstone-performance/msvc/ipo.py ${{ matrix.crt }}
      - name: Retain exact inputs, control measurements and cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dynamic-crt-${{ matrix.image }}-${{ matrix.crt }}-${{ github.run_attempt }}
          path: capstone-evidence/
          retention-days: 14
