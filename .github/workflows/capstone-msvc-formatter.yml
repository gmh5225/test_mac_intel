name: Qualify native MSVC writemask descriptors against iced
on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-native-mask-descriptors-scan]
    paths: [.gitattributes, capstone-performance/**, .github/workflows/capstone-msvc-formatter.yml]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        crt: [MD, MT]
        ipo: ["ON"]
    env:
      MEASURE_IPO: ${{ matrix.ipo }}
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Build sources, compare snapshots and measure
        run: python capstone-performance/msvc/toolchains.py ${{ matrix.crt }}
      - name: Retain exact inputs, control measurements and cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-mask-scan-repeat-${{ matrix.crt }}-${{ matrix.ipo }}-${{ github.run_attempt }}
          path: capstone-evidence/
          retention-days: 14
