name: Verify mixed-library scan fallback configurations
on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-scan-boundary-configurations]
    paths: [capstone-performance/**, .github/workflows/capstone-msvc-formatter.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        profile: [full, diet, reduced, no-att]
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Compare public records, mask states and architecture unit tests
        run: python capstone-performance/msvc/public_mask.py MD ${{ matrix.profile }}
      - name: Retain outputs and cleanup receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-boundary-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capstone-evidence/
          retention-days: 14
