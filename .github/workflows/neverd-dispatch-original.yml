name: Compiler original arm64e relative dispatch
on:
  push:
    branches: [codex/neverd-arm64e-image-jump-dispatch-20261120]
    paths: [neverd-dispatch-control/**, .github/workflows/neverd-dispatch-original.yml]
permissions:
  contents: read
jobs:
  original:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Link and exercise all compiler-original switch cases
        working-directory: neverd-dispatch-control
        run: |
          set -eu
          clang -target arm64e-apple-macos13.0 -dynamiclib -Wl,-ld_classic,-data_in_code_info dispatch.S -o "$RUNNER_TEMP/dispatch.dylib"
          clang -target arm64e-apple-macos13.0 dispatch.c -o "$RUNNER_TEMP/oracle"
          otool -l "$RUNNER_TEMP/dispatch.dylib" | sed -n '/cmd LC_DATA_IN_CODE/,+3p'
          "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/dispatch.dylib"
          /usr/sbin/sysctl -n machdep.cpu.brand_string
          echo 'All 72 original-image comparisons passed'
          python3 probe-object-formats.py
          cat object-formats.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: d1ade51d82a556e5ee16d8e2c629281841b2dc7f
          path: baseline
          persist-credentials: false
          sparse-checkout: include/neverd/runtime
      - name: Interrupt the compact-only compiler-original leaf at its first instruction
        working-directory: neverd-dispatch-control
        run: |
          set -eu
          clang -target arm64e-apple-macos15.0 -dynamiclib stages.S companion.S -o "$RUNNER_TEMP/stages.dylib"
          clang -target arm64e-apple-macos15.0 -O2 -Iinclude -I../baseline/include observer.c caller.S -o "$RUNNER_TEMP/observer"
          xcrun llvm-objdump --macho --unwind-info "$RUNNER_TEMP/stages.dylib"
          "$RUNNER_TEMP/observer" "$RUNNER_TEMP/stages.dylib" 0 3 "$RUNNER_TEMP/sample" raw-compact-entry raw-compact-entry
          cat "$RUNNER_TEMP/sample"
