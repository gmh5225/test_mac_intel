name: WMF authored Objective-C byref EH cold branches static profiles
on:
  push:
    branches: [codex/wmf-ObjC-byref-EH-cold-static-r207316]
    paths:
      - .github/workflows/wmf-ObjC-byref-EH-cold-static.yml
      - wmf-ObjC-byref-EH-cold-static/**
permissions:
  contents: read
jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify nine static collection boundaries
        run: python3 -B -m unittest discover -s wmf-ObjC-byref-EH-cold-static -p 'test_collect.py' -v
      - name: Collect complete public Foundation declarations and authored static compiler outputs
        run: python3 -B wmf-ObjC-byref-EH-cold-static/collect.py
      - name: Preserve all raw static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-ObjC-byref-EH-cold-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: wmf-ObjC-byref-EH-cold-static-records/
          if-no-files-found: error
          retention-days: 14
