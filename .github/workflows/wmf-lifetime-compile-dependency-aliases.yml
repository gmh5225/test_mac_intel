name: WMF readonly SDK compile dependency aliases
on:
  push:
    branches: [codex/wmf-simulator-provider-inventory]
    paths:
      - .github/workflows/wmf-lifetime-compile-dependency-aliases.yml
      - wmf-lifetime-dependency-aliases/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  aliases:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read the frozen first compiler dependency list without rerunning the compiler
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wmf-authored-platform7-block-lifetime-1
          run-id: 40921122862
          github-token: ${{ github.token }}
          path: wmf-frozen-first-build
      - name: Resolve every declared dependency against this runner's exact SDK
        run: python3 -B wmf-lifetime-dependency-aliases/collect.py
      - name: Preserve complete lexical and canonical dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-readonly-SDK-dependency-aliases-${{ github.run_attempt }}
          path: wmf-lifetime-dependency-alias-records/
          if-no-files-found: error
          retention-days: 14
