name: NeverD system signal and compact unwind qualification
on:
  push:
    branches: [codex/neverd-arm64e-sigtramp-recovery]
    paths: [neverd-arm64e-variadic/**, .github/workflows/neverd-arm64e-cursor.yml]
permissions:
  contents: write
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: source
        name: Read the immutable source revision
        run: python3 -c 'import json; print("revision=" + json.load(open("neverd-arm64e-variadic/Replay.def"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ steps.source.outputs.revision }}
          path: neverd
          persist-credentials: false
          sparse-checkout: |
            scripts
            unittests/lift/format
            unittests/lift/aarch64
            include/neverd/runtime
            include/neverd/ir/intrinsics/AArch64
      - name: Compare independent linked frames and outgoing exception arguments
        run: |
          ulimit -c 0
          python3 neverd-arm64e-variadic/diagnose-cxx.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-${{ matrix.runner }}
          path: cursor-evidence/
          retention-days: 7
          if-no-files-found: error
