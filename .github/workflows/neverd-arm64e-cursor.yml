name: NeverD vector publication and signed unwind qualification
on:
  push:
    branches: [codex/neverd-arm64e-vector-publication]
    paths: [neverd-arm64e-variadic/**, .github/workflows/neverd-arm64e-cursor.yml]
permissions:
  contents: write
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: source
        name: Read the immutable source revision
        run: python3 -c 'import json; print("revision=" + json.load(open("neverd-arm64e-variadic/Replay.def"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ steps.source.outputs.revision }}
          path: neverd
          persist-credentials: false
          sparse-checkout: |
            scripts
            unittests/lift/format
            unittests/lift/aarch64
            include/neverd/runtime
            include/neverd/ir/intrinsics/AArch64
      - name: Qualify original native PAC and signed exception controls
        run: |
          ulimit -c 0
          python3 neverd/scripts/verify_arm64e_native.py probe --output "$GITHUB_WORKSPACE/cursor-evidence/original-controls"
      - name: Compare independent signing instructions with the signal cursor
        run: |
          ulimit -c 0
          python3 neverd/scripts/verify_arm64e_native.py probe-cursor --output "$GITHUB_WORKSPACE/cursor-evidence/cursor"
      - name: Measure native checked pointer arithmetic
        run: |
          ulimit -c 0
          status=0
          python3 neverd/scripts/verify_arm64e_native.py probe-cpta --output "$GITHUB_WORKSPACE/cursor-evidence/cpta" || status=$?
          [[ $status == 0 || $status == 2 ]]
      - name: Replay the complete source-bound Release publication suite
        env:
          GH_TOKEN: ${{ github.token }}
          NEVERD_ARM64E_TEST_INCLUDE_DIR: ${{ github.workspace }}/neverd/include
        run: |
          brew list --versions zstd || brew install zstd
          ulimit -c 0
          python3 neverd-arm64e-variadic/run.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-${{ matrix.runner }}
          path: cursor-evidence/
          retention-days: 7
          if-no-files-found: error

  windows-frontend:
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: source
        shell: bash
        run: python -c 'import json; print("revision=" + json.load(open("neverd-arm64e-variadic/Replay.def"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ steps.source.outputs.revision }}
          path: neverd
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Install the pinned Windows Clang
        shell: pwsh
        run: ./neverd/scripts/ci/Install-WindowsFixtureClang.ps1
      - name: Verify Darwin function and Objective-C pointer signing at O0 and O2
        run: python neverd-arm64e-variadic/windows-probe.py
