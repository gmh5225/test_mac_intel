name: Compare corrected shared output assembly
on:
  push:
    branches: [codex/capstone-shared-wrapper-codegen]
    paths: [capstone-performance/**, .github/workflows/capstone-wrapper-codegen.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codegen:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - run: python3 capstone-performance/shared-wrapper-codegen.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wrapper-codegen-${{ matrix.host }}
          path: capstone-evidence/
          retention-days: 14
