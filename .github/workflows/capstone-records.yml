name: Isolate the scalar regression from the compact VEX reader
on:
  push:
    branches: [codex/capstone-scalar-vex-factorial]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: gcc, archs: x86 }
          - { host: ubuntu-22.04, cc: gcc, archs: x86 }
          - { host: ubuntu-24.04-arm, cc: gcc, archs: x86 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 706eab8fec07688db644fe64c9d82600592134f8
          path: source
          persist-credentials: false
      - name: Vary memory extent arithmetic and VEX compact decoding independently
        run: python3 capstone-records/matrix.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vex-scalar-factor-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
