name: Isolate prefix arithmetic and shared epilogue code generation
on:
  push:
    branches: [codex/capstone-vex32-shared-exit-factors]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, archs: four }
          - { host: ubuntu-22.04, cc: clang, archs: four }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 37261a87936b29b727efb9c4a909f347b48c9221
          path: source
          persist-credentials: false
      - name: Compare complete ARM records and independent executables with A/A controls
        run: |
          python3 -m venv "$RUNNER_TEMP/capstone-layout-venv"
          "$RUNNER_TEMP/capstone-layout-venv/bin/pip" install pyelftools==0.32
          "$RUNNER_TEMP/capstone-layout-venv/bin/python" capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/capstone-layout-venv"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vex32-shared-exit-factors-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
