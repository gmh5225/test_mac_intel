name: Validate cstest CRT inheritance and configuration switches
on:
  push:
    branches: [codex/capstone-cstest-msvc-runtime]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2022, cc: MSVC, runtime: MT }
          - { host: windows-2022, cc: MSVC, runtime: MD }
          - { host: windows-2022, cc: MSVC, runtime: MD-explicit }
          - { host: ubuntu-24.04, cc: gcc, runtime: default }
          - { host: macos-15, cc: clang, runtime: default }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 40
    env:
      RUNTIME: ${{ matrix.runtime }}
      TOOLCHAIN: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a51c656195387e5f5264e53abcebe7c1a11e46a0
          path: source
          persist-credentials: false
      - name: Build and test before and after Release Debug Release switches
        run: python capstone-records/measure.py
      - if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cstest-msvc-runtime-${{ matrix.host }}-${{ matrix.runtime }}
          path: evidence/
          retention-days: 14
