name: Diagnose executable names, padding and inode reuse on the flagged CPU model
on:
  push:
    branches: [codex/capstone-evex-image-identity]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, archs: four, replica: 1 }
          - { host: ubuntu-22.04, cc: clang, archs: four, replica: 2 }
          - { host: ubuntu-22.04, cc: clang, archs: four, replica: 3 }
          - { host: ubuntu-22.04, cc: clang, archs: four, replica: 4 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    env:
      REPLICA: ${{ matrix.replica }}
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 8acfcd402e9f5fb7a458faa37552e53d7da3aa9a
          path: source
          persist-credentials: false
      - name: Compare unchanged AArch64 consumer under ten predeclared launch controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind gdb
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          source "$RUNNER_TEMP/capstone-elf-venv/bin/activate"
          pip install pyelftools==0.32
          python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evex-image-identity-${{ matrix.replica }}-${{ matrix.host }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
