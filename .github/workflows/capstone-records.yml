name: Measure public iterator architecture boundary
on:
  push:
    branches: [codex/capstone-iterator-architecture-boundary-native]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: clang, archs: four, replica: 1 }
          - { host: ubuntu-22.04, cc: gcc, archs: four, replica: 1 }
          - { host: ubuntu-24.04, cc: clang, archs: four, replica: 1 }
          - { host: ubuntu-24.04, cc: gcc, archs: four, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 106380545da022533aa28bb9af6ba4df9f6e9970
          path: source
          persist-credentials: false
      - name: Measure isolated public iterator and x86 scan bodies
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iterator-architecture-boundary-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
