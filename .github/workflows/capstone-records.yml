name: Validate TriCore direct decoder lowering
on:
  push:
    branches: [codex/capstone-tricore-qualified-lowering-profiles]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: gcc, profile: default, archs: combined }
          - { host: ubuntu-22.04, cc: gcc, profile: diet, archs: combined }
          - { host: ubuntu-24.04, cc: gcc, profile: default, archs: combined }
          - { host: ubuntu-24.04, cc: gcc, profile: diet, archs: combined }
          - { host: ubuntu-24.04, cc: clang, profile: default, archs: combined }
          - { host: ubuntu-24.04, cc: clang, profile: diet, archs: combined }
          - { host: ubuntu-24.04, cc: clang, profile: sanitize, archs: combined }
          - { host: ubuntu-24.04, cc: gcc, profile: default, archs: TRICORE }
          - { host: ubuntu-24.04, cc: clang, profile: default, archs: TRICORE }
          - { host: ubuntu-24.04-arm, cc: clang, profile: default, archs: combined }
          - { host: ubuntu-24.04-arm, cc: gcc, profile: diet, archs: combined }
          - { host: macos-15, cc: clang, profile: default, archs: combined }
          - { host: windows-2022, cc: MD, profile: default, archs: combined }
          - { host: windows-2022, cc: MT, profile: default, archs: combined }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 35
    env:
      PROFILE: ${{ matrix.profile }}
      TOOLCHAIN: ${{ matrix.cc }}
      ARCH_SET: ${{ matrix.archs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 2bee00c0d58ae9de33ab9aad657138ef3376fce4
          path: source
          persist-credentials: false
      - name: Compare baseline and candidate public units and complete decode records
        run: python capstone-records/measure.py
      - if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tricore-qualified-lowering-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.profile }}-${{ matrix.archs }}
          path: evidence/
          retention-days: 14
