name: Isolate VEX call placement against scalar PE32 and SIMD throughput
on:
  push:
    branches: [codex/capstone-public-vex-call-placement]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: gcc, archs: x86, trial: 1 }
          - { host: ubuntu-24.04, cc: gcc, archs: x86, trial: 2 }
          - { host: ubuntu-24.04-arm, cc: gcc, archs: x86, trial: 3 }
          - { host: ubuntu-22.04, cc: gcc, archs: x86, trial: 4 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 7c43e5beb1da0e76b9e12d13d614d7e26cd17076
          path: source
          persist-credentials: false
      - name: Vary only REX representation and store/load width
        run: python3 capstone-records/matrix.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vex-placement-${{ matrix.trial }}-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
