name: Retest ARM text, ARM detail, PE32 and MIPS independently on Intel and Apple Silicon
on:
  push:
    branches: [codex/capstone-arm-text-detail-macos-recheck]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang, archs: arm, repeat: 1 }
          - { host: macos-15, cc: clang, archs: arm, repeat: 2 }
          - { host: macos-15, cc: clang, archs: four, repeat: 1 }
          - { host: macos-15, cc: clang, archs: four, repeat: 2 }
          - { host: macos-15-intel, cc: clang, archs: arm, repeat: 1 }
          - { host: macos-15-intel, cc: clang, archs: arm, repeat: 2 }
          - { host: macos-15-intel, cc: clang, archs: four, repeat: 1 }
          - { host: macos-15-intel, cc: clang, archs: four, repeat: 2 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: ea3443bd943f583b65005dc1af9fae94850b6de7
          path: source
          persist-credentials: false
      - name: Compare complete ARM records and independent executables with A/A controls
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mac-arm-extents-${{ matrix.repeat }}-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
