name: Measure Unified 32- and 64-bit VEX2 operand extent and legality on PE32, PE64, ARM64 and MIPS in five compiler environments
on:
  push:
    branches: [codex/capstone-vex2-one-decision-mixed]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: gcc, archs: four }
          - { host: ubuntu-22.04, cc: gcc, archs: four }
          - { host: ubuntu-24.04-arm, cc: gcc, archs: four }
          - { host: ubuntu-24.04, cc: clang, archs: four }
          - { host: ubuntu-24.04-arm, cc: clang, archs: four }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a7787ac5c7c0ead02a3c46c85cdcfcb482dc6343
          path: source
          persist-credentials: false
      - name: Compare complete ARM records and independent executables with A/A controls
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vex2-one-decision-images-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
