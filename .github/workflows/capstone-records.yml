name: Diagnose compact mapping with ELF load bias and ASLR
on:
  push:
    branches: [codex/capstone-compact-load-bias]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: gcc, archs: replica0 }
          - { host: ubuntu-22.04, cc: gcc, archs: replica1 }
          - { host: ubuntu-22.04, cc: gcc, archs: replica2 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: a51c656195387e5f5264e53abcebe7c1a11e46a0
          path: source
          persist-credentials: false
      - name: Install debugger for address-only snapshots
        run: sudo apt-get update -qq && sudo apt-get install -y gdb
      - name: Compare independent native images and fixed launches with A/A controls
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compact-load-bias-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
