name: Measure direct ARM opcode mapping with real coreutils and A32/Thumb differential records
on:
  push:
    branches: [codex/capstone-arm-opcode-mapping]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang }
          - { host: macos-15-intel, cc: clang }
          - { host: ubuntu-24.04-arm, cc: gcc }
          - { host: ubuntu-24.04, cc: clang }
          - { host: ubuntu-24.04, cc: gcc }
          - { host: ubuntu-24.04-arm, cc: clang }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 8788c077d7de2724fbf9a82f46f43a2dbd2b5e63
          path: source
          persist-credentials: false
      - name: Measure independent static executables with both initializer placements
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arm-opcode-mapping-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
