name: Verify the MIPS PTR64 store conditional register and address on Release and DIET
on:
  push:
    branches: [codex/capstone-sc64-register-widths]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  mips:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, diet: OFF }
          - { host: ubuntu-24.04, diet: OFF }
          - { host: ubuntu-24.04, diet: ON }
          - { host: ubuntu-24.04-arm, diet: OFF }
          - { host: windows-2025, diet: OFF }
          - { host: macos-15-intel, diet: OFF }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 9eaea5dec6e4b3b20a1a9802678405ae4500b52f
          path: source
          persist-credentials: false
      - name: Build and check SC in both byte orders
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf -- build source' EXIT
          git -C source apply ../capstone-records/sc64.patch
          cmake -S source -B build -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_MIPS_SUPPORT=ON -DCAPSTONE_BUILD_MACOS_THIN=ON -DCAPSTONE_BUILD_CSTEST=ON -DCAPSTONE_BUILD_CSTOOL=OFF -DCAPSTONE_BUILD_LEGACY_TESTS=OFF -DCAPSTONE_BUILD_DIET=${{ matrix.diet }}
          cmake --build build --config Release --target mips_scan --parallel 4
          ctest --test-dir build -C Release --no-tests=error --output-on-failure -R '^unit_mips_scan$'
