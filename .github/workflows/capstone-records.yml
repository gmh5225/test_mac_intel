name: Retime dedicated LoongArch output and details on independent Apple hosts
on:
  push:
    branches: [codex/capstone-loongarch-native-detail-repeats]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang, archs: loongarch, trial: 1 }
          - { host: macos-15, cc: clang, archs: loongarch, trial: 2 }
          - { host: macos-15-intel, cc: clang, archs: loongarch, trial: 3 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 6703e144275793a419ad663511e34b5dab3d52d8
          path: source
          persist-credentials: false
      - name: Compare LoongArch records and retime complete native loong64 coreutils text sections
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: loongarch-repeat-${{ matrix.trial }}-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
