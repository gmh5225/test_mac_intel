name: Check VALIGND and VALIGNQ operand access, mask reads and ISA groups in both syntax orders
on:
  push:
    branches: [codex/capstone-valign-operand-access]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  access:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: gcc, flags: "" }
          - { host: ubuntu-24.04, cc: gcc, flags: "-DCAPSTONE_X86_ATT_DISABLE=ON" }
          - { host: ubuntu-24.04, cc: clang, flags: "-DCMAKE_C_FLAGS=-fsanitize=address,undefined" }
          - { host: ubuntu-24.04-arm, cc: gcc, flags: "" }
          - { host: macos-15-intel, cc: clang, flags: "" }
          - { host: windows-2025, cc: cl, flags: "" }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 535dfe10dcc2c3d8075f447631cbaf6694adc4cf
          path: source
          persist-credentials: false
      - name: Build the four production backends and exercise the x86 public APIs
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          trap 'rm -rf -- build source' EXIT
          git -C source -c core.autocrlf=false apply ../capstone-records/four.patch ../capstone-records/valign.patch
          python source/suite/synctools/x86_mapping_counts.py --check
          cmake -S source -B build -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_X86_SUPPORT=ON -DCAPSTONE_ARM_SUPPORT=ON -DCAPSTONE_AARCH64_SUPPORT=ON -DCAPSTONE_MIPS_SUPPORT=ON -DCAPSTONE_BUILD_MACOS_THIN=ON -DCAPSTONE_BUILD_CSTEST=ON -DCAPSTONE_BUILD_CSTOOL=OFF -DCAPSTONE_BUILD_LEGACY_TESTS=OFF $FLAGS
          cmake --build build --config Release --target x86_valign_access x86_reg_access x86_mapping_counts x86_evex_reserved_fields x86_evex_mask_conversion_access --parallel 4
          ctest --test-dir build -C Release --no-tests=error --output-on-failure -R '^unit_(x86_valign_access|x86_reg_access|x86_mapping_counts|x86_mapping_counts_generator|x86_evex_reserved_fields|x86_evex_mask_conversion_access)$'
