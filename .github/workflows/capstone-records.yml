name: Verify the exact AArch64 release objects for dedicated, DIET and mixed products
on:
  push:
    branches: [codex/capstone-aarch64-release-objects]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang }
          - { host: ubuntu-24.04-arm, cc: gcc }
          - { host: ubuntu-24.04, cc: clang }
          - { host: ubuntu-24.04, cc: gcc }
          - { host: ubuntu-24.04-arm, cc: clang }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: f6054796e7ecf52e174edf336c564facb1d762e0
          path: source
          persist-credentials: false
      - name: Confirm every release object against its qualified implementation and run public MC tests
        run: python3 capstone-records/qualify.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-aarch64-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
