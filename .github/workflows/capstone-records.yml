name: Diagnose the AMD 9V74 baseline anomaly with matched compilers
on:
  push:
    branches: [codex/capstone-baseline-runtime-state-9v74]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, cc: both, archs: four, replica: 1 }
          - { host: ubuntu-22.04, cc: both, archs: four, replica: 2 }
          - { host: ubuntu-22.04, cc: both, archs: four, replica: 3 }
          - { host: ubuntu-22.04, cc: both, archs: four, replica: 4 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 106380545da022533aa28bb9af6ba4df9f6e9970
          path: source
          persist-credentials: false
      - name: Compare retained and restarted baseline processes and check undefined values
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          python3 -m venv "$RUNNER_TEMP/capstone-elf-venv"
          source "$RUNNER_TEMP/capstone-elf-venv/bin/activate"
          pip install pyelftools==0.32
          python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/capstone-elf-venv" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: baseline-runtime-state-9v74-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ matrix.replica }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
