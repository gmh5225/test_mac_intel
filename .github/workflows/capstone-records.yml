name: Inspect ARM diagnostic ELF section placement
on:
  push:
    branches: [codex/capstone-arm-layout-preflight]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 729680277dd762704ea3270291b7a75318f51583
          path: source
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/elf"
          "$RUNNER_TEMP/elf/bin/python" -m pip install pyelftools==0.32
          "$RUNNER_TEMP/elf/bin/python" capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/elf"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arm-layout-preflight
          path: evidence/
          retention-days: 14
