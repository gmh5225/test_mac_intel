name: Validate TriCore width admission identity
on:
  push:
    branches: [codex/capstone-tricore-dedicated-width-identity]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: gcc, archs: standard }
          - { host: ubuntu-24.04, cc: gcc, archs: extra }
          - { host: ubuntu-22.04, cc: gcc, archs: standard }
          - { host: ubuntu-22.04, cc: gcc, archs: extra }
          - { host: ubuntu-24.04-arm, cc: gcc, archs: standard }
          - { host: ubuntu-24.04-arm, cc: gcc, archs: extra }
          - { host: ubuntu-24.04, cc: clang, archs: standard }
          - { host: ubuntu-24.04, cc: clang, archs: extra }
          - { host: ubuntu-24.04-arm, cc: clang, archs: standard }
          - { host: ubuntu-24.04-arm, cc: clang, archs: extra }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 65
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 2bee00c0d58ae9de33ab9aad657138ef3376fce4
          path: source
          persist-credentials: false
      - name: Validate exact objects and linked binaries
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tricore-dedicated-width-identity-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
