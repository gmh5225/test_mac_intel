name: Repeat real AArch64 ls formatting with independent macOS machines and A/A controls
on:
  push:
    branches: [codex/capstone-aarch64-macos-repeat]
    paths: [capstone-records/**, .github/workflows/capstone-records.yml]
permissions:
  contents: read
jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, cc: clang, archs: aarch64, repeat: 1 }
          - { host: macos-15, cc: clang, archs: aarch64, repeat: 2 }
          - { host: macos-15-intel, cc: clang, archs: aarch64, repeat: 3 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      BUILD_ARCHS: ${{ matrix.archs }}
      MEASURE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-records
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 01ce67005793c4369e64b509e5ec8f9cb2945d98
          path: source
          persist-credentials: false
      - name: Compare complete AArch64 records and independent executables with A/A controls
        run: python3 capstone-records/measure.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-repeat-${{ matrix.repeat }}-${{ matrix.archs }}-${{ matrix.host }}-${{ matrix.cc }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
