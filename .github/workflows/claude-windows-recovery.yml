name: Windows recovery environment
run-name: Native Windows recovery environment / ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-recovery/**
      - .github/workflows/claude-windows-recovery.yml
permissions:
  contents: read
jobs:
  qualify:
    name: Native ${{ matrix.arch }} recovery acceptance
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Qualify environment and compare pinned client
        shell: pwsh
        run: python windows-recovery/qualify.py --arch ${{ matrix.arch }} --output windows-evidence --editable-probe
      - name: Retain diagnostic receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.arch }}-environment-${{ github.run_attempt }}
          path: windows-evidence/evidence/
          if-no-files-found: error
          retention-days: 14
