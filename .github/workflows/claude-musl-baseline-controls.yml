name: Native owned standalone controls for exact public musl baselines
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - platform-runtime/qualify_musl_baseline.py
      - platform-runtime/musl-baseline-candidates.json
      - .github/workflows/claude-musl-baseline-controls.yml
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    name: Native ${{ matrix.arch }} owned musl baseline controls
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve recorded public runtime and SDK producers
        id: candidate
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('platform-runtime/musl-baseline-candidates.json').read_bytes())['profiles'][os.environ['TARGET_ARCH']]
          sdk=json.loads(Path('platform-runtime/musl-sdk-runtime-pins.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('runtime_run='+str(p['producer_run'])+'\nruntime_artifact='+p['artifact']+'\nsdk_run='+str(sdk['producer_run'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.candidate.outputs.runtime_artifact }}
          run-id: ${{ steps.candidate.outputs.runtime_run }}
          github-token: ${{ github.token }}
          path: public-runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-musl-sdk-1
          run-id: ${{ steps.candidate.outputs.sdk_run }}
          github-token: ${{ github.token }}
          path: retained-sdk
      - name: Execute the source engine and its exact standalone on the native target
        run: python3 -B platform-runtime/qualify_musl_baseline.py --arch ${{ matrix.arch }} --runtime public-runtime --sdk retained-sdk --output native-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-linux-${{ matrix.arch }}-musl-baseline-owned-controls-${{ github.run_attempt }}
          path: native-controls/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
