name: Native Windows private Ugrep COFF source library
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - windows-native-components/build_private_library.py
      - windows-native-components/private_symbols.py
      - windows-native-components/coff_admission.py
      - windows-native-components/coff-checker-pins.json
      - windows-native-components/coff-native-controls-qualification.json
      - windows-native-components/component_libraries.py
      - windows-native-components/source-component-pins.json
      - .github/workflows/claude-windows-private-library.yml
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Native Windows ${{ matrix.arch }} private COFF library
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
      - name: Read admitted public source producer
        id: input
        run: |
          python -B -c "import json,os; p=json.load(open('windows-native-components/source-component-pins.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('run='+str(p['producer_run'])+'\n')"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-win32-${{ matrix.arch }}-ugrep-source-candidate-1
          path: source-candidate
          run-id: ${{ steps.input.outputs.run }}
          github-token: ${{ github.token }}
      - name: Check every COFF object and execute both standalone source hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B windows-native-components/build_private_library.py --arch ${{ matrix.arch }} --candidate source-candidate --output windows-private-library
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-win32-${{ matrix.arch }}-ugrep-source-library-${{ github.run_attempt }}
          path: windows-private-library/public-library/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-win32-${{ matrix.arch }}-ugrep-library-diagnostics-${{ github.run_attempt }}
          path: windows-private-library/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
