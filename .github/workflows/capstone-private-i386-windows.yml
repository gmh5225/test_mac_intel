name: Profile public x86 formatting with GCC and Clang on AArch64 and AMD64
on:
  push:
    branches: [codex/compact-scalar-gcc-instruction-costs]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, arch: x86_64, profile: gcc, replica: 1 }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: gcc, replica: 1 }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, replica: 1 }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: clang, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 8519aa66bc2c2af381d5df735204d1e7fdd7cd27
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Install callgrind
        run: sudo apt-get -qq update && sudo apt-get -qq -y install valgrind
      - name: Time both library forms with the same executable names and frozen function ranges
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/bootstrap.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scalar-stride-counters-${{ matrix.replica }}-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
