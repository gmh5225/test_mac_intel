name: Verify RISC-V library object scope and all CSR detail encodings
on:
  push:
    branches: [codex/cstool-riscv-lib-and-csr]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: clang }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: full, compiler: gcc }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: full, compiler: clang }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 499ddf54d2723f7357e92db138e4e9beb71b28a5
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Linux' && matrix.profile == 'full'
        with:
          repository: NeverSight/NeverD
          ref: f73475381f5bf3936bd07139142a4915f9934815
          path: neverd-config
          sparse-checkout: |
            cmake
            CMakeLists.txt
          persist-credentials: false
      - name: Select the versioned compiler
        if: startsWith(matrix.compiler, 'gcc-')
        env:
          C_TOOL: ${{ matrix.compiler }}
        run: |
          version="${C_TOOL#gcc-}"
          if ! command -v "g++-$version" >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y "g++-$version"
          fi
          "$C_TOOL" -dumpfullversion
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
          NATIVE_COMPILER: ${{ matrix.compiler }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rv-csr-library-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.compiler }}-${{ matrix.variant }}
          path: evidence
          retention-days: 7
