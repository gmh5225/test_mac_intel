name: Check generated i386 scan records and MOV absolute-address formatting across nineteen configurations
on:
  push:
    branches: [codex/i386-escape-and-moffs-configurations]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, arch: x86_64, profile: gcc }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: clang }
          - { host: windows-2022, arch: amd64, profile: full }
          - { host: windows-2022, arch: amd64, profile: diet }
          - { host: windows-2022, arch: amd64, profile: reduced }
          - { host: windows-2022, arch: amd64, profile: noatt }
          - { host: windows-2022, arch: amd64_x86, profile: full }
          - { host: windows-2022, arch: amd64_x86, profile: diet }
          - { host: windows-2022, arch: amd64_x86, profile: reduced }
          - { host: windows-2022, arch: amd64_x86, profile: noatt }
          - { host: macos-15, arch: arm64, profile: full }
          - { host: macos-15, arch: arm64, profile: diet }
          - { host: macos-15, arch: arm64, profile: reduced }
          - { host: macos-15, arch: arm64, profile: noatt }
          - { host: macos-15-intel, arch: x86_64, profile: full }
          - { host: macos-15-intel, arch: x86_64, profile: diet }
          - { host: macos-15-intel, arch: x86_64, profile: reduced }
          - { host: macos-15-intel, arch: x86_64, profile: noatt }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 42c169fe6d452d843ddf135cce8b9b18ee6b6995
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: i386-selected-token-config-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
