name: Compare static and shared x86, Arm, RISC-V and mixed builds after dedicated MIPS specialization
on:
  push:
    branches: [codex/dedicated-mips-mixed-equivalence]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, arch: x86_64, profile: gcc }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 17d578259c044cad6ade810870f2aa1e7d33724a
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dedicated-mips-control-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
