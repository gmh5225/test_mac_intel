name: Check the archive and the program which links only the public disassembler on Linux
on:
  push:
    branches: [codex/decoder-archive-consumer-proof]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, replica: 4274 }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, replica: 4276 }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, replica: 4280 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          fetch-depth: 2
          ref: 3af4f18baa8c88ed070a71f48c53e28bb38f8fc7
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Time both library forms with the same executable names and frozen function ranges
        env:
          CHECK_DECODER: ${{ matrix.replica }}
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/bootstrap.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verified-native-link-${{ matrix.replica }}-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
