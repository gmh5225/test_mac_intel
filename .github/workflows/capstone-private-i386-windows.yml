name: Isolate dense RISC-V detail completion and compare active text paths
on:
  push:
    branches: [codex/riscv-dedicated-dense-operands]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2022, arch: amd64, profile: full }
          - { host: windows-2022, arch: amd64, profile: diet }
          - { host: windows-2022, arch: amd64_x86, profile: full }
          - { host: windows-2022, arch: amd64_x86, profile: diet }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc, variant: two }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc, variant: three }
          - { host: ubuntu-22.04, arch: amd64, profile: full, compiler: gcc, variant: earlier }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: clang }
          - { host: ubuntu-24.04, arch: amd64, profile: diet }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: full, compiler: gcc }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: full, compiler: clang }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: diet }
          - { host: macos-15, arch: arm64, profile: full }
          - { host: macos-15, arch: arm64, profile: diet }
          - { host: macos-15-intel, arch: x86_64, profile: full }
          - { host: macos-15-intel, arch: x86_64, profile: diet }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 96d63971a2801bb17b4ade6a9697c19722e0438d
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Linux' && matrix.profile == 'full'
        with:
          repository: NeverSight/NeverD
          ref: 276a657138f58b0ef97a876288347aaacfde0e74
          path: neverd-config
          sparse-checkout: |
            cmake
            CMakeLists.txt
          persist-credentials: false
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
          NATIVE_COMPILER: ${{ matrix.compiler }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rv-dense-detail-leaf-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.compiler }}-${{ matrix.variant }}
          path: evidence
          retention-days: 7
