name: Measure XCore uniform halfword scans and operand records on firmware
on:
  push:
    branches: [codex/xcore-uniform-encoding-firmware]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, arch: repeat2, profile: full }
          - { host: ubuntu-24.04, arch: repeat2, profile: full }
          - { host: ubuntu-22.04, arch: x86_64, profile: full }
          - { host: ubuntu-24.04, arch: x86_64, profile: full }
          - { host: macos-15, arch: arm64, profile: full }
          - { host: macos-15-intel, arch: x86_64, profile: full }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: eda656187b91970987b016629023b894bf83ce2f
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare original and candidate bytes and native tests
        env:
          REPEAT: ${{ matrix.arch }}
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/native.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: xcore-uniform-time-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
