name: Compare 64-bit WASM constants and branch table addresses on Win32 and Win64 using both iterator and batch APIs
on:
  push:
    branches: [codex/wasm-wide-operand-fields]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2022, arch: amd64, profile: full }
          - { host: windows-2022, arch: amd64, profile: diet }
          - { host: windows-2022, arch: amd64_x86, profile: full }
          - { host: windows-2022, arch: amd64_x86, profile: diet }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 68be0029b78515fd57eb2ca01540e109037f7760
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wasm-wide-fields-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
