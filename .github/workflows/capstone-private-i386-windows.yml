name: Complete missing Windows static and shared library checks in isolated two-source jobs
on:
  push:
    branches: [codex/final-windows-archive-configs]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2022, arch: amd64, profile: full, variant: sized }
          - { host: windows-2022, arch: amd64, profile: full, variant: unsigned }
          - { host: windows-2022, arch: amd64, profile: full, variant: scalar }
          - { host: windows-2022, arch: amd64, profile: full, variant: fixed }
          - { host: windows-2022, arch: amd64_x86, profile: full, variant: fixed }
          - { host: windows-2022, arch: amd64_x86, profile: noatt, variant: fixed }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: acb6a6298e4642828981a72acc6022ee36fcd0be
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
          SCAN_VARIANT: ${{ matrix.variant }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-windows-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.variant }}
          path: evidence
          retention-days: 7
