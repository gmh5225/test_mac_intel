name: Measure the full RISC-V operand and scan changes on native Intel and Apple Silicon macOS
on:
  push:
    branches: [codex/riscv-macos-canonical-and-compressed]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-15, arch: arm64, profile: full }
          - { host: macos-15-intel, arch: x86_64, profile: full }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 236614a333d4bf55faca1960814bb6fbc821a86a
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Linux' && matrix.profile == 'full'
        with:
          repository: NeverSight/NeverD
          ref: cf7070f32ef716648478d178390c742cbaec5b21
          path: neverd-config
          sparse-checkout: |
            cmake
            CMakeLists.txt
          persist-credentials: false
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
          NATIVE_COMPILER: ${{ matrix.compiler }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: riscv-native-macos-records-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.compiler }}
          path: evidence
          retention-days: 7
