name: Isolate native MSVC code generation for the two changed vector readers
on:
  push:
    branches: [codex/msvc-reader-eligibility-objects]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2022, arch: amd64, profile: full, replica: 1 }
          - { host: windows-2022, arch: amd64_x86, profile: full, replica: 1 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          fetch-depth: 2
          ref: 0eb3f0239e28e965d432a964d2e7e6b15fdb8b4a
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare COFF sections, relocation targets and preprocessed tokens of both affected readers
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/run.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: msvc-eligibility-objects-${{ matrix.replica }}-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
