name: Time every affected standalone and mixed Clang build on real PE32 and AMD64 programs
on:
  push:
    branches: [codex/clear-record-portable-programs]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-22.04, arch: x86_64, profile: clang14, kind: standalone, replica: 1 }
          - { host: ubuntu-22.04, arch: x86_64, profile: clang14, kind: standalone, replica: 2 }
          - { host: ubuntu-22.04, arch: x86_64, profile: clang14, kind: product, replica: 1 }
          - { host: ubuntu-22.04, arch: x86_64, profile: clang14, kind: product, replica: 2 }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, kind: standalone, replica: 1 }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, kind: standalone, replica: 2 }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, kind: mixed, replica: 1 }
          - { host: ubuntu-24.04, arch: x86_64, profile: clang, kind: mixed, replica: 2 }
          - { host: macos-15-intel, arch: x86_64, profile: full, kind: standalone, replica: 1 }
          - { host: macos-15-intel, arch: x86_64, profile: full, kind: standalone, replica: 2 }
          - { host: macos-15-intel, arch: x86_64, profile: full, kind: product, replica: 1 }
          - { host: macos-15-intel, arch: x86_64, profile: full, kind: product, replica: 2 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          fetch-depth: 2
          ref: 3af4f18baa8c88ed070a71f48c53e28bb38f8fc7
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Time both library forms with the same executable names and frozen function ranges
        env:
          PROBE_CONFIG: ${{ matrix.kind }}
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/bootstrap.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: clear-portable-${{ matrix.kind }}-${{ matrix.replica }}-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
