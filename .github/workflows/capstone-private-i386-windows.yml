name: Check the i386 scalar and vector batch reader at inaccessible page boundaries on four native ABIs
on:
  push:
    branches: [codex/capstone-portable-i386-reader]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2022, arch: amd64 }
          - { host: windows-2022, arch: amd64_x86 }
          - { host: macos-15, arch: arm64 }
          - { host: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 989508842d378789f9d98465de059feb99913c96
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare original and candidate bytes and native tests
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: portable-reader-${{ matrix.host }}-${{ matrix.arch }}
          path: evidence
          retention-days: 7
