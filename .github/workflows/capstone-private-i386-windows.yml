name: Verify Capstone archive members separately from the updated x86 unit on Linux
on:
  push:
    branches: [codex/verify-ppc-and-vec-library-members]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, arch: x86_64, profile: clang }
          - { host: ubuntu-24.04-arm, arch: arm64, profile: clang }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: b0009d26a8c617b2328833c96291ac8264036866
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: library-member-config-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}
          path: evidence
          retention-days: 7
