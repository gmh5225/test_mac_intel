name: Compare GCC 12 and 14 RISC-V compaction on six independent runners
on:
  push:
    branches: [codex/riscv-compaction-gcc-generations]
    paths: [portable-next/**, .github/workflows/capstone-private-i386-windows.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc-12, variant: one }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc-12, variant: two }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc-12, variant: three }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc-14, variant: one }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc-14, variant: two }
          - { host: ubuntu-24.04, arch: amd64, profile: full, compiler: gcc-14, variant: three }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: portable-next
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 96d63971a2801bb17b4ade6a9697c19722e0438d
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Linux' && matrix.profile == 'full'
        with:
          repository: NeverSight/NeverD
          ref: 4a8792d7f80da91b1d852859abafe0684416b38a
          path: neverd-config
          sparse-checkout: |
            cmake
            CMakeLists.txt
          persist-credentials: false
      - name: Select the versioned compiler
        env:
          C_TOOL: ${{ matrix.compiler }}
        run: |
          version="${C_TOOL#gcc-}"
          if ! command -v "g++-$version" >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y "g++-$version"
          fi
          "$C_TOOL" -dumpfullversion
      - name: Compare original and candidate bytes and native tests
        env:
          SCAN_PROFILE: ${{ matrix.profile }}
          NATIVE_COMPILER: ${{ matrix.compiler }}
        run: python -B portable-next/verify.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rv-gcc-generation-${{ matrix.host }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.compiler }}-${{ matrix.variant }}
          path: evidence
          retention-days: 7
