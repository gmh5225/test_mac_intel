name: Verify generated vector output and iterator status in native four-backend profiles
on:
  push:
    branches: [codex/capstone-four-mode-vector-profiles]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, profile: adapter, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: diet, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: reduced, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: four, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: adapter, forms: combined, host: ubuntu-22.04 }
          - { cc: gcc, profile: diet, forms: combined, host: ubuntu-22.04 }
          - { cc: gcc, profile: reduced, forms: combined, host: ubuntu-22.04 }
          - { cc: gcc, profile: four, forms: combined, host: ubuntu-22.04 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 443006768b6518e28ba3fd10baacfbd7e4ba4914
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-vector-profiles-${{ matrix.host }}-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
