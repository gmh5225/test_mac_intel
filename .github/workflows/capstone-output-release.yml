name: Validate group-1, regenerated EVEX output and isolated AArch64 scan in Windows Release and DIET
on:
  push:
    branches: [codex/capstone-x86-group1-and-aarch64-release]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: MD, profile: dedicated, forms: group1 }
          - { cc: MT, profile: four, forms: group1 }
          - { cc: MD, profile: aarch64, forms: arm64 }
          - { cc: MT, profile: arm64-diet, forms: arm64 }
          - { cc: MT, profile: dedicated, forms: vector }
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: e2bfdc5ca6c847404c2c60e24fcb2567ac835ec6
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: output-release-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
