name: Verify isolated vector decoding against published group-1 release in profiles profiles
on:
  push:
    branches: [codex/capstone-isolated-vector-release]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: MD, profile: dedicated, forms: isolated }
          - { cc: MT, profile: four, forms: isolated }
          - { cc: MD, profile: intel, forms: isolated }
          - { cc: MD, profile: reduced, forms: isolated }
          - { cc: MT, profile: diet, forms: isolated }
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: f53af83fd00b3403be328033a285915da723d8dc
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: output-release-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
