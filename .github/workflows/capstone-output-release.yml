name: Qualify dedicated AArch64 defaults and mixed binary identity on profiles
on:
  push:
    branches: [codex/capstone-dedicated-aarch64-defaults-profiles]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: MD, profile: dedicated, forms: combined, host: windows-2022 }
          - { cc: MT, profile: four, forms: combined, host: windows-2022 }
          - { cc: MT, profile: diet, forms: combined, host: windows-2022 }
          - { cc: gcc, profile: dedicated, forms: combined, host: ubuntu-24.04 }
          - { cc: clang, profile: sanitize, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: dedicated, forms: combined, host: ubuntu-24.04-arm }
          - { cc: gcc, profile: diet, forms: combined, host: ubuntu-24.04-arm }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 01ce67005793c4369e64b509e5ec8f9cb2945d98
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dedicated-aarch64-config-${{ matrix.host }}-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
