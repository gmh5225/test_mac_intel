name: Verify MIPS public scan and callback behavior in DIET, mixed architecture, sanitizer and native MSVC profiles
on:
  push:
    branches: [codex/capstone-qualified-mips-profiles]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: MD, profile: dedicated, forms: mips, host: windows-2022 }
          - { cc: MT, profile: four, forms: mips, host: windows-2022 }
          - { cc: MD, profile: diet, forms: mips, host: windows-2022 }
          - { cc: gcc, profile: diet, forms: mips, host: ubuntu-24.04-arm }
          - { cc: clang, profile: sanitize, forms: mips, host: ubuntu-24.04-arm }
          - { cc: clang, profile: four, forms: mips, host: ubuntu-24.04-arm }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: b70c7e94528f1d9f4c7c424f65bbd513bbf32d47
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mips-release-profile-${{ matrix.host }}-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
