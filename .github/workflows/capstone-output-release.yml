name: Qualify the standalone x64 GCC reader and formatter against current Capstone next on profiles
on:
  push:
    branches: [codex/capstone-publish-dedicated-gcc-configs]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, profile: dedicated, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: adapter, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: diet, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: reduced, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: intel, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: four, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: sanitize, forms: combined, host: ubuntu-24.04 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 6289e7824d02cb7d45a67ec2d4df4b54036a04ce
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-gcc-config-${{ matrix.host }}-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
