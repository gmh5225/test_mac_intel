name: Validate constraint bounds and public iterator output across build profiles
on:
  push:
    branches: [codex/capstone-public-iterator-profiles]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2025, cc: MD, profile: normal, archs: four, forms: combined }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
      BUILD_ARCHS: ${{ matrix.archs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 25da25371c0e19e1cf57b394446e3f705cecd2a9
          path: source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - run: Get-CimInstance Win32_OperatingSystem | Select TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory | Format-List
        shell: pwsh
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-iterator-profiles-${{ matrix.host }}-${{ matrix.archs }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
