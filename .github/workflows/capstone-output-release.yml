name: Qualify integrated mixed GNU x86 scan and output on configs
on:
  push:
    branches: [codex/capstone-gnu-mixed-integrated-configs]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, profile: adapter, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: diet, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: reduced, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: four, forms: combined, host: ubuntu-24.04 }
          - { cc: gcc, profile: adapter, forms: combined, host: ubuntu-24.04-arm }
          - { cc: gcc, profile: diet, forms: combined, host: ubuntu-24.04-arm }
          - { cc: gcc, profile: reduced, forms: combined, host: ubuntu-24.04-arm }
          - { cc: gcc, profile: four, forms: combined, host: ubuntu-24.04-arm }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: ea3443bd943f583b65005dc1af9fae94850b6de7
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integrated-gnu-${{ matrix.host }}-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
