name: Validate dedicated GCC scan and complete vector and stack output under MSVC, DIET, reduced, adapters and sanitizers
on:
  push:
    branches: [codex/capstone-gcc-and-vex-release-profiles]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: MD, profile: dedicated, forms: vector, host: windows-2022 }
          - { cc: MT, profile: four, forms: vector, host: windows-2022 }
          - { cc: MD, profile: intel, forms: vector, host: windows-2022 }
          - { cc: MD, profile: reduced, forms: vector, host: windows-2022 }
          - { cc: MT, profile: diet, forms: vector, host: windows-2022 }
          - { cc: gcc, profile: diet, forms: gcc, host: ubuntu-24.04 }
          - { cc: gcc, profile: diet, forms: gcc, host: ubuntu-24.04-arm }
          - { cc: gcc, profile: reduced, forms: gcc, host: ubuntu-24.04 }
          - { cc: gcc, profile: reduced, forms: gcc, host: ubuntu-24.04-arm }
          - { cc: gcc, profile: adapter, forms: gcc, host: ubuntu-24.04 }
          - { cc: gcc, profile: adapter, forms: gcc, host: ubuntu-24.04-arm }
          - { cc: gcc, profile: sanitize, forms: gcc, host: ubuntu-24.04 }
          - { cc: gcc, profile: sanitize, forms: gcc, host: ubuntu-24.04-arm }
          - { cc: clang, profile: sanitize, forms: vector, host: ubuntu-24.04 }
          - { cc: gcc, profile: sanitize, forms: stack, host: ubuntu-24.04 }
          - { cc: MD, profile: four, forms: stack, host: windows-2022 }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: f53af83fd00b3403be328033a285915da723d8dc
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualified-${{ matrix.host }}-${{ matrix.forms }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
