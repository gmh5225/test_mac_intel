name: Compare complete Release libraries and object code with every Capstone backend enabled on Linux and macOS
on:
  push:
    branches: [codex/capstone-all-backends-binary-equivalence]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: gcc }
          - { host: macos-15, cc: clang }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 9eaea5dec6e4b3b20a1a9802678405ae4500b52f
          path: source
          persist-credentials: false
      - run: python3 capstone-output-release/compare-all.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: all-backends-${{ matrix.host }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
