name: Validate canonical memory immediate MOV across runtime and compiler profiles
on:
  push:
    branches: [codex/capstone-mov-memory-profiles]
    paths: [capstone-output-release/**, .github/workflows/capstone-output-release.yml]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-24.04, cc: clang, profile: diet, archs: four, forms: combined }
          - { host: ubuntu-24.04, cc: clang, profile: sanitize, archs: four, forms: combined }
          - { host: windows-2022, cc: MT, profile: normal, archs: four, forms: combined }
          - { host: windows-2022, cc: MD, profile: normal, archs: four, forms: combined }
          - { host: macos-15, cc: clang, profile: normal, archs: four, forms: combined }
          - { host: ubuntu-24.04, cc: clang, profile: normal, archs: extra, forms: combined }
          - { host: ubuntu-24.04, cc: gcc, profile: normal, archs: extra, forms: combined }
          - { host: ubuntu-24.04, cc: clang, profile: normal, archs: x86, forms: combined }
          - { host: ubuntu-24.04, cc: clang, profile: reduce, archs: four, forms: combined }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    env:
      TOOLCHAIN: ${{ matrix.cc }}
      FORMS: ${{ matrix.forms }}
      PROFILE: ${{ matrix.profile }}
      BUILD_ARCHS: ${{ matrix.archs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-output-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 25da25371c0e19e1cf57b394446e3f705cecd2a9
          path: source
          persist-credentials: false
      - run: python capstone-output-release/verify.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mov-memory-profiles-${{ matrix.host }}-${{ matrix.archs }}-${{ matrix.profile }}-${{ matrix.cc }}
          path: evidence/
          retention-days: 14
