name: Native macOS Swift captureWindow AX helpers
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-swift-capture-window-ax/**
      - .github/workflows/claude-macos-swift-capture-window-ax.yml
permissions:
  contents: read
jobs:
  components:
    name: Native macOS ${{ matrix.arch }} captureWindow AX helpers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Stage private input batch 1
        env:
          NDC_SWIFT_V64A1_000: ${{ secrets.NDC_SWIFT_V64A1_000 }}
          NDC_SWIFT_V64A1_001: ${{ secrets.NDC_SWIFT_V64A1_001 }}
          NDC_SWIFT_V64A1_002: ${{ secrets.NDC_SWIFT_V64A1_002 }}
          NDC_SWIFT_V64A1_003: ${{ secrets.NDC_SWIFT_V64A1_003 }}
        run: python3 -B macos-swift-capture-window-ax/run.py receive 0 4
      - name: Compare original AX sheets, summary and errors with parallel lifecycle fixtures
        run: python3 -B macos-swift-capture-window-ax/run.py ${{ matrix.arch }}
      - name: Export encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-${{ matrix.arch }}-swift-capture-window-ax-encrypted-${{ github.run_attempt }}
          path: swift-capture-window-ax-encrypted-records/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
