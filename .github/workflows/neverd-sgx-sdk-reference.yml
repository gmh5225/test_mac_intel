name: Intel SDK simulated enclave exception reference

on:
  push:
    branches: [codex/neverd-sgx-capabilities-20261109]
    paths:
      - neverd-sgx-sdk-reference/**
      - .github/workflows/neverd-sgx-sdk-reference.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-enclave:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned Intel simulation SDK
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o sdk.bin https://download.01.org/intel-sgx/sgx-linux/2.30.1/distro/ubuntu24.04-server/sgx_linux_x64_sdk_2.30.101.1.bin
          echo '5e3908ad32d271855a8d089da38e1d85590a1bb866452e9578fef198c5ed07d8  sdk.bin' | sha256sum --check
          bash sdk.bin --prefix "$RUNNER_TEMP"
      - name: Build and sign the x64 enclave
        run: |
          cp -R neverd-sgx-sdk-reference "$RUNNER_TEMP/exception-reference"
          cd "$RUNNER_TEMP/exception-reference"
          mkdir -p Include
          sample="$RUNNER_TEMP/sgxsdk/SampleCode/SampleEnclave"
          cp "$sample/Makefile" .
          cp "$sample/Enclave/Enclave.config.xml" "$sample/Enclave/Enclave.lds" Enclave/
          make -j2 SGX_SDK="$RUNNER_TEMP/sgxsdk" SGX_ARCH=x64 SGX_MODE=SIM
      - name: Check divide recovery, raw key statuses and a self-addressed report
        working-directory: ${{ runner.temp }}/exception-reference
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/sgxsdk/lib64:$RUNNER_TEMP/sgxsdk/sdk_libs"
          mkdir "$GITHUB_WORKSPACE/software-reference"
          set -o pipefail
          timeout 30 ./app | tee "$GITHUB_WORKSPACE/software-reference/receipts.txt"
          sha256sum app enclave.signed.so "$RUNNER_TEMP/sgxsdk/lib64/libsgx_urts_sim.so" > "$GITHUB_WORKSPACE/software-reference/artifacts.sha256"
          echo 'Intel SDK simulation checked two original-site divide retries, five raw EGETKEY errors and a self-addressed report with 64 bytes of caller data.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intel-sgx-simulation-reference
          path: software-reference/
          if-no-files-found: error
          retention-days: 14
