name: Public macOS Bfs source libraries
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-native-components/build_bfs_cross.py
      - macos-native-components/prepare_sdk.py
      - macos-native-components/macos-sdk-pins.json
      - macos-native-components/build-bfs-cross.sh
      - macos-native-components/export_bfs_cross.py
      - macos-native-components/qualify_bfs_native.py
      - macos-native-components/expected-bfs-version-*.txt
      - macos-native-components/compare_ugrep.py
      - macos-native-components/role-transport.c
      - macos-native-components/boundary-control.c
      - macos-native-components/original-pins.json
      - macos-native-components/macho_objects.py
      - macos-native-components/private_symbols.py
      - .github/workflows/claude-macos-bfs-library.yml
permissions:
  contents: read
jobs:
  build:
    name: Cross-build macOS ${{ matrix.arch }} Bfs source objects
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build from the same pinned public LLVM 23 compiler image
        run: python3 -B macos-native-components/build_bfs_cross.py --arch ${{ matrix.arch }} --output macos-bfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-darwin-${{ matrix.arch }}-bfs-source-library-${{ github.run_attempt }}
          path: macos-bfs/public-library/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain public cross-build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-darwin-${{ matrix.arch }}-bfs-cross-diagnostics-${{ github.run_attempt }}
          path: macos-bfs/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  native:
    name: Native macOS ${{ matrix.arch }} Bfs suites and original-role comparison
    needs: build
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-darwin-${{ matrix.arch }}-bfs-source-library-${{ github.run_attempt }}
          path: public-library
      - name: Install Bash required by the upstream test scripts
        run: brew install bash
      - name: Run Oniguruma, Bfs unit tests and both complete integration matrices
        run: python3 -B macos-native-components/qualify_bfs_native.py --arch ${{ matrix.arch }} --package public-library --output native-bfs-suite
      - name: Compare actual original Bfs and the fresh source-library host
        run: python3 -B macos-native-components/compare_ugrep.py --role bfs --arch ${{ matrix.arch }} --package public-library --output native-bfs-correspondence
      - name: Retain bounded native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-darwin-${{ matrix.arch }}-bfs-library-controls-${{ github.run_attempt }}
          path: |
            native-bfs-suite/diagnostics/
            native-bfs-correspondence/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  legacy-correspondence:
    name: Native macOS 15 ${{ matrix.arch }} original Bfs correspondence
    needs: build
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-darwin-${{ matrix.arch }}-bfs-source-library-${{ github.run_attempt }}
          path: public-library
      - name: Compare normal roles and the same original missing-API fault
        run: python3 -B macos-native-components/compare_ugrep.py --role bfs --arch ${{ matrix.arch }} --package public-library --output native-bfs-correspondence
      - name: Retain bounded original correspondence records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-darwin-${{ matrix.arch }}-bfs-macos15-correspondence-${{ github.run_attempt }}
          path: native-bfs-correspondence/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
