name: Native macOS Foundation URL control
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-foundation-url-control/**
      - .github/workflows/claude-macos-foundation-url.yml
permissions:
  contents: read
jobs:
  components:
    name: Native macOS ${{ matrix.arch }} Foundation URL control
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Stage private public-SDK probe
        env:
          NDC_SWIFT_V83U1_000: ${{ secrets.NDC_SWIFT_V83U1_000 }}
        run: python3 -B macos-foundation-url-control/run.py receive 0 1
      - name: Measure public Foundation URL facts
        run: python3 -B macos-foundation-url-control/run.py ${{ matrix.arch }}
      - name: Export encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-${{ matrix.arch }}-foundation-url-encrypted-${{ github.run_attempt }}
          path: foundation-url-encrypted-records/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
