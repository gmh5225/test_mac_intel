name: Native macOS input addon source and callback acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-input-addon-acceptance/**
      - .github/workflows/claude-macos-input-addon-acceptance.yml
permissions:
  contents: read
jobs:
  accept:
    name: Native macOS ${{ matrix.arch }} input source and callbacks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.2'
      - name: Pin public source and instruction-fixture toolchains
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          python3 -m pip install capstone==5.0.6 unicorn==2.1.4
      - name: Stage private input batch 1
        env:
          NDC_INPUT_V14_000: ${{ secrets.NDC_INPUT_V14_000 }}
          NDC_INPUT_V14_001: ${{ secrets.NDC_INPUT_V14_001 }}
          NDC_INPUT_V14_002: ${{ secrets.NDC_INPUT_V14_002 }}
          NDC_INPUT_V14_003: ${{ secrets.NDC_INPUT_V14_003 }}
          NDC_INPUT_V14_004: ${{ secrets.NDC_INPUT_V14_004 }}
          NDC_INPUT_V14_005: ${{ secrets.NDC_INPUT_V14_005 }}
          NDC_INPUT_V14_006: ${{ secrets.NDC_INPUT_V14_006 }}
          NDC_INPUT_V14_007: ${{ secrets.NDC_INPUT_V14_007 }}
        run: python3 -B macos-input-addon-acceptance/run.py receive 0 8
      - name: Stage private input batch 2
        env:
          NDC_INPUT_V14_008: ${{ secrets.NDC_INPUT_V14_008 }}
          NDC_INPUT_V14_009: ${{ secrets.NDC_INPUT_V14_009 }}
          NDC_INPUT_V14_010: ${{ secrets.NDC_INPUT_V14_010 }}
          NDC_INPUT_V14_011: ${{ secrets.NDC_INPUT_V14_011 }}
          NDC_INPUT_V14_012: ${{ secrets.NDC_INPUT_V14_012 }}
          NDC_INPUT_V14_013: ${{ secrets.NDC_INPUT_V14_013 }}
          NDC_INPUT_V14_014: ${{ secrets.NDC_INPUT_V14_014 }}
          NDC_INPUT_V14_015: ${{ secrets.NDC_INPUT_V14_015 }}
        run: python3 -B macos-input-addon-acceptance/run.py receive 8 8
      - name: Rebuild private addon twice and compare controlled native callbacks
        run: python3 -B macos-input-addon-acceptance/run.py ${{ matrix.arch }}
      - name: Export encrypted evidence and bounded aggregate only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-${{ matrix.arch }}-input-addon-encrypted-${{ github.run_attempt }}
          path: input-addon-encrypted-records/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
