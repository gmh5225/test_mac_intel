name: Darwin system signal cursor diagnosis
on:
  push:
    branches: [codex/neverd-arm64e-sigtramp-recovery]
    paths: [neverd-sigtramp-recovery/**, .github/workflows/neverd-sigtramp-recovery.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: 42e241cee0d12771d6accf198f0ca23f9b6799bc
          path: neverd
          persist-credentials: false
          sparse-checkout: |
            unittests/lift/aarch64
            include/neverd/runtime
            include/neverd/ir/intrinsics/AArch64
      - run: |
          ulimit -c 0
          python3 neverd-sigtramp-recovery/probe.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sigtramp-${{ matrix.runner }}
          path: sigtramp-recovery.json
          if-no-files-found: error
