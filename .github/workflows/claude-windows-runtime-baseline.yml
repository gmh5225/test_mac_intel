name: Public Windows Bun source baseline
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - platform-runtime/build_windows.py
      - .github/workflows/claude-windows-runtime-baseline.yml
permissions:
  contents: read
jobs:
  build:
    name: Native Windows ${{ matrix.arch }} public source baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
      - name: Rebuild the public engine with matching LLVM and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B platform-runtime/build_windows.py --arch ${{ matrix.arch }} --output windows-baseline
      - name: Retain the public source runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-win32-${{ matrix.arch }}-bun-baseline-${{ github.run_attempt }}
          path: windows-baseline/public-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-win32-${{ matrix.arch }}-bun-baseline-diagnostics-${{ github.run_attempt }}
          path: windows-baseline/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
