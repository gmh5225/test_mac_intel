name: WMF Simulator Block provider functions
on:
  push:
    branches: [codex/wmf-simulator-provider-inventory]
    paths:
      - .github/workflows/wmf-simulator-block-provider-functions.yml
      - wmf-block-provider-functions/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functions:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read matched Simulator provider functions and SDK declarations
        run: python3 -B wmf-block-provider-functions/collect.py
      - name: Preserve complete selected function bodies and static command receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wmf-static-platform7-block-provider-functions-${{ github.run_attempt }}
          path: wmf-block-provider-records/
          if-no-files-found: error
          retention-days: 14
