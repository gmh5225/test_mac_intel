name: Execute shared arm64e signing carriers and archived guests
on:
  push:
    branches: [codex/neverd-shared-carrier-model]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: neverd-signing-address
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gmh5225/test_mac_intel
          ref: 71b8ed7301f4e73fe63e1519fe926ba9405da55b
          path: model
          sparse-checkout: neverd-cpta
          persist-credentials: false
      - name: Execute published bodies and disabled-feature control
        run: python3 neverd-signing-address/run.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observable-signing-address
          path: reports/
          if-no-files-found: error
          retention-days: 7
