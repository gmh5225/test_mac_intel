name: Darwin arm64e interrupted return register
on:
  push:
    branches: [codex/neverd-arm64e-interrupt-probe]
    paths: [neverd-interrupt-probe/**, .github/workflows/neverd-interrupt-probe.yml]
permissions:
  contents: read
jobs:
  interrupt:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture genuine signal contexts across the signed frame
        run: python3 neverd-interrupt-probe/probe.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interrupt-probe-${{ matrix.runner }}
          path: interrupt-probe.json
          if-no-files-found: error
