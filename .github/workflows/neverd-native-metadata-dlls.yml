name: Verify system loaders for Windows ARM64 metadata declarations
on:
  push:
    branches: [codex/windows-native-metadata-dlls-20261124]
permissions:
  contents: read
jobs:
  loader:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve system exports and inspect calendar dates
        run: python native-metadata-loaders/observe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-arm64-metadata-loaders
          path: native-metadata.json
