name: Temporary native arm64e executable diagnostics
on:
  push:
    branches: [codex/neverd-arm64e-executable]
    paths: [neverd-arm64e-executable-replay/**, .github/workflows/neverd-arm64e-executable-replay.yml]
permissions:
  # Draft release assets are visible only to repository writers.
  contents: write
jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.policy.outputs.source_revision }}
      runners: ${{ steps.policy.outputs.runners }}
      legacy_runner: ${{ steps.policy.outputs.legacy_runner }}
      replay_timeout: ${{ steps.policy.outputs.replay_timeout }}
      legacy_timeout: ${{ steps.policy.outputs.legacy_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: policy
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('neverd-arm64e-executable-replay/Replay.def').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('source_revision', 'runners', 'legacy_runner', 'replay_timeout', 'legacy_timeout'):
                  value = policy[key]
                  print(key + '=' + (json.dumps(value) if isinstance(value, list) else str(value)), file=out)
          PYTHON
  legacy:
    needs: policy
    runs-on: ${{ needs.policy.outputs.legacy_runner }}
    timeout-minutes: ${{ fromJSON(needs.policy.outputs.legacy_timeout) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ needs.policy.outputs.revision }}
          path: neverd
          persist-credentials: false
      - run: python3 neverd/scripts/verify_arm64e_native.py legacy --output legacy-fixtures
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-fixtures
          path: legacy-fixtures/
          retention-days: 14
  replay:
    needs: [policy, legacy]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ fromJSON(needs.policy.outputs.replay_timeout) }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.policy.outputs.runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ needs.policy.outputs.revision }}
          path: neverd
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: legacy-fixtures
          path: legacy-fixtures
      - run: brew install cmake
      - run: python3 neverd-arm64e-executable-replay/run.py
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executable-replay-${{ matrix.runner }}
          path: executable-replay-evidence/
          retention-days: 14
