name: Source-built public rg crash isolation
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - seccomp-helper/native-rg-debug.py
      - .github/workflows/claude-native-rg-debug.yml
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Native ${{ matrix.arch }} public rg count isolation
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Read the exact admitted producer
        id: pins
        run: |
          python3 - <<'PY'
          import json,os
          p=json.load(open('seccomp-helper/source-runtime-pins.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(p['producer_run'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-linux-${{ matrix.arch }}-source-bun-runtime-1
          path: public-runtime-artifact
          run-id: ${{ steps.pins.outputs.run }}
          github-token: ${{ github.token }}
      - name: Rehash the entire public source runtime
        run: python3 -B seccomp-helper/source_runtime.py --arch ${{ matrix.arch }} --artifact public-runtime-artifact --output admitted-runtime
      - name: Install the native crash debugger
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
      - name: Diagnose the owned public count fixture
        run: |
          command -v gdb
          DIGEST=$(python3 -c 'import json,sys;print(json.load(open("seccomp-helper/source-runtime-pins.json"))["profiles"][sys.argv[1]]["binary_sha256"])' '${{ matrix.arch }}')
          python3 -B seccomp-helper/native-rg-debug.py --arch ${{ matrix.arch }} --runtime admitted-runtime/bun --sha256 "$DIGEST" --output public-rg-diagnostics
      - name: Retain only authored public-engine diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-linux-${{ matrix.arch }}-public-rg-diagnostics-${{ github.run_attempt }}
          path: |
            public-rg-diagnostics/
            admitted-runtime/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
