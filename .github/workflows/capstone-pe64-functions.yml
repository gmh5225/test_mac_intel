name: PE64 runtime function comparison
on:
  workflow_dispatch:
  push:
    branches: [codex/capstone-isolated-alias-functions]
permissions:
  contents: read
jobs:
  functions:
    runs-on: windows-2022
    env:
      CRT: ${{ matrix.crt }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        crt: [MD, MT]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - run: python capstone-performance/pe64-functions/measure.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isolated-alias-functions-${{ matrix.crt }}
          path: capstone-evidence/
          retention-days: 14
