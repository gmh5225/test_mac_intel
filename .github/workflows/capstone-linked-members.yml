name: Reproduce production archive member hashes for the qualified static decoder
on:
  push:
    branches: [codex/capstone-production-static-members]
    paths: [members/**, .github/workflows/capstone-linked-members.yml]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: members
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/capstone
          ref: 17f68720b746928d0628f4ed01664d43cb2ea350
          path: neverd/third_party/capstone
          persist-credentials: false
      - run: python3 -B members/check.py
      - if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/neverd"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clang18-four-isa-members
          path: evidence/
          retention-days: 14
