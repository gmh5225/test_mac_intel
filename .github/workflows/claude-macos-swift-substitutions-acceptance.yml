name: Native macOS Swift substitutions and Promise callback source and N-API acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-swift-substitutions-acceptance/**
      - .github/workflows/claude-macos-swift-substitutions-acceptance.yml
permissions:
  contents: read
jobs:
  accept:
    name: Native macOS ${{ matrix.arch }} Swift substitutions and Promise callback source and N-API
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.2'
      - name: Pin instruction-fixture toolchains
        run: |
          python3 -m pip install capstone==5.0.6 unicorn==2.1.4
      - name: Stage private input batch 1
        env:
          NDC_SWIFT_V23_000: ${{ secrets.NDC_SWIFT_V23_000 }}
          NDC_SWIFT_V23_001: ${{ secrets.NDC_SWIFT_V23_001 }}
          NDC_SWIFT_V23_002: ${{ secrets.NDC_SWIFT_V23_002 }}
          NDC_SWIFT_V23_003: ${{ secrets.NDC_SWIFT_V23_003 }}
          NDC_SWIFT_V23_004: ${{ secrets.NDC_SWIFT_V23_004 }}
          NDC_SWIFT_V23_005: ${{ secrets.NDC_SWIFT_V23_005 }}
          NDC_SWIFT_V23_006: ${{ secrets.NDC_SWIFT_V23_006 }}
          NDC_SWIFT_V23_007: ${{ secrets.NDC_SWIFT_V23_007 }}
        run: python3 -B macos-swift-substitutions-acceptance/run.py receive 0 8
      - name: Stage private input batch 2
        env:
          NDC_SWIFT_V23_008: ${{ secrets.NDC_SWIFT_V23_008 }}
          NDC_SWIFT_V23_009: ${{ secrets.NDC_SWIFT_V23_009 }}
          NDC_SWIFT_V23_010: ${{ secrets.NDC_SWIFT_V23_010 }}
          NDC_SWIFT_V23_011: ${{ secrets.NDC_SWIFT_V23_011 }}
          NDC_SWIFT_V23_012: ${{ secrets.NDC_SWIFT_V23_012 }}
          NDC_SWIFT_V23_013: ${{ secrets.NDC_SWIFT_V23_013 }}
          NDC_SWIFT_V23_014: ${{ secrets.NDC_SWIFT_V23_014 }}
          NDC_SWIFT_V23_015: ${{ secrets.NDC_SWIFT_V23_015 }}
        run: python3 -B macos-swift-substitutions-acceptance/run.py receive 8 8
      - name: Rebuild private Swift substitutions and Promise callbacks twice and compare actual N-API outputs
        run: python3 -B macos-swift-substitutions-acceptance/run.py ${{ matrix.arch }}
      - name: Export encrypted evidence and bounded aggregate only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-${{ matrix.arch }}-swift-substitutions-encrypted-${{ github.run_attempt }}
          path: swift-substitutions-encrypted-records/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
