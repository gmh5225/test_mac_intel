name: Native Darwin source client completion
on:
  workflow_dispatch:
  push:
    branches: [codex/claude-windows-recovery]
    paths:
      - macos-native-client-recovery/**
      - .github/workflows/claude-macos-native-clients.yml
permissions:
  contents: read
jobs:
  clients:
    name: Native Darwin ${{ matrix.arch }} integrated clients
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Authenticate private source, rebuild and collect native client evidence
        env:
          NDC_DARWIN_V82C3_KEY: ${{ secrets.NDC_DARWIN_V82C3_KEY }}
        run: python3 -B macos-native-client-recovery/run.py ${{ matrix.arch }}
      - name: Export authenticated encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-darwin-${{ matrix.arch }}-clients-encrypted-${{ github.run_attempt }}
          path: darwin-native-client-encrypted-records/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
