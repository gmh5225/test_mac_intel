name: Capstone formatter binary identity off MSVC
on:
  push:
    branches: [codex/capstone-formatter-binary-identity]
    paths: [capstone-performance/**, .github/workflows/capstone-formatter-identity.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { os: macos-15-intel, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: capstone-performance
          persist-credentials: false
      - name: Compare all target object, shared and static library bytes
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: python3 capstone-performance/msvc/identity.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: identity-${{ matrix.os }}-${{ matrix.cc }}
          path: capstone-evidence/
          retention-days: 14
