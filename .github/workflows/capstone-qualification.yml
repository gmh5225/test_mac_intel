name: Native Windows x86 lookup ownership diagnostic
on:
  push:
    branches: [codex/capstone-msvc-lookup-diagnosis]
    paths:
      - capstone-performance/**
      - .github/workflows/capstone-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: windows-2022, candidate: combined, preset: windows-release }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: capstone-performance
      - name: Build frozen source and run upstream tests
        run: python3 capstone-performance/qualify.py "${{ matrix.candidate }}" "${{ matrix.preset }}"
      - name: Keep test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-${{ matrix.candidate }}-${{ matrix.preset }}-${{ github.run_attempt }}
          path: capstone-evidence/
          retention-days: 14
