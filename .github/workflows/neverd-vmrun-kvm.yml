name: NeverD original VMRUN on hosted KVM

on:
  push:
    branches: [codex/neverd-sgx-capabilities-20261109]
    paths:
      - neverd-vmrun-kvm/**
      - .github/workflows/neverd-vmrun-kvm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-svm:
    name: KVM SVM / ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check host and guest CPU capabilities
        id: discovery
        run: |
          if test -c /dev/kvm && ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          python3 neverd-vmrun-kvm/check.py --report evidence/kvm-svm.json
      - name: Execute qualified guest images with KVM
        if: steps.discovery.outputs.available == 'true'
        run: |
          cc -std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -Werror neverd-vmrun-kvm/run.c -o "$RUNNER_TEMP/neverd-vmrun-kvm"
          sudo -u "$(id -un)" -g "$(stat -c %G /dev/kvm)" -- python3 neverd-vmrun-kvm/check.py \
            --guests neverd-vmrun-kvm/fixtures --runner "$RUNNER_TEMP/neverd-vmrun-kvm" --report evidence/kvm-svm.json
      - name: Retain KVM capability and original execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neverd-kvm-svm-${{ matrix.image }}-attempt-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
