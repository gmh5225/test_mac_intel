name: NeverD hosted 32-bit availability (not qualification)
on:
  workflow_dispatch:
  push:
    branches: [codex/neverd-native32-probe]
    paths:
      - 'native32/**'
      - '.github/workflows/neverd-native32-availability.yml'
permissions:
  contents: read
jobs:
  availability:
    name: Inventory ${{ matrix.profile }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            profile: linux
          - os: windows-11-arm
            profile: windows
          - os: macos-15-intel
            profile: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install ARM32 cross compiler for the static ISA probe
        if: matrix.profile == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gcc-arm-linux-gnueabihf
      - name: Inventory actual execution and SDK availability
        run: python native32/availability.py --profile ${{ matrix.profile }} --output native32-evidence
      - name: Preserve all observations, including unsupported prerequisites
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native32-availability-${{ matrix.profile }}-${{ github.sha }}
          path: native32-evidence
          if-no-files-found: error
