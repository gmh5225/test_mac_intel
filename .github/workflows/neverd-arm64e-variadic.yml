name: NeverD Darwin variadic stack and image publication
on:
  push:
    branches: [codex/neverd-variadic-stack-publication]
    paths: [neverd-arm64e-variadic/**, .github/workflows/neverd-arm64e-variadic.yml]
permissions:
  contents: write
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: source
        name: Read the immutable source revision
        run: python3 -c 'import json; print("revision=" + json.load(open("neverd-arm64e-variadic/Replay.def"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NeverSight/NeverD
          ref: ${{ steps.source.outputs.revision }}
          path: neverd
          persist-credentials: false
          sparse-checkout: |
            scripts
            unittests/lift/format
      - name: Exercise the compiler-original four-key PAC and signed exception controls
        run: |
          ulimit -c 0
          python3 neverd/scripts/verify_arm64e_native.py probe --output "$GITHUB_WORKSPACE/variadic-evidence/original-controls"
      - name: Verify and execute the source-bound Release test host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          brew list --versions zstd || brew install zstd
          ulimit -c 0
          python3 neverd-arm64e-variadic/run.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: variadic-${{ matrix.runner }}
          path: variadic-evidence/
          retention-days: 7
          if-no-files-found: error
